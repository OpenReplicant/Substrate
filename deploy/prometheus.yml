# Prometheus for the substrate: the model gateway's counters (S-05). `job` names the compose service,
# as kernel's observer expects (kernel deploy/demo/prometheus.yml).
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: bifrost
    metrics_path: /metrics
    static_configs:
      - targets: [bifrost:8080]
  # The OpenTelemetry collector's exporter (S-28): the call graph (traces_service_graph_*), per-service span
  # rates (traces_span_metrics_*) and what parts push as OTLP metrics (Claude Code's usage and cost).
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
