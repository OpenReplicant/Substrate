# The OpenTelemetry collector (S-28): every part that speaks OTLP sends here; the collector turns traces into
# the observed call graph and per-service rates, and hands metrics to Prometheus. Same file for both runtimes;
# what differs is in the environment (compose: listen on all interfaces inside the container; nomad: 127.0.0.1).
#
#   traces  -> servicegraph: traces_service_graph_request_total{client, server, connection_type} (who calls whom)
#           -> spanmetrics:  traces_span_metrics_calls_total{service_name, span_name, ...} (what each part does)
#   metrics -> Prometheus (Claude Code's usage and cost, Bifrost's pushed metrics)
#   logs    -> .state/otel/logs.jsonl (Claude Code's events: prompts, tool decisions; read later as episodes, spec 5)
#
# Service names are the catalog's component names (catalog-info.yaml), so observed and intended join by name;
# a part whose name it does not choose maps through the annotation substrate.dev/otel-service.
extensions:
  health_check:
    endpoint: ${env:OTEL_LISTEN_HOST}:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_LISTEN_HOST}:4317
      http:
        endpoint: ${env:OTEL_LISTEN_HOST}:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch: {}

connectors:
  servicegraph:
    # A client span with one of these and no instrumented server becomes a "virtual" node: a database, a model
    # provider behind the gateway, an outside API.
    virtual_node_peer_attributes: [peer.service, db.name, db.system, server.address, gen_ai.system, gen_ai.provider.name]
    store:
      ttl: 10s
      max_items: 10000
  spanmetrics: {}

exporters:
  prometheus:
    endpoint: ${env:OTEL_LISTEN_HOST}:8889
  file/logs:
    path: /otel/logs.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 5

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [servicegraph, spanmetrics]
    metrics:
      receivers: [otlp, servicegraph, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/logs]
