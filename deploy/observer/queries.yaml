# What kernel's metrics observer asks Prometheus each window (kernel D-52, D-100), for Substrate: the calls the
# OpenTelemetry collector saw (deploy/otel/collector.yaml). Each becomes an observed kkt:connectsTo claim between
# two catalog nodes, which map-drift compares with what catalog-info.yaml declares (step 2, S-33).
# {w} is the window in seconds; service names are catalog names, or a node's substrate.dev/otel-service.

# Client and server spans paired by the collector's servicegraph connector (includes virtual nodes such as a
# model provider or a database, named by peer attributes).
- edge: {from: client, to: server}
  query: sum by (client, server) (increase(traces_service_graph_request_total[{w}s]))

# The front door makes only server spans, named per route (deploy/caddy/Caddyfile: `tracing { span <part> }`).
- edge: {from: "=front-door", to: span_name}
  query: sum by (span_name) (increase(traces_span_metrics_calls_total{service_name="front-door"}[{w}s]))

