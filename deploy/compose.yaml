# Substrate's services, as an overlay on kernel's compose project (S-06), started by scripts/up.sh:
#
#   $CONTAINER_ENGINE compose -f repos/kernel/deploy/compose.yaml -f deploy/compose.yaml --env-file .env up -d
#
# Kernel's file comes first, so relative paths here resolve from repos/kernel/deploy/ (hence ../../../).
# Everything is published on 127.0.0.1 only:
#   console             http://127.0.0.1:8080/console/       (the front door, S-20, S-22)
#   kernel UI and MCP   http://127.0.0.1:8080/ui/            (the same front door)
#   model gateway       http://127.0.0.1:${BIFROST_PORT}/    (Claude Code: .../anthropic)
#   map                 http://127.0.0.1:${BACKSTAGE_PORT}/  (MCP: .../api/mcp-actions/v1)
#   Prometheus          http://127.0.0.1:${PROMETHEUS_PORT}/
#   OpenTelemetry       127.0.0.1:${OTEL_GRPC_PORT} (gRPC), :${OTEL_HTTP_PORT} (HTTP): Claude Code and anything on this machine
# Works with Docker or Podman (CONTAINER_ENGINE in .env, S-13).

name: knowledge-kernel          # the same project as kernel's stack

# Where parts send OpenTelemetry (S-28): the collector, over OTLP/HTTP; each part adds its catalog name.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

x-locked: &locked
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:

  # The front door (S-20): kernel's Caddy service with substrate's Caddyfile (kernel's routes plus /console) and,
  # when deploy/caddy/plugins.txt lists any, a Caddy built with them (scripts/build.sh caddy).
  caddy:
    image: ${FRONT_DOOR_IMAGE:-localhost/substrate-caddy:local}
    volumes: !override
      - ../../../deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: front-door
    depends_on: [kernel, console]

  # The console (S-22): live state for people, behind the front door at /console/. Runs in kernel's image
  # (its Python already has what the console needs) and reads this checkout read-only. Sign-in is kernel's.
  console:
    <<: *locked
    image: knowledge-kernel:local
    read_only: true
    user: nobody
    tmpfs: [/tmp]
    command: ["python3", "/console/server.py"]
    environment:
      RUNTIME: compose
      CONTAINER_ENGINE: ${CONTAINER_ENGINE:-podman}
      SUBSTRATE_BUS_PASSWORD: ${SUBSTRATE_BUS_PASSWORD:?set in .env}
      <<: *otel
      OTEL_SERVICE_NAME: console
    volumes:
      - ../../../services/console:/console:ro
      - ../../..:/substrate:ro
    depends_on: [kernel]

  # kernel reads what kk up scans from the host folder .state/artifacts (scripts/up.sh sets KK_ARTIFACTS to it),
  # in place of kernel's kk-artifacts volume, so the quote verifier sees the same files in either runtime.
  kernel:
    volumes:
      - ../../../.state/artifacts:/store:ro
    environment:       # traces to the collector (kernel D-97, S-28); ignored by a kernel image without the SDK
      <<: *otel
      OTEL_SERVICE_NAME: kernel

  # The model gateway (S-04, S-14). config.json is rendered by scripts/render_bifrost.py from .env (only the
  # providers you have keys for) and seeds Bifrost's own config store in its volume; later edits in its UI
  # persist there. Provider keys stay in the environment, referenced as env.NAME.
  bifrost:
    <<: *locked
    image: ${BIFROST_IMAGE:-maximhq/bifrost:v2.3.2}
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      BIFROST_VIRTUAL_KEY: ${BIFROST_VIRTUAL_KEY:?set in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OTEL_COLLECTOR_URL: http://otel-collector:4318/v1/traces     # Bifrost's otel plugin (render_bifrost.py)
    volumes:
      - bifrost-data:/app/data
      - ../../../.state/bifrost/config.json:/app/data/config.json:ro
    ports:
      - "127.0.0.1:${BIFROST_PORT:-8090}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"     # a model server on this machine (Ollama)
    networks: [default, gateway-metrics]

  # Scrapes the gateway's /metrics (S-05); kernel's observer reads it on kk-reach-prometheus.
  prometheus:
    <<: *locked
    image: ${PROMETHEUS_IMAGE:-quay.io/prometheus/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e}
    read_only: true
    user: nobody
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=7d"]
    volumes:
      - ../../../deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [default, gateway-metrics, kk-reach-prometheus]
    depends_on: [bifrost, otel-collector]

  # The map (S-12): Backstage built in containers from services/backstage (scripts/build.sh backstage), reading
  # catalog-info.yaml. Its MCP endpoint lets Claude Code query the catalog.
  backstage:
    <<: *locked
    image: ${BACKSTAGE_IMAGE:-localhost/substrate-backstage:local}
    command: ["node", "packages/backend", "--config", "app-config.yaml", "--config", "app-config.production.yaml",
              "--config", "app-config.substrate.yaml"]
    environment:
      BACKSTAGE_PORT: ${BACKSTAGE_PORT:-7007}
      BACKSTAGE_LISTEN: "0.0.0.0:7007"
      BACKSTAGE_MCP_TOKEN: ${BACKSTAGE_MCP_TOKEN:?set in .env}
      <<: *otel
      OTEL_SERVICE_NAME: map-view
      # zero-code instrumentation, installed in the image (services/backstage/packages/backend/package.json)
      NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
      OTEL_NODE_DISABLED_INSTRUMENTATIONS: fs,dns,net
    volumes:
      - ../../../catalog-info.yaml:/substrate/catalog-info.yaml:ro
    ports:
      - "127.0.0.1:${BACKSTAGE_PORT:-7007}:7007"

  # The OpenTelemetry collector (S-28): traces become the observed call graph and per-service rates for
  # Prometheus; Claude Code's events go to .state/otel/logs.jsonl. Published on 127.0.0.1 for the host's harness.
  otel-collector:
    <<: *locked
    image: ${OTEL_COLLECTOR_IMAGE:-docker.io/otel/opentelemetry-collector-contrib:0.163.2}
    read_only: true
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      OTEL_LISTEN_HOST: 0.0.0.0
    volumes:
      - ../../../deploy/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ../../../.state/otel:/otel
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"

volumes:
  bifrost-data:
  prometheus-data:

networks:
  gateway-metrics:
    internal: true
  kk-reach-prometheus:      # the network kernel's observer module joins (kernel D-52)
    internal: true
