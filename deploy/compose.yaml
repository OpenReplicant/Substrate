# Substrate's changes to kernel's compose project (S-06), started by scripts/up.sh:
#
#   $CONTAINER_ENGINE compose -f repos/kernel/deploy/compose.yaml -f deploy/compose.yaml --env-file .env up -d
#
# Kernel's file comes first, so relative paths here resolve from repos/kernel/deploy/ (hence ../../../).
# Kernel's stack is the whole stack (S-41): Postgres, kernel, and kernel's Caddy as the front door at
# http://127.0.0.1:8080 (UI at /ui/, MCP at /mcp). What substrate could add later is in catalog-info.yaml,
# system `options`.

name: knowledge-kernel          # the same project as kernel's stack

services:

  # kernel reads what kk up scans from the host folder .state/artifacts, in place of kernel's kk-artifacts
  # volume, so the quote verifier sees exactly what the tools container wrote. Its parts: kernel's default plus
  # map drift, which compares the map with what the repository has (skills, hooks; kernel D-102, spec step 2).
  kernel:
    command: ["kk", "serve", "--host", "0.0.0.0", "--only", "${KK_SERVE_PARTS:-mcp,validator,belief,recall,quotes,tms,conformance,learner,gaps,drift}"]
    volumes:
      - ../../../.state/artifacts:/store:ro
