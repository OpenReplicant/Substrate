# Substrate's stack on the fresh tree (S-137): Postgres, the model gateway, local models, the UI (S-140), and the
# companion (plan step 4): its environment's sensors and appliers, and its Claude Code session.
# SPARQL (deploy/ontop) and Caddy in front (deploy/caddy) come later (docs/plan.md 3b).
# Started by scripts/up.sh:
#
#   $CONTAINER_ENGINE compose -f deploy/compose.yaml --env-file .env up -d
#
# Everything is published on 127.0.0.1 only: Postgres at :${DB_PORT}, the gateway at :${GATEWAY_PORT}, the UI at
# :${UI_PORT}.

name: substrate

x-locked: &locked
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:

  # Postgres 17 with pgvector, pg_cron, pgmq and pgGraph (deploy/postgres/Dockerfile).
  # Database: substrate (the store, S-135; made by scripts/db.py init). v1's databases (workbench, and the
  # gateway's) stay in the same volume.
  db:
    build: ./postgres
    image: localhost/substrate-db:local
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron,graph", "-c", "cron.database_name=substrate"]
    environment:
      POSTGRES_DB: substrate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # The model gateway (spec step 18, S-77; Bifrost, picked in docs/archive/choices/model-gateway.yaml): every model call
  # goes through it with the caller's own key and is logged in its own database (gateway), without content, so a
  # call is counted by something other than its caller. Its config is rendered from .env and the callers in
  # scripts/gateway.py (scripts/gateway.py render); the rendered file wins at every start (source_of_truth, S-40).
  gateway:
    <<: *locked
    image: ${GATEWAY_IMAGE:-docker.io/maximhq/bifrost:v2.3.2}
    tmpfs: [/tmp, /app/data]
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set in .env}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?set in .env}
      STORE_EMBED_KEY: ${STORE_EMBED_KEY:?set in .env}
      COMPANION_SESSION_KEY: ${COMPANION_SESSION_KEY:?set in .env}
      COMPANION_TASK_KEY: ${COMPANION_TASK_KEY:?set in .env}
      VOICE_KEY: ${VOICE_KEY:?set in .env}
      COMPANION_AUTHOR_KEY: ${COMPANION_AUTHOR_KEY:?set in .env}
      JUDGE_KEY: ${JUDGE_KEY:?set in .env}
    volumes:
      - ../.state/gateway/config.json:/app/data/config.json:ro   # over the tmpfs: its stores are in Postgres
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8090}:8080"
    extra_hosts:
      - "host.containers.internal:host-gateway"     # a model server on this machine (Ollama), when OLLAMA_URL names it
    depends_on:
      db: {condition: service_healthy}

  # Local models (S-83; Ollama, MIT): the store's embeddings, and local models later. Reached
  # only through the gateway (OLLAMA_URL=http://ollama:11434), so every call is counted and nothing personal leaves
  # this machine. On the CPU, or a GPU when .env sets OLLAMA_GPU (deploy/compose.nvidia.yaml, S-84).
  ollama:
    image: ${OLLAMA_IMAGE:-docker.io/ollama/ollama:0.40.12}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"    # for pulling models; calls go through the gateway
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  # The Knowledge Kernel (S-153, S-154), the store: its own database `kernel` in the db above, from the image built out
  # of repos/kernel (scripts/build.sh kernel). kernel-init installs its schema and default modules (scripts/kernel.sh
  # init, once the database exists); kernel runs the validator that applies the change sets agents and the exporter
  # submit, as the kernel's one login, which switches to each part's own role (never a superuser). kernel-export is the
  # one-off exporter of the old `store` schema (scripts/kernel.sh export). The agents' MCP server is the stdio one,
  # started by scripts/kernel.sh mcp in the profile substrate (Substrate's nine tools). First deployed on Podman
  # 2026-11-21 (S-155).
  kernel-init:
    profiles: [kernel-admin]
    image: localhost/substrate-kernel:local
    command: ["kk", "init"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      KK_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set in .env}@db:5432/kernel
      KK_AUTHENTICATOR_PASSWORD: ${KK_AUTHENTICATOR_PASSWORD:?set in .env}
    depends_on:
      db: {condition: service_healthy}

  kernel:
    <<: *locked
    image: localhost/substrate-kernel:local
    command: ["kk", "serve", "--only", "validator"]
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgresql://kk_authenticator:${KK_AUTHENTICATOR_PASSWORD:?set in .env}@db:5432/kernel
      KK_JWT_SECRET: ${KK_JWT_SECRET:?set in .env}
    depends_on:
      db: {condition: service_healthy}

  kernel-export:
    profiles: [kernel-admin]
    image: localhost/substrate-kernel:local
    command: ["python3", "-m", "encoder_substrate"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgresql://kk_authenticator:${KK_AUTHENTICATOR_PASSWORD:?set in .env}@db:5432/kernel
      SUBSTRATE_STORE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set in .env}@db:5432/substrate
    depends_on:
      db: {condition: service_healthy}

  # The UI (S-140, S-141: Substrate's UI, no name of its own): the store's pages and maps, read-only, on the standard
  # library (ui/server.py) in the tools image. It sees only ui/ and reaches Postgres as db: the entities, pages and
  # maps from the kernel's read model (S-154), the companion's page from the substrate database.
  ui:
    <<: *locked
    image: localhost/substrate-tools:local
    command: ["python3", "-m", "ui.server"]
    working_dir: /app
    user: "65534:65534"
    environment:
      UI_HOST: 0.0.0.0
      UI_PORT: "8100"
      PYTHONDONTWRITEBYTECODE: "1"
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: substrate
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      OWNER_NAME: ${OWNER_NAME:-owner}
      STORE_BACKEND: ${STORE_BACKEND:-kernel}
      KERNEL_URL: ${KERNEL_URL:-}
      KK_AUTHENTICATOR_PASSWORD: ${KK_AUTHENTICATOR_PASSWORD:?set in .env}   # empty KERNEL_URL: the kernel's login, as ui/server.py kernel_url()
    volumes:
      - ../ui:/app/ui:ro
      - ../environment:/app/environment:ro      # the companion's page: what the owner says is published through it
      - ../store:/app/store:ro
    ports:
      - "127.0.0.1:${UI_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8100/api/wholes', timeout=3)\""]
      interval: 10s
      retries: 10
    depends_on:
      db: {condition: service_healthy}

  # The companion's environment (plan step 4): the clock, the gateway's meter of its calls, and the appliers of
  # its reply, budget and model actuators (environment/companion.py sense). Outside the companion's container, so
  # what it counts and what applies an approved proposal are not the model's to change.
  environment:
    <<: *locked
    image: localhost/substrate-tools:local
    command: ["python3", "-m", "environment.companion", "sense"]
    working_dir: /app
    user: "65534:65534"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      STORE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set in .env}@db:5432/substrate
      PGHOST: db
      GATEWAY_METER_PASSWORD: ${GATEWAY_METER_PASSWORD:?set in .env}
      COMPANION_CLOCK_MINUTES: ${COMPANION_CLOCK_MINUTES:-60}
      COMPANION_DAILY_TOKENS: ${COMPANION_DAILY_TOKENS:-2000000}
    volumes:
      - ../environment:/app/environment:ro
      - ../store:/app/store:ro
    depends_on:
      db: {condition: service_healthy}

  # The companion (S-136): Claude Code in tmux, fed by the channel, on the owner's own Claude login made once in it
  # (scripts/companion.sh login) and kept in its own home volume; models only through the gateway's pass-through
  # route under its own keys; the database only as the `companion` login. Nothing on the host is changed.
  companion:
    image: localhost/substrate-companion:local
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    tmpfs: [/tmp]
    environment:
      ANTHROPIC_BASE_URL: http://gateway:8080/anthropic_passthrough
      ANTHROPIC_CUSTOM_HEADERS: "x-bf-vk: ${COMPANION_SESSION_KEY:?set in .env}"
      COMPANION_TASK_KEY: ${COMPANION_TASK_KEY:?set in .env}
      COMPANION_AUTHOR_KEY: ${COMPANION_AUTHOR_KEY:?set in .env}
      COMPANION_MODEL: ${COMPANION_MODEL:-claude-haiku-5-5}
      STORE_URL: postgresql://companion:${COMPANION_DB_PASSWORD:?set in .env}@db:5432/substrate
    volumes:
      - companion-home:/home/companion
      - ../environment:/app/environment:ro
      - ../store:/app/store:ro
      - ../deploy/companion:/app/deploy/companion:ro
      - ../voice:/app/voice:ro                  # the reply component's code, for its author (environment/author.py)
    depends_on:
      db: {condition: service_healthy}
      gateway: {condition: service_started}

  # The judge (S-151): tests a component's new version against the active one on cases its author cannot read
  # (judge/cases, mounted here only; the record's held-out slice), as its own login, through the gateway on the
  # local model; a version it finds better becomes a proposal the owner decides. Profile `voice` (its first
  # component is the voice head's).
  judge:
    <<: *locked
    profiles: [voice]
    image: localhost/substrate-tools:local
    command: ["python3", "-m", "environment.judge"]
    working_dir: /app
    user: "65534:65534"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      STORE_URL: postgresql://judge:${JUDGE_DB_PASSWORD:?set in .env}@db:5432/substrate
      JUDGE_KEY: ${JUDGE_KEY:?set in .env}
      JUDGE_MODEL: local/${LLM_ALIAS:-gemma}
    volumes:
      - ../environment:/app/environment:ro
      - ../store:/app/store:ro
      - ../voice:/app/voice:ro
      - ../judge/cases:/cases:ro
    depends_on:
      db: {condition: service_healthy}

  # The local model (plan step 5): llama.cpp's server on the GPU (as deploy/compose.nvidia.yaml gives it to Ollama:
  # device nodes and the driver's libraries, no CDI, no root), serving LLM_MODEL from LLM_MODELS_DIR read-only.
  # Reached only through the gateway (provider local). Started with the profile `llm` (COMPOSE_PROFILES in .env).
  llm:
    profiles: [llm]
    image: ${LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda12-b12098}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    entrypoint: ["sh", "-c", "exec /app/llama-server -m \"/models/$$LLM_MODEL\" --host 0.0.0.0 --port 8080 --alias \"$$LLM_ALIAS\" --jinja $$LLM_ARGS"]
    environment:
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_ALIAS: ${LLM_ALIAS:-gemma}
      LLM_ARGS: ${LLM_ARGS:--ngl 999 --cpu-moe -c 16384 -ctk q4_0 -ctv q4_0 -fa auto}
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
    volumes:
      - ${LLM_MODELS_DIR:-/nonexistent}:/models:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-ptxjitcompiler.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      retries: 60

  # Text-to-speech on the GPU (S-150): Kokoro-FastAPI (Apache-2.0; espeak-ng inside, S-146), the owner's local
  # copy of ghcr.io/remsky/kokoro-fastapi-gpu:latest (v0.10.0, image fed40d86539c), beside the local model. The voice
  # head uses it when TTS_URL is set and falls back to Kokoro on the CPU when it does not answer. Profile `voice`.
  tts:
    profiles: [voice]
    image: ${TTS_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:latest}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
    volumes:
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-ptxjitcompiler.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1:ro
    healthcheck:
      # as a shell command: Podman splits a CMD list's Python one-liner at its spaces (seen 2026-11-18)
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8880/health', timeout=3)\""]
      interval: 10s
      retries: 30

  # The voice head (plan step 5, S-147): the companion's voice and face at 127.0.0.1:VOICE_PORT. Hears and speaks on
  # the CPU; talks with the local model through the gateway (voice:head, local only); hands real work to the
  # companion as the owner's message. Its models are fetched once into their own volume. Profile `voice`.
  voice:
    profiles: [voice]
    image: localhost/substrate-voice:local
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    tmpfs: [/tmp]
    environment:
      VOICE_HOST: 0.0.0.0
      VOICE_PORT: "8110"
      VOICE_KEY: ${VOICE_KEY:?set in .env}
      VOICE_STYLE: ${VOICE_STYLE:-af_heart}
      VOICE_THREADS: ${VOICE_THREADS:-4}
      VOICE_SILENCE_S: ${VOICE_SILENCE_S:-0.6}
      LLM_NAME: local/${LLM_ALIAS:-gemma}
      TTS_URL: ${TTS_URL:-}
      STORE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set in .env}@db:5432/substrate
    volumes:
      - voice-models:/models
      - ../voice:/app/voice:ro
    ports:
      - "127.0.0.1:${VOICE_PORT:-8110}:8110"
    depends_on:
      db: {condition: service_healthy}
      gateway: {condition: service_started}

volumes:
  voice-models:
    name: ${VOICE_VOLUME:-substrate_voice-models}   # Parakeet, Silero and Kokoro (about 230 MB), fetched once
  companion-home:
    name: ${COMPANION_VOLUME:-substrate_companion-home}   # its Claude login and its session's history
  ollama-models:
    name: ${OLLAMA_VOLUME:-substrate_ollama-models}   # the downloaded models; large, and only re-downloadable
  db-data:
    name: ${DB_VOLUME:-substrate_db-data}      # named, so a project-name change never orphans it
