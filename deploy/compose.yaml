# Substrate's stack on the fresh tree (S-137): Postgres, the model gateway, local models, the kernel and the UI (S-140).
# The old assistant's services (the companion, the voice head, the worker, the judge) were retired in S-194.
# SPARQL (deploy/ontop) comes later (docs/plan.md 3b); Caddy is the front door to the kernel's shell (S-199).
# Images (S-167): each service names its published image (ghcr.io/openreplicant/substrate-NAME:SUBSTRATE_IMAGE_TAG, the
# kernel's at KERNEL_IMAGE_TAG, both default main) and keeps its build: as the fallback. scripts/up.sh pulls first and builds
# what did not pull (SUBSTRATE_BUILD=1 builds all).
#
# Started by scripts/up.sh:
#
#   $CONTAINER_ENGINE compose -f deploy/compose.yaml --env-file .env up -d
#
# Everything is published on 127.0.0.1 only: Postgres at :${DB_PORT}, the gateway at :${GATEWAY_PORT}, the UI at
# :${UI_PORT}.

name: substrate

x-locked: &locked
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:

  # Postgres 17 with pgvector, pg_cron, pgmq and pgGraph (deploy/postgres/Dockerfile).
  # Database: substrate (the store, S-135; made by scripts/db.py init). v1's databases (workbench, and the
  # gateway's) stay in the same volume.
  db:
    image: ghcr.io/openreplicant/substrate-db:${SUBSTRATE_IMAGE_TAG:-main}
    build: {context: ./postgres, dockerfile: Dockerfile}
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron,graph", "-c", "cron.database_name=kernel"]   # one database (S-202)
    environment:
      POSTGRES_DB: substrate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # The model gateway (spec step 18, S-77; Bifrost, picked in docs/archive/choices/model-gateway.yaml): every model call
  # goes through it with the caller's own key and is logged in its own database (gateway), without content, so a
  # call is counted by something other than its caller. Its config is rendered from .env and the callers in
  # scripts/gateway.py (scripts/gateway.py render); the rendered file wins at every start (source_of_truth, S-40).
  gateway:
    <<: *locked
    image: ${GATEWAY_IMAGE:-docker.io/maximhq/bifrost:v2.3.2}
    tmpfs: [/tmp, /app/data]
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set in .env}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?set in .env}
      STORE_EMBED_KEY: ${STORE_EMBED_KEY:?set in .env}
    volumes:
      - ../.state/gateway/config.json:/app/data/config.json:ro   # over the tmpfs: its stores are in Postgres
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8090}:8080"
    extra_hosts:
      - "host.containers.internal:host-gateway"     # a model server on this machine (Ollama), when OLLAMA_URL names it
    depends_on:
      db: {condition: service_healthy}

  # Local models (S-83; Ollama, MIT): the store's embeddings, and local models later. Reached
  # only through the gateway (OLLAMA_URL=http://ollama:11434), so every call is counted and nothing personal leaves
  # this machine. On the CPU, or a GPU when .env sets OLLAMA_GPU (deploy/compose.nvidia.yaml, S-84).
  ollama:
    image: ${OLLAMA_IMAGE:-docker.io/ollama/ollama:0.40.12}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"    # for pulling models; calls go through the gateway
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  # The Knowledge Kernel (S-153, S-154), the store: its own database `kernel` in the db above, from the published kernel image
  # (or one built out of repos/kernel: scripts/build.sh kernel). kernel-init installs its schema and default modules (scripts/kernel.sh
  # init, once the database exists); kernel runs the validator that applies the change sets agents and the exporter
  # submit, as the kernel's one login, which switches to each part's own role (never a superuser). The agents' MCP server is the stdio one,
  # started by scripts/kernel.sh mcp in the profile substrate (Substrate's nine tools). First deployed on Podman
  # 2026-11-21 (S-155).
  kernel-init:
    profiles: [kernel-admin]
    image: ghcr.io/openreplicant/kernel:${KERNEL_IMAGE_TAG:-main}
    command: ["kk", "init"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      KK_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set in .env}@db:5432/kernel
      KK_AUTHENTICATOR_PASSWORD: ${KK_AUTHENTICATOR_PASSWORD:?set in .env}
    # Substrate's kernel modules, for `kk module install` (scripts/kernel.sh init; S-219)
    volumes:
      - ../environment:/substrate/environment:ro
    depends_on:
      db: {condition: service_healthy}

  # The environment as a kernel module (S-219; environment/module.yaml): a proposed action waits in the kernel's review
  # lane, a person decides it in the desktop's Review, and this service records that decision on the action. In the
  # kernel's image, with kk.lib, as every kernel module: the kernel's login, switched to the module's role.
  environment:
    <<: *locked
    image: ghcr.io/openreplicant/kernel:${KERNEL_IMAGE_TAG:-main}
    command: ["python3", "-m", "environment.review"]
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgresql://kk_authenticator:${KK_AUTHENTICATOR_PASSWORD:?set in .env}@db:5432/kernel
      KK_ROLE: kkm_environment
      PYTHONPATH: /substrate
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../environment:/substrate/environment:ro
    depends_on:
      db: {condition: service_healthy}

  kernel:
    <<: *locked
    image: ghcr.io/openreplicant/kernel:${KERNEL_IMAGE_TAG:-main}
    # MCP over HTTP and the kernel's UI shell at /ui (the kernel's D-44), reached through caddy (S-199)
    command: ["kk", "serve", "--host", "0.0.0.0", "--port", "8000", "--only", "mcp,validator"]
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgresql://kk_authenticator:${KK_AUTHENTICATOR_PASSWORD:?set in .env}@db:5432/kernel
      KK_JWT_SECRET: ${KK_JWT_SECRET:?set in .env}
      # its MCP's DNS-rebinding guard: the kernel's default list, and `kernel` without a port, as a router on the
      # stack's network sends it (agentgateway, S-204)
      KK_MCP_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,kernel:8000,kernel"
    # Substrate's own view modules, through the kernel's module contract (S-203, S-206): the shell lists and serves them
    volumes:
      - ../desktop/view-assistant:/kk/modules/view-assistant:ro
    depends_on:
      db: {condition: service_healthy}

  # Substrate's catalog into the kernel (S-176): encoder-backstage (the kernel's D-100) reads catalog/*.yaml, one Backstage
  # entity per file, as claims in Backstage's terms, each citing its file and line; each file is kept as an artifact in
  # the volume kernel-artifacts. An unchanged file submits nothing; a changed one supersedes what it said
  # (scripts/kernel.sh catalog). Profile kernel-admin: run, not kept running.
  kernel-catalog:
    profiles: [kernel-admin]
    image: ghcr.io/openreplicant/kernel:${KERNEL_IMAGE_TAG:-main}
    # --root /: files are recorded as substrate/catalog/<file> whatever the image's working directory (a different root
    # re-keys every file: the kernel's D-125 lesson)
    entrypoint: ["sh", "-c", "exec python3 -m encoder_backstage --project substrate --root / /substrate/catalog/*.yaml"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgresql://kk_authenticator:${KK_AUTHENTICATOR_PASSWORD:?set in .env}@db:5432/kernel
      KK_ARTIFACTS: /artifacts
    volumes:
      - ../catalog:/substrate/catalog:ro
      - kernel-artifacts:/artifacts
    depends_on:
      db: {condition: service_healthy}

  # The UI (S-140, S-141: Substrate's UI, no name of its own): the store's pages and maps, read-only, on the standard
  # library (ui/server.py) in the tools image. It sees only ui/ and reaches Postgres as db: the entities, pages and
  # maps from the kernel's read model (S-154).
  ui:
    <<: *locked
    image: ghcr.io/openreplicant/substrate-tools:${SUBSTRATE_IMAGE_TAG:-main}
    build: {context: ./tools, dockerfile: Containerfile}    # the fallback
    command: ["python3", "-m", "ui.server"]
    working_dir: /app
    user: "65534:65534"
    environment:
      UI_HOST: 0.0.0.0
      UI_PORT: "8100"
      PYTHONDONTWRITEBYTECODE: "1"
      PGHOST: db
      KERNEL_URL: ${KERNEL_URL:-}
      KK_AUTHENTICATOR_PASSWORD: ${KK_AUTHENTICATOR_PASSWORD:?set in .env}   # empty KERNEL_URL: the kernel's login, as ui/server.py kernel_url()
    volumes:
      - ../ui:/app/ui:ro
    ports:
      - "127.0.0.1:${UI_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8100/api/wholes', timeout=3)\""]
      interval: 10s
      retries: 10
    depends_on:
      db: {condition: service_healthy}

  # The MCP router (S-203, S-205; mcp-router/, Go): one MCP endpoint for agents and the desktop in front of every
  # connected MCP server. Tool calls are environment actions (environment/sql/010_mcp.sql): behind each tool's gate,
  # recorded, applied by the server's connector; its page (waiting calls, the record, the tools) is a desktop app.
  mcp-router:
    <<: *locked
    image: ghcr.io/openreplicant/substrate-mcp-router:${SUBSTRATE_IMAGE_TAG:-main}
    build: {context: ../mcp-router, dockerfile: Containerfile}    # the fallback
    command: ["serve"]
    environment:
      DATABASE_URL: postgresql://mcp_router:${MCP_ROUTER_DB_PASSWORD:?set in .env}@db:5432/kernel
      KK_JWT_SECRET: ${KK_JWT_SECRET:?set in .env}
      LISTEN: ":8090"
      FRAME_ANCESTORS: "http://127.0.0.1:${DESKTOP_PORT:-8080} http://localhost:${DESKTOP_PORT:-8080}"
    depends_on:
      db: {condition: service_healthy}

  # A connector per MCP server (S-205): the kernel's MCP over HTTP, each call made as its caller (a token for the
  # caller's role), so the kernel still decides what that caller may see and do.
  mcp-kernel:
    <<: *locked
    image: ghcr.io/openreplicant/substrate-mcp-router:${SUBSTRATE_IMAGE_TAG:-main}
    build: {context: ../mcp-router, dockerfile: Containerfile}
    command: ["connect", "--name", "kernel", "--url", "http://kernel:8000/mcp", "--list-role", "person_owner"]
    environment:
      DATABASE_URL: postgresql://mcp_connector:${MCP_CONNECTOR_DB_PASSWORD:?set in .env}@db:5432/kernel
      KK_JWT_SECRET: ${KK_JWT_SECRET:?set in .env}
    depends_on:
      db: {condition: service_healthy}
      kernel: {condition: service_started}

  # The desktop's server (S-206; desktop/server.py): the conversation between a person and the agents, as signals; MCP for
  # the router (say, show, ask, feed) and the chat view's API at /desktop/api/ on the desktop's origin (Caddy).
  desktop:
    <<: *locked
    image: ghcr.io/openreplicant/substrate-tools:${SUBSTRATE_IMAGE_TAG:-main}
    build: {context: ./tools, dockerfile: Containerfile}    # the fallback
    command: ["python3", "-m", "desktop.server"]
    working_dir: /app
    user: "65534:65534"
    environment:
      DATABASE_URL: postgresql://mcp_desktop:${MCP_DESKTOP_DB_PASSWORD:?set in .env}@db:5432/kernel
      KK_JWT_SECRET: ${KK_JWT_SECRET:?set in .env}
      PORT: "8095"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../desktop:/app/desktop:ro
    depends_on:
      db: {condition: service_healthy}

  # The desktop's connector to the router (S-205, S-206): its tools, each call signed as its caller.
  mcp-desktop:
    <<: *locked
    image: ghcr.io/openreplicant/substrate-mcp-router:${SUBSTRATE_IMAGE_TAG:-main}
    build: {context: ../mcp-router, dockerfile: Containerfile}
    command: ["connect", "--name", "desktop", "--url", "http://desktop:8095/mcp", "--list-role", "person_owner"]
    environment:
      DATABASE_URL: postgresql://mcp_connector:${MCP_CONNECTOR_DB_PASSWORD:?set in .env}@db:5432/kernel
      KK_JWT_SECRET: ${KK_JWT_SECRET:?set in .env}
    depends_on:
      db: {condition: service_healthy}
      desktop: {condition: service_started}

  # The front door (S-199): Caddy in front of the kernel's shell (/ui) and its MCP server (/mcp), on 127.0.0.1 only.
  # Pinned as the kernel's own deploy pins it (deploy/.env.example there). deploy/caddy/Caddyfile says what goes where.
  caddy:
    <<: *locked
    image: docker.io/library/caddy:2.11.7-alpine
    # the image's caddy binary carries the file capability cap_net_bind_service, which an unprivileged user cannot
    # take under no-new-privileges (exec fails): the container's root (the owner's own user under rootless Podman),
    # holding only that one capability
    cap_add: [NET_BIND_SERVICE]
    tmpfs: [/data, /config]
    environment:
      DESKTOP_PORT: ${DESKTOP_PORT:-8080}     # the desktop's origin, in frame-ancestors
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/apps.json:/etc/caddy/apps.json:ro
    # the desktop (DESKTOP_PORT on the host), then its framed apps on origins of their own (S-200); the Caddyfile and
    # apps.json name these ports
    ports:
      - "127.0.0.1:${DESKTOP_PORT:-8080}:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8083"
    depends_on: [kernel, gateway, ui, mcp-router]

  # The local slow model (plan step 5, S-169): llama.cpp's server, serving LLM_MODEL from LLM_MODELS_DIR read-only, by
  # default on the CPU and in RAM (LLM_ARGS -ngl 0) so the GPU stays free for the model that answers at once
  # (llm-fast). The GPU's device nodes and driver libraries are still given (as deploy/compose.nvidia.yaml gives them to
  # Ollama: no CDI, no root) for a machine that wants layers there. Reached only through the gateway (provider local).
  # Started with the profile `llm` (COMPOSE_PROFILES in .env).
  llm:
    profiles: [llm]
    image: ${LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda12-b12627}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    entrypoint: ["sh", "-c", "exec /app/llama-server -m \"/models/$$LLM_MODEL\" --host 0.0.0.0 --port 8080 --alias \"$$LLM_ALIAS\" --jinja $$LLM_ARGS"]
    environment:
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_ALIAS: ${LLM_ALIAS:-slow}
      LLM_ARGS: ${LLM_ARGS:--ngl 0 --no-op-offload -t 6 -c 16384 -b 512 -ub 128 -ctk q4_0 -ctv q4_0 -fa on}
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
    volumes:
      - ${LLM_MODELS_DIR:-/nonexistent}:/models:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-ptxjitcompiler.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      retries: 60

  # The local fast model (S-169): a small model wholly on the GPU for what must answer at once (quick decisions and tool
  # calls); the slow model takes the bigger jobs on the CPU. LLM_FAST_MODEL from LLM_FAST_MODELS_DIR,
  # read-only; at the gateway as fast/LLM_FAST_ALIAS. Profile `llm`; empty LLM_FAST_MODEL: it is not started.
  llm-fast:
    profiles: [llm]
    image: ${LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda12-b12627}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    entrypoint: ["sh", "-c", "[ -n \"$$LLM_MODEL\" ] || { echo 'LLM_FAST_MODEL is empty: no fast model'; exec sleep infinity; }; exec /app/llama-server -m \"/models/$$LLM_MODEL\" --host 0.0.0.0 --port 8080 --alias \"$$LLM_ALIAS\" --jinja $$LLM_ARGS"]
    environment:
      LLM_MODEL: ${LLM_FAST_MODEL:-}
      LLM_ALIAS: ${LLM_FAST_ALIAS:-fast}
      LLM_ARGS: ${LLM_FAST_ARGS:--ngl 999 -t 2 -c 32768 -fa on -ctk q8_0 -ctv q8_0}
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
    volumes:
      - ${LLM_FAST_MODELS_DIR:-/nonexistent}:/models:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
      - ${NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-ptxjitcompiler.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1:ro
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$LLM_MODEL\" ] || curl -sf http://127.0.0.1:8080/health"]
      interval: 5s
      retries: 60

volumes:
  kernel-artifacts:
    name: ${KERNEL_ARTIFACTS_VOLUME:-substrate_kernel-artifacts}   # the kernel's artifact store: catalog files as they were read
  ollama-models:
    name: ${OLLAMA_VOLUME:-substrate_ollama-models}   # the downloaded models; large, and only re-downloadable
  db-data:
    name: ${DB_VOLUME:-substrate_db-data}      # named, so a project-name change never orphans it
