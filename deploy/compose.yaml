# Substrate's changes to kernel's compose project (S-06), started by scripts/up.sh:
#
#   $CONTAINER_ENGINE compose -f repos/kernel/deploy/compose.yaml -f deploy/compose.yaml --env-file .env up -d
#
# Kernel's file comes first, so relative paths here resolve from repos/kernel/deploy/ (hence ../../../).
# The stack (S-41, S-53): kernel's Postgres, kernel, and kernel's Caddy as the front door at
# http://127.0.0.1:8080 (kernel's UI at /ui/, MCP at /mcp), plus Workbench's API, PostgREST, at /api/ over its own
# database on the same Postgres. What substrate could add later is in catalog-info.yaml, system `options`.

name: knowledge-kernel          # the same project as kernel's stack

services:

  # kernel reads what kk up scans from the host folder .state/artifacts, in place of kernel's kk-artifacts
  # volume, so the quote verifier sees exactly what the tools container wrote. Its parts: kernel's default plus
  # map drift, which compares the map with what the repository has (skills, hooks; kernel D-102, spec step 2).
  kernel:
    command: ["kk", "serve", "--host", "0.0.0.0", "--only", "${KK_SERVE_PARTS:-mcp,validator,belief,recall,quotes,tms,conformance,learner,gaps,drift}"]
    volumes:
      - ../../../.state/artifacts:/store:ro

  # The front door (deploy/caddy/Caddyfile): Workbench's shell at /, its API at /api, plugins' web files, kernel at /ui.
  caddy:
    volumes: !override
      - ../../../deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../../workbench/web:/srv/wb:ro          # the shell
      - ../../../plugins:/srv/plugins:ro           # installed plugins; only each one's web/ is served
    environment:
      WB_FRAME_SRC: ${WB_FRAME_SRC:-}              # origins apps may be framed from, beyond this one
    depends_on: [kernel, postgrest]

  # Workbench's API (workbench/BRIEF.md section 7): PostgREST over the `api` schema of the workbench database,
  # which `scripts/workbench.sh migrate` creates. It switches each request to the role in its JWT; requests
  # without one run as wb_anon, which may only sign in. It retries until the database and its login exist.
  postgrest:
    image: ${POSTGREST_IMAGE:-docker.io/postgrest/postgrest:v16.5}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://wb_authenticator:${WORKBENCH_AUTHENTICATOR_PASSWORD:?set in .env}@db:5432/workbench
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: wb_anon
      PGRST_JWT_SECRET: ${WORKBENCH_JWT_SECRET:?set in .env}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://127.0.0.1:8080/api
    depends_on:
      db: {condition: service_healthy}
