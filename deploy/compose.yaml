# Substrate's stack (S-57): Workbench on Postgres, and the front door. Started by scripts/up.sh:
#
#   $CONTAINER_ENGINE compose -f deploy/compose.yaml --env-file .env up -d
#
# Everything is published on 127.0.0.1 only: the front door at :8080 (the shell at /, the API at /api, the server
# at /wb/api, SPARQL at /sparql), Postgres at :${DB_PORT}.

name: substrate

x-locked: &locked
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:

  # Postgres 17 with pgvector, pg_cron, pgmq and pgGraph (deploy/postgres/Dockerfile).
  # Database: workbench (Workbench's store).
  db:
    build: ./postgres
    image: localhost/substrate-db:local
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron,graph", "-c", "cron.database_name=workbench"]
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Workbench's API (workbench/BRIEF.md section 7): PostgREST over the `api` schema of the workbench database,
  # which `scripts/workbench.sh migrate` creates. It switches each request to the role in its JWT; requests
  # without one run as wb_anon, which may only sign in. It retries until the database and its login exist.
  postgrest:
    <<: *locked
    image: ${POSTGREST_IMAGE:-docker.io/postgrest/postgrest:v16.5}
    environment:
      PGRST_DB_URI: postgresql://wb_authenticator:${WORKBENCH_AUTHENTICATOR_PASSWORD:?set in .env}@db:5432/workbench
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: wb_anon
      PGRST_JWT_SECRET: ${WORKBENCH_JWT_SECRET:?set in .env}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://127.0.0.1:8080/api
    depends_on:
      db: {condition: service_healthy}

  # Workbench's server (workbench/workbench/server.py, its own image workbench/Containerfile): plugins' Python,
  # extractors off the pgmq queue `wb_jobs`, NOTIFY relayed as Server-Sent Events, and MCP for agents, all behind
  # the same JWT PostgREST checks.
  workbench:
    <<: *locked
    build: {context: ../workbench, dockerfile: Containerfile}
    image: localhost/workbench:local
    user: nobody
    tmpfs: [/tmp]
    environment:
      WORKBENCH_DATABASE_URL: postgresql://wb_server:${WORKBENCH_SERVER_PASSWORD:?set in .env}@db:5432/workbench
      WORKBENCH_JWT_SECRET: ${WORKBENCH_JWT_SECRET:?set in .env}
      WB_POSTGREST_URL: http://postgrest:3000
      WB_PLUGINS_DIR: /srv/substrate/plugins
      WB_SUBSTRATE_ROOT: /srv/substrate        # what substrate's extractors read: this checkout, read-only
    volumes:
      - ..:/srv/substrate:ro
    depends_on:
      db: {condition: service_healthy}

  # The graph endpoint (spec step 7; Ontop, picked in S-59): SPARQL over Workbench's live tables, read-only as
  # wb_reader, reasoning over the vocabulary at query time. Its mapping and ontology are generated from Workbench's
  # terms (scripts/graph.sh, into .state/graph); dev mode reloads them when they change. Caddy serves it at /sparql.
  graph:
    <<: *locked
    build: {context: ./ontop, dockerfile: Containerfile}
    image: localhost/substrate-graph:local
    tmpfs: [/tmp]
    environment:
      ONTOP_MAPPING_FILE: /graph/mapping.obda
      ONTOP_ONTOLOGY_FILE: /graph/ontology.ttl
      ONTOP_DB_URL: jdbc:postgresql://db:5432/workbench
      ONTOP_DB_USER: wb_reader
      ONTOP_DB_PASSWORD: ${WORKBENCH_READER_PASSWORD:?set in .env}
      ONTOP_DB_DRIVER: org.postgresql.Driver
      ONTOP_DEV_MODE: "true"
      ONTOP_WAIT_FOR: db:5432
      ONTOP_LOG_LEVEL: warn
    volumes:
      - ../.state/graph:/graph:ro
    depends_on:
      db: {condition: service_healthy}

  # The front door (deploy/caddy/Caddyfile): the shell at /, plugins' web files, /api to PostgREST, /wb/api to the
  # server. The stock Caddy image; the shell's page is a Caddy template that finds the installed plugins.
  caddy:
    image: ${CADDY_IMAGE:-docker.io/library/caddy:2.11.7-alpine}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../workbench/web:/srv/wb:ro              # the shell
      - ../plugins:/srv/plugins:ro               # installed plugins; only each one's web/ is served
    environment:
      WB_FRAME_SRC: ${WB_FRAME_SRC:-}            # origins apps may be framed from, beyond this one
      PUBLIC_HOST: ${PUBLIC_HOST:-:80}           # a public host name for HTTPS (then also publish ports 80 and 443)
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [postgrest, workbench, graph]
    restart: unless-stopped

volumes:
  db-data:
    name: ${DB_VOLUME:-substrate_db-data}      # named, so a project-name change never orphans it
