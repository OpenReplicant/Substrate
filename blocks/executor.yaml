# The default executor as a catalog entry (S-157c): one per layer of a map, chosen from the catalog, swappable.
name: default-runner
version: 0.1.0
description: Runs a plan step by step in dependency order, in a subprocess per block, behind the gate for blocks that change the world.
kind: executor
layer: code
entry: blocks.run:Executor
plan_format: p-plan (JSON, blocks/__init__.py)
runs: [python, command]
refuses: [http, mcp]
enforces: [timeout_s, retry-once-if-idempotent, changes_world-through-an-Env-actuator]
