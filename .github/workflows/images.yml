# Publishes Substrate's own images to GHCR (S-167): what scripts/up.sh pulls instead of building. Pushes only from this
# repository's main branch and v* tags; a pull request builds the images without pushing, and not at all when it comes
# from a fork. The voice head is not published (S-167: it carries GPL parts, so it stays a local build). The kernel's image
# is the Knowledge Kernel repository's own (ghcr.io/openreplicant/kernel); the worker is built on it.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.name }} image
    # no run for a pull request from a fork (its token cannot publish, and its code is not ours to build here)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN may push to ghcr.io/openreplicant/* once the package allows this repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: db, context: deploy/postgres, file: deploy/postgres/Dockerfile}
          - {name: tools, context: deploy/tools, file: deploy/tools/Containerfile}
          - {name: companion, context: deploy/companion, file: deploy/companion/Containerfile}
          - {name: worker, context: deploy/worker, file: deploy/worker/Containerfile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/openreplicant/substrate-${{ matrix.name }}
          # main (the branch), the short commit, and the version tag as pushed (v1.2.3) and without the v
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=
            type=ref,event=tag
            type=semver,pattern={{version}}
      # signed in on a pull request too: the worker's base image is the kernel's, which may be private until made public
      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push, except on a pull request)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
