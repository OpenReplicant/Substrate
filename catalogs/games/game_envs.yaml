# Game environments where a software agent can play as a player (alone, or with or against humans).
# Every fact comes from a page read during this session (URLs in each entry's sources).
# "unknown" = not stated on the pages read. Pages that returned 403/404 are named in the entry.
# Read date: 2026-11-21 (captured page footers show GitHub's own copyright year only, not project dates).

summary:
  best_for_coop_with_human:
    - name: Overcooked-AI
      why: "README calls it a benchmark for fully cooperative human-AI task performance and links human-human and human-AI gameplay data plus a playable demo with agents."
      source: https://github.com/HumanCompatibleAI/overcooked_ai
    - name: Google Research Football
      why: "README says human-controlled players use the same interface as agents and that gamepad, external bots and agents are all supported player types, with both sides controllable at once. Repo is archived (Aug 19, 2026)."
      source: https://github.com/google-research/football
    - name: Mineflayer / Mindcraft
      why: "Bots join online-mode Minecraft servers with a Microsoft account (Mineflayer README, Mindcraft README). Mindcraft warns against public servers with coding enabled, so co-op is possible but needs care. Co-op behaviour itself is unknown from these pages."
      source: https://github.com/PrismarineJS/mineflayer ; https://github.com/mindcraft-bots/mindcraft
  best_measurable_scores:
    - name: MineDojo
      why: "README: 3142 tasks in the current release (1581 programmatic, 1560 creative, 1 playthrough), Gym-style interface."
      source: https://github.com/MineDojo/MineDojo
    - name: Crafter
      why: "README defines a score as the geometric mean of achievement success rates, with a 17-action discrete space and 64x64x3 image observations."
      source: https://github.com/danijar/crafter
    - name: TextArena
      why: "README advertises 100+ single, two and multi-player text games with a public leaderboard at textarena.ai/leaderboard (scoring method not stated on the README)."
      source: https://github.com/LeonGuertler/TextArena
    - name: BALROG
      why: "README points to a leaderboard at balrogai.com; the benchmark games and scoring are not stated on the README."
      source: https://github.com/balrog-ai/BALROG
    - name: SMAC
      why: "Cooperative multi-agent micromanagement benchmark on StarCraft II (README); the win-rate metric is not stated on the README page read."
      source: https://github.com/oxwhirl/smac
  cheapest_to_start_locally:
    - name: Overcooked-AI
      why: "MIT licence, a Python benchmark with no commercial game to own (README)."
      source: https://github.com/HumanCompatibleAI/overcooked_ai
    - name: Crafter
      why: "MIT licence, open-world survival in a 2D Gym-style environment with no game to buy (README)."
      source: https://github.com/danijar/crafter
    - name: PettingZoo
      why: "MIT licence, multi-agent Gymnasium-like library with cooperative Butterfly and SISL environments (README). Note the install size of each family is unknown."
      source: https://github.com/Farama-Foundation/PettingZoo
  gaps:
    - "No Lichess bot API page could be read: lichess.org/api returned 403 and github.com/lichess-org/lichess-bot returned 404. Lichess rules for bots are therefore unconfirmed."
    - "Valve's Dota 2 scripting wiki returned 403; the Dota entry relies on the community moddota docs. Official-match bot rules are unknown."
    - "Screeps Terms of Service and Introduction pages could not be read (404, and an overview page only). Bot rules on the official server are unknown."
    - "Factorio: the RCON settings are confirmed from the wiki command-line page, but no page read states whether RCON is used by any agent project, and Factorio's price is unknown."
    - "Among Us: only the AmongAgents repo was read. Golechha and Milkowski/Weninger papers were seen as search snippets only and their code is unverified."
    - "GameBench: the Joshuaclymer README did not list its games. The 9-environment count comes from a search snippet and the arXiv abstract page was not fetched."
    - "Diplomacy: the Cicero repo is archived and its webDiplomacy connection details are not documented on the README."
    - "Pokemon Showdown bot rules: the official bot policy was not found. A Smogon forum post mentions a mandatory bot registry; it is unverified and not linked to an official page."
    - "Most repos show no release or commit date in the captured page, so activity is marked unknown unless an archive notice says otherwise."
    - "No entry was run or downloaded; no install was attempted."

