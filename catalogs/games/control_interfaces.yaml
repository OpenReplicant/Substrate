policy_notes:
  - who: Ubisoft (Rainbow Six Siege)
    quote: 'Using adapters or devices to run macros, rapid-fire scripts, or automation; Using bots, scripts, or automation to mimic player behavior and farm XP or resources' 
    source: ubisoft.com player protection core rules (read by the researcher; not re-checked)
  - who: Bungie (Destiny 2)
    quote: "programmable controllers, keyboard and mouse adapters, advanced macros, or automation via artificial intelligence"
    source: Kotaku, 2023-04-14, reporting Bungie's policy (secondary); applies in PvE too
