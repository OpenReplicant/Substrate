  - id: vrchat-osc
    name: "VRChat OSC (avatar parameters, input, chatbox)"
    kind: B
    platform: "VRChat"
    urls:
      - "https://docs.vrchat.com/docs/osc-overview"
      - "https://docs.vrchat.com/docs/osc-as-input-controller"
      - "https://docs.vrchat.com/docs/osc-avatar-parameters"
    connection:
      protocol: "OSC. Default receive port 9000, send port 9001 (--osc=9000:127.0.0.1:9001). Transport UDP not named on the page."
      observe: "Avatar parameters the avatar sends; read-only built-in parameters (Animator Parameters page)"
      do: "/input axes (Vertical, Horizontal, LookHorizontal, MoveHoldFB, spin axes) and buttons (MoveForward, Jump, Run, UseRight, GrabLeft ...), /chatbox/input (max 144 characters, 9 lines), /chatbox/typing, custom avatar parameters"
    shared_control: "Input endpoints drive the local player, so an agent can share the controller with a person only if both send to the same client. Not documented as a shared-control feature."
    multiplayer_presence: "Yes in effect: the agent runs as the logged-in user's own client and avatar. A second account is not documented."
    permissions: "Enable in the Action Menu under Osc > Enabled"
    official_or_community: official
    licence: "not applicable (proprietary client)"
    last_release_or_commit: "not applicable to docs; docs are current"
    policy: "Terms section 13.2(j) (fetched via hello.vrchat.com/legal) prohibits any robot, spambot, spider, crawler, scraper or other automated means or interface not provided by VRChat, and any engine, software tool, agent, device or mechanism not provided by VRChat to access the Platform. Section 13.2(i) bans access inconsistent with individual human usage. Section 13.3 says anti-cheat may detect modified clients (Mods). Section 12 bans modification and circumvention. OSC is documented, but the terms' wording on agents still applies; ask VRChat before running an agent."
    latency: "Real time over UDP per OSC; no figures on the page"
    sources:
      - "https://docs.vrchat.com/docs/osc-overview (read: ports, enabling, scope)"
      - "https://docs.vrchat.com/docs/osc-as-input-controller (read: endpoints, chatbox limits)"
      - "https://docs.vrchat.com/docs/osc-avatar-parameters (search snippet only: /avatar/change, JSON mappings)"
      - "https://hello.vrchat.com/legal (read: links to Terms; Terms text with sections 12, 13.2, 13.3 returned in that fetch)"

