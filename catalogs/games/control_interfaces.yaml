# Control interfaces for software agents in games and virtual worlds
# Research catalog. Every fact comes from a page read during this session (URL in `sources`).
# "unknown" = not confirmed from a page read. Dates are the ones the page showed; "not shown" = the page showed none.
# Fetch date context: 2026-11-21.

summary:
  best_for_copiloting_a_persons_controller:
    - name: "Xbox Controller Assist (Copilot)"
      why: "Built into Xbox for two controllers acting as one. A person and a helper share one character. Shipped by the platform, no code needed. Limits on PC and on which platforms are not confirmed from a page."
    - name: "Virtual gamepad on Linux via uinput"
      why: "An agent process can create a virtual gamepad or keyboard device and write input events. Works on any Linux game that reads evdev. Needs device permissions. The kernel page does not show whether root or a group is needed."
    - name: "RetroArch Network Control Interface (UDP 55355)"
      why: "Documented UDP commands for pause, save state, frame advance and reading or writing core memory. Good for emulated games and for an agent that reads state directly. Keep it on localhost, as the page gives no authentication."
    - name: "VRChat OSC input endpoints"
      why: "Documented /input axes and buttons for movement and actions, plus the chatbox. A person's client can accept an agent's OSC input. VRChat ToS bans automation, so use only where the platform allows it."
  best_for_agent_as_own_avatar_in_social_world:
    - name: "ChilloutVR OSC (/input and /avatar/parameters)"
      why: "Documented OSC input and avatar parameter endpoints, with OSCQuery discovery. Use with care: the official page calls it a first iteration. The agent's own account and presence still need checking against the game's terms, which were not read."
    - name: "ResoniteLink (WebSocket) with a MCP bridge"
      why: "Read and write the live data model in a running Resonite session (slots, components). Permission is set in-world (Builder, host, ResoniteLinkPermissions). Spawning and moving objects is possible. Presence as a user is not documented."
    - name: "LibreMetaverse on OpenSimulator"
      why: "A C# library that logs in as a Second Life or OpenSimulator client, with movement, chat, building and inventory. OpenSimulator is a BSD server you can run yourself, so it is the one place an agent can be a full avatar with a clear licence. Second Life's terms were not confirmed."
  already_speaking_mcp:
    - name: "Roblox Studio built-in MCP server"
      why: "Official. Built into Studio, stdio transport, reads the data model, edits scripts, runs playtests and simulates keyboard and mouse. It is for the creator in Studio, not for players in live servers."
    - name: "Unity MCP (CoplayDev)"
      why: "MIT, 50 tools, editor plugin, last release v10.3.0 dated 2026-10-04 per its page. Drives the editor, not a live player session."
    - name: "Godot MCP (yanhuifair)"
      why: "386 tools; run and stop the game, runtime screenshot, step and freeze. Has a token option and localhost bind. AGPL-3.0."
    - name: "Unreal MCP (Epic, experimental)"
      why: "Official plugin, Streamable HTTP at 127.0.0.1:8000/mcp, loopback only and no auth layer. Runs inside the editor."
    - name: "ResoniteLink MCP bridges (rassi0429, sandraschi, esnya FluxMcp)"
      why: "Three community MCP servers for Resonite. FluxMcp is archived. The other two talk to ResoniteLink."
    - name: "GTerm (Garry's Mod)"
      why: "MIT. Its MCP interface runs console commands and Lua on a Garry's Mod server, with an optional secret."

gaps:
  - "No official bot or agent-presence API was found for Garry's Mod, Neos, ChilloutVR or Roblox live servers. The Roblox Open Cloud API is for publishing, data stores and messaging, not for in-world avatars (from its docs overview page)."
  - "Second Life, Roblox and Resonite terms on bots and automation: not read (fetch blocked, 403, 404, or no rule page reached). ToS column is unknown for these."
  - "VirtualPad, the reported successor to ViGEmBus: its own page was not read; only a DS4Windows discussion names it. Licence reported as proprietary by one commenter, unconfirmed."
  - "BizHawk Lua API documentation (docs.bizhawk.org) could not be reached (DNS not in the session's allowed domains). Only the GitHub README was read."
  - "Steam Input anti-cheat and double-input behaviour: the best-practices page does not state them."
  - "Xbox Controller Assist platform list and PC behaviour: the support page did not load; the Xbox news article was read instead."
  - "PlayStation Access controller third-party software API: not found on the pages read."
  - "Cloud and remote play for second players: how a guest's controller input reaches the host in Remote Play Together was not stated on the Steamworks page read."
  - "Neos VR: cloud services shut down in 2025 per a Wikipedia mirror surfaced in search only (not fetched). Not included as an entry."
  - "Latency figures are missing for almost every entry; only Sunshine and Moonlight target low latency, and the pages do not give numbers."
  - "Minecraft excluded by brief. Anti-cheat rules for Valorant, Fortnite and Call of Duty not read."
  - "Computer-use model agents for games: only research papers were read (Cradle, NitroGen, VideoGameBench). No vendor game agent product was confirmed."

