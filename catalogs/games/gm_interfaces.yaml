title: "Interfaces for an AI game master on a running multiplayer game or world"
as_of: "2026-11-21"
method: >
  Each entry was built from pages read in this session (WebFetch) or from search result snippets
  (WebSearch). Facts from snippets are marked "(snippet)". Pages that returned 403, 404 or 503 are
  named in gaps. Nothing was downloaded or run. "unknown" means no page read answered the question.

gaps:
  - "Roll20 Help Center (help.roll20.net API article) and wiki.roll20.net/API:Dev returned 403 on fetch; the Pro-subscription rule for Roll20 comes from community forum snippets, not an official page."
  - "Owlbear Rodeo docs (docs.owlbear.rodeo/extensions) returned 403; the SDK README says the communication model and read/write capabilities are documented there, which I could not read."
  - "Roblox MessagingService page returned 404; Roblox Open Cloud overview fetched but does not list MessagingService, Universes or Luau execution as claimed in the brief. Server-script facts come from a Creator Hub search snippet."
  - "Resonite host-permissions wiki page returned 404; ResoniteLink docs say the library is beta and that breaking changes are possible, but do not say what clients can read or write."
  - "VRChat Udon docs page (docs.vrchat.com/docs/udon) returned 404; Udon facts come from creators.vrchat.com search snippets and feedback posts."
  - "wiki.vg Minecraft RCON page returned 503. Minecraft RCON setup facts come only from MCP-server README snippets (enable-rcon, port 25575)."
  - "Factorio RCON protocol details (wire format, command set) are not on any page read; only the flags --rcon-port, --rcon-bind and --rcon-password are confirmed from the command-line parameters page."
  - "Garry's Mod: the official site fetched did not describe Lua, server or Workshop scripting. Server-side Lua facts (RunConsoleCommand, blocked ConCommands) come from wiki search snippets. The Lua function reference pages were not fetched."
  - "Minecraft Paper plugin API: docs.papermc.io index fetched; the Entity API subpage returned 404. Plugin-loading and player/world API details are unknown from fetched pages. Licence for Paper is not stated on any page read."
  - "Fabric: fabricmc.net/about returned 404. Licence facts (Apache-2.0 for Loader and API, CC0 for Yarn) come from search snippets only."
  - "Valheim, Rust, ARK, 7 Days to Die, Project Zomboid, Vintage Story, Space Engineers (Torch), Conan Exiles: no primary developer or modding-API page was read. Command and plugin facts come from hosting-provider guides or search snippets."
  - "Arma 3 Zeus: command reference pages (addCuratorEditableObjects, BIS_fnc_curatorObjectRegisteredTable, spawn functions) were not read; the Steam forum usage was reported as not working by its poster."
  - "Godot and Unreal: official pages were seen only as search snippets. Unity was not searched."
  - "Licences are unknown for most entries because the licence line was not on a page read. Last-release or last-commit dates are unknown for most entries; GitHub pages often showed commit counts without dates."
  - "Existing LLM game-master projects were searched for Minecraft, Foundry, Factorio, Garry's Mod, Rust, and Evennia. Other games were not searched for existing AI projects, so existing_ai_gm there is unknown rather than none."
  - "No platform's terms of service were read for hosting or modding rules except where stated in the entry."
  - "The catalog directory already held control_interfaces.yaml, game_envs.yaml, npc_mods.yaml and spotcheck.md from an earlier pass. They were not read or changed."

summary:
  easiest_first_gm_prototype:
    pick: "minecraft-gamemastermc"
    why: "Apache-2.0 Paper/Bukkit plugin that already lets an OpenAI-compatible model read live state and run admin actions. Read on its Modrinth page. The RCON route (minecraft-rcon-mcp) is an alternative that needs no plugin install, but has a narrower verified action set."
  richest_action_set:
    pick: "minecraft-gamemastermc"
    why: "Its Modrinth page lists player management, gamemode, give, teleport, heal, spawn and remove entities, block edits, weather, logs, plugins and console commands, with owner toggles. Foundry VTT (client API, GM-level) is a richer data model but its action surface was not read on a page."
  already_has_ai_or_mcp:
    - "minecraft-gamemastermc (plugin, AI admin actions)"
    - "minecraft-rcon-mcp (MCP over RCON, MIT)"
    - "foundry-vtt (Familiar MCP, adambdooley MCP bridge; snippets)"
    - "factorio-learning-environment (LLM agent framework, not a GM)"
    - "garrys-mod-lua (GTerm MCP, snippet)"
    - "evennia (LLM chat-bot contrib, mentioned on docs index)"

