    game_or_platform: "Minecraft Java Edition, dedicated server (Paper)"
    read_state: "Index page only. Lists Event API (listeners, custom events, chat events), Entity API (teleportation, display entities, mob goals, pathfinder), Command API, Inventories, Persistent data containers, Scheduling. Player and world-read details are unknown from the page read."
    actions: "Teleport and spawn entities, add display entities, set mob goals (per index listing). Other actions unknown from pages read."
    connection: "In-process Java plugin loaded by the server (plugin API)."
    auth_and_permissions: "Server operator installs the plugin in the server's plugin folder (unknown from page read, general knowledge not used). In-game commands use Paper's command API."
    multiplayer: "Dedicated server. Player count not stated on page read."
    licence: "unknown (page states no licence; copyright notice only)"
    activity: "Docs page 'Last updated Apr 22, 2025' (page footer); copyright 2026."
    existing_ai_gm: "See minecraft-gamemastermc (Bukkit/Paper plugin)."
    tos_notes: "Page says it is not an official Minecraft website and gives a disclaimer."
    notes: "Paper plugin loading and the Experimental 'Paper plugins' system are linked but not read. Dialog API introduced in 1.21.7 (page)."
    sources:
      - "https://docs.papermc.io/paper/dev/api (read)"

  - id: minecraft-rcon
