    game_or_platform: "Minecraft Java Edition, dedicated server"
    read_state: "No direct read. Output of 'list' and similar commands comes back as the RCON response (per MCP server README)."
    actions: "Any server console command, as run by the RCON client (scotteratigan README says run_command runs any server command over RCON)."
    connection: "RCON (wire protocol not read; wiki.vg returned 503). Configured via server.properties per MCP README snippets."
    auth_and_permissions: "Server owner sets enable-rcon, rcon.password and rcon.port in server.properties (snippet: Peterson MCP README, port 25575). Whoever holds the password has full console power."
    multiplayer: "Dedicated server."
    licence: "n/a (protocol)"
    activity: "unknown"
    existing_ai_gm: "Several MCP servers wrap RCON (see minecraft-rcon-mcp; Peterson, rgbkrk and Railway templates are snippets in leads)."
    tos_notes: "unknown"
    notes: "Full RCON access is all-or-nothing. Command set is whatever the server accepts."
