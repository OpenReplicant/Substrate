      - "https://github.com/scotteratigan/minecraft-rcon-mcp (read)"
      - "https://glama.ai/mcp/servers/@Peterson047/Minecraft-MCP-Server (snippet)"

  - id: minecraft-gamemastermc
    name: "GameMasterMC (AI game master plugin)"
    urls:
      - "https://modrinth.com/mod/gamemastermc"
    game_or_platform: "Minecraft Java Edition, Bukkit and Paper, 1.21.x"
    read_state: "Model reads server state through its admin tools (the Modrinth page lists inspect logs and list plugins; the 'live server state' wording is from a search snippet)."
    actions: "Manage players, change gamemodes, give items, teleport players, heal or feed, spawn or remove entities, edit blocks, change weather, inspect logs, list plugins, run console commands. Owners can enable or disable each action and restrict console-level commands."
    connection: "Plugin; calls any OpenAI-compatible chat-completions API (hosted, private gateway or local model server) (Modrinth page)."
    auth_and_permissions: "Server owner installs the plugin and sets which AI actions are enabled. Model cannot exceed the enabled action set (page says owners can restrict)."
    multiplayer: "Dedicated server (plugin). Player count not stated."
    licence: "Apache-2.0 (Modrinth page)"
    activity: "Modrinth shows 'Updated 7 months ago' (relative; no calendar date)."
    existing_ai_gm: "Is itself an AI game-master plugin; the page describes it as an admin/control tool, not a storyteller."
    tos_notes: "unknown"
    notes: "Strongest verified action set among Minecraft entries. Model-agnostic. Admin-style, so narrative behaviour is the builder's job."
    sources:
      - "https://modrinth.com/mod/gamemastermc (read)"

  - id: minecraft-rcon-mcp
    name: "minecraft-rcon-mcp (scotteratigan)"
    urls:
      - "https://github.com/scotteratigan/minecraft-rcon-mcp"
    game_or_platform: "Minecraft Java Edition, dedicated server"
    read_state: "get_ai_chat_status (listener health, history size, model, memory config); run_command returns RCON output; scripts can query world state ('inspect or modify the live world' per README)."
    actions: "run_command (any server command via RCON); remember (appends a note to a memory file, scopes server or capability); list_scripts and run_script (bundled Python toolbox incl. structure builders and world queries). README says the world can be modified. Kick, teleport and give are not named on the page; they would go through run_command but this is unverified."
    connection: "MCP server (Python 3.14+) over RCON; optional in-game chat agent."
    auth_and_permissions: "RCON password must match the server's; owner enables enable-rcon on the server. Anthropic API key only for the in-game chat feature (README)."
    multiplayer: "Dedicated Java server. Player count not stated."
    licence: "MIT"
    activity: "unknown (16 commits shown, no dates)"
    existing_ai_gm: "Has an in-game AI chat agent (Claude) that players can talk to; it is the closest existing 'LLM in the world' MCP for Minecraft."
    tos_notes: "unknown"
    notes: "Good for a fast prototype: the agent gets console plus a script toolbox with no plugin install."
    sources:
      - "https://github.com/scotteratigan/minecraft-rcon-mcp (read)"

