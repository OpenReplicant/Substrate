# Catalog: game mods and plugins that let an LLM drive NPC speech, dialogue and/or actions
# Compiled 2026-11-21. Every fact comes from a page read with WebFetch (URL given per entry), unless a
# field says "search snippet only". "unknown" = not found on a page read. Nexus Mods pages returned
# HTTP 403/404 to the fetch tool, and GitHub API access was not enabled in this session, so GitHub
# commit and release dates are only those shown on the repo landing pages (often none).
#
# Field key:
#   openai_compatible: yes | no | unknown  (quote in notes or source line)
#   custom_base_url:   yes | no | unknown
#   read_status: fetched (project page read) | partial (only a mirror, store page or search summary read)

summary: |
  Entries: 33 (see below). Scope: Skyrim, Fallout 4, Bannerlord, Stardew Valley, Minecraft, Garry's Mod,
  RimWorld, STALKER Anomaly, Kenshi, Cyberpunk 2077, GTA V, Baldur's Gate 3, The Sims 4, plus Unity, Unreal,
  Godot and Python frameworks.

  Custom OpenAI-compatible endpoint, stated on a page read (explicit quote): 5 entries. Mantella, SkyrimNet,
  Smart Villagers AI (Minecraft), AI Companion Fabric (Minecraft), Sentient Sands (Kenshi). Three more have a
  configurable base URL but do not say OpenAI-compatible: Mindcraft, LoraCore and Talking Villagers (Ollama
  native URL). RimTalk has a "Custom API settings" screen with presets, and its details are unknown.

  Most promising for an outside agent to drive:
  1. AI Companion Fabric (Minecraft): LGPLv3, documented local OpenAI-compatible endpoint with a base URL
     setting, actions (mine, craft, build, combat), file updated Oct 2026. Singleplayer and LAN only.
  2. Smart Villagers AI (Minecraft): Apache-2.0, OpenAI-compatible and Ollama presets, the mod (not the
     model) decides offers, progress and payment, client and server, file updated Oct 2026.
  3. Mindcraft (Minecraft, framework): MIT, per-model url field, Mineflayer action layer. Built for bots, but
     its own docs warn against public servers when coding is enabled.
  4. Player2 (free local app, localhost:4315; Godot and Unity SDKs in the catalog): the only entry with a
     documented NPC spawn/chat/despawn API for third-party tools, but the endpoint details come from a vendor
     blog, not the live docs, and it is a hosted-account service.
  5. Mantella (Skyrim, Fallout 4): AGPL-3.0, OpenAI-compatible, Whisper/Moonshine STT and Piper/xVASynth/XTTS
     TTS, but its game-side control is dialogue and speech, not general actions.

  Gaps I could not fill: Nexus-only mods (Mantella's own Nexus page, AliveNpcs, Neural Harvest, AI Influence,
  Starfield AISS, Sims AI Chat) returned no page to the fetch tool, so their facts stay at search-snippet
  level and are listed under leads_not_verified. Last-commit dates are unknown for most GitHub repos
  (no date shown on the landing page). Licences are unknown for several projects. Multiplayer behaviour
  is unknown for most mods. No anti-cheat or ToS review was done beyond what the pages state.
  Conflicts flagged: Bannerlord.ChatGPT search summary said local gguf is supported; the repo page does not
  say so, so the page wins. Smart Villagers' GitHub was listed as a profile in search; the CurseForge page
  names MeherBenSalem/CivilizationAI, which is used here.

entries:

  # ---------------- Skyrim / Fallout ----------------

  - name: Mantella
    games: [Skyrim Special Edition, Skyrim VR, Fallout 4, Fallout 4 VR]
    urls:
      project: "https://www.nexusmods.com/skyrimspecialedition/mods/98631 (Nexus page: fetch returned 403, facts from docs site and search snippet)"
      docs: https://art-from-the-machine.github.io/Mantella/
      source: https://github.com/art-from-the-machine/Mantella
    read_status: fetched (GitHub and docs site); Nexus page not readable
    ai_controls:
      speech_dialogue: yes. Player speaks, NPC answers aloud. NPCs can start conversations and join group conversations.
      voice: STT Moonshine or Whisper; TTS Piper, xVASynth or XTTS (GitHub README).
      actions: "'dynamic actions' named on the docs site, detail unknown."
      memory: yes. "NPCs remember past conversations with you" (docs site).
    connection:
      openai_compatible: "yes"
      custom_base_url: yes (the exact config key was not confirmed on a page read)
      local_models: yes. "Run everything locally on your own hardware" and "Works with local models (Llama, Gemma, etc)" (docs site).
      other: Built-in service choice in the Mantella UI for OpenAI, OpenRouter, NanoGPT and local models (docs site).
    speech:
      stt: Moonshine or Whisper
      tts: Piper, xVASynth, XTTS
    licence: AGPL-3.0 (GitHub README "AGPL-3.0 license")
    open_source: "yes"
    activity:
      last_release_or_commit: unknown (landing page shows 620 commits, no date, no releases)
      rough: large install base; docs site says "350k+ downloads" (Nexus figure quoted on docs site)
    player_mode: single-player per the mod's usage; multiplayer not stated
    notes: >
      Dialogue and speech only as far as the pages say. Nexus page not readable, so the Nexus version and date are unknown.
      The mod's own text: "Mantella is free and open source."
    sources:
      - https://github.com/art-from-the-machine/Mantella
      - https://art-from-the-machine.github.io/Mantella/
      - https://www.nexusmods.com/skyrimspecialedition/mods/98631 (403 on fetch)

  - name: Mantella Fallout 4 VR ESP (companion to Mantella backend)
    games: [Fallout 4 VR]
    urls:
      source: https://github.com/YetAnotherModder/Fallout-4-VR-Mantella-Mod
    read_status: fetched
    ai_controls:
      speech_dialogue: yes (ESP integrates LLM dialogue into F4VR NPC responses)
      voice: unknown (Sound/Voice folder present; no STT described)
      actions: unknown
      memory: unknown
    connection:
      openai_compatible: unknown
      custom_base_url: unknown
      local_models: unknown on this page; it uses the separate Mantella backend
      other: depends on the Mantella backend
    speech:
      stt: none described
      tts: unknown (Mantella voice models referenced)
    licence: MIT (GitHub "MIT license")
    open_source: "yes"
    activity:
      last_release_or_commit: unknown (20 commits, no dates, no releases)
    player_mode: unknown
    notes: "Requires F4SE, SUP F4SEVR, Fallout 4 Version Check Patcher. Known bug: 'Mantella may crash while loading older voice models'. NPC targeting includes turrets."
    sources:
      - https://github.com/YetAnotherModder/Fallout-4-VR-Mantella-Mod

  - name: SkyrimNet
    games: [Skyrim Special Edition, Skyrim VR]
    urls:
      project: https://github.com/MinLL/SkyrimNet-GamePlugin
      docs: https://goncalo22.github.io/SkyrimNet-GamePlugin/Features/overview (search result only, not read)
    read_status: fetched (GitHub README)
    ai_controls:
      speech_dialogue: yes
      voice: local speech recognition; local and cloud TTS with voice cloning (GitHub)
      actions: "yes. 'an NPC can follow you, hand over gold, craft you a shield, draw a weapon or walk away'. Actions come from a library other mods can extend. Separate mods add more: 'SeverActions lists 70+ actions' (GitHub)."
      memory: yes. "Every NPC has a private memory, recalled by meaning, that fades with time unless it mattered." NPCs can keep diaries.
    connection:
      openai_compatible: yes. "Use an OpenRouter key, or any OpenAI-compatible service." (GitHub)
      custom_base_url: unknown (OpenAI-compatible is stated; the key name was not seen)
      local_models: yes. "the model runs on your own PC through LM Studio, Ollama, KoboldCpp or llama.cpp" (GitHub)
      other: Fateless hosted paid service ("One account for everything SkyrimNet needs").
    speech:
      stt: local speech recognition (Whisper named in the CUDA note)
      tts: default PocketTTS in-process; local and cloud engines
    licence: "unknown (page says: 'SkyrimNet ... is not open source' and points to a LICENSE file; text not shown)"
    open_source: no (per the page's own statement)
    activity:
      last_release_or_commit: unknown (1,068 commits, no dates shown)
      version: "'SkyrimNet Beta29 or later' is referenced for Fateless support"
    player_mode: "'It all runs as a single Skyrim mod.' Multiplayer not stated"
    notes: Installs as a native Windows DLL. Serves a browser UI at localhost:8080 (search snippet only). Paid Fateless tier is optional.
    sources:
      - https://github.com/MinLL/SkyrimNet-GamePlugin
      - https://goncalo22.github.io/SkyrimNet-GamePlugin/Features/overview (search snippet only)

  - name: CHIM server (HerikaServer, aiagent branch)
    games: [Skyrim (CHIM mod, SKSE plugin)]
    urls:
      project: https://github.com/language-coder/HerikaServer (public fork of abeiro/HerikaServer)
      mod_page: https://www.nexusmods.com/skyrimspecialedition/mods/126330 (search snippet only, not read)
    read_status: fetched (GitHub landing page only)
    ai_controls:
      speech_dialogue: yes. "Any NPC can be an AI, including group conversations."
      voice: STT and TTS folders present; MeloTTS and XTTS named
      actions: yes. "Function calling action commands", examples trading, moving, attacking. A functions folder exists.
      memory: yes. "Long-term memory for in-game characters" (feature list)
    connection:
      openai_compatible: unknown (page names ChatGPT, MeloTTS, koboldcpp, Openrouter, XTTS)
      custom_base_url: unknown
      local_models: koboldcpp named. Search snippet says models must follow "instruct" style.
      other: ChatGPT and OpenRouter
    speech:
      stt: provider-based (folder present), engine not named on page
      tts: MeloTTS, XTTS named
    licence: MIT-LICENSE file in tree (name not confirmed on page text)
    open_source: yes (per file tree)
    activity:
      last_release_or_commit: unknown (2,681 commits on aiagent branch, no date, no releases)
    player_mode: unknown
    notes: The page is a landing page only. Endpoint compatibility needs the repo docs.
    sources:
      - https://github.com/language-coder/HerikaServer

  - name: Inworld Skyrim Mod (source code)
    games: [Skyrim]
    urls:
      source: https://github.com/BlocTheWorker/Inworld-Skyrim-Mod
      playable: Nexus Mods 91294 (search result only; the author page says the playable mod is only on Nexus)
    read_status: fetched (GitHub README)
    ai_controls:
      speech_dialogue: yes (free-form conversation via Inworld)
      voice: unknown
      actions: unknown
      memory: unknown
    connection:
      openai_compatible: no (Inworld cloud service)
      custom_base_url: unknown
      local_models: no mention
      other: Inworld cloud, credentials and workspace secrets
    speech:
      stt: unknown
      tts: unknown
    licence: unknown (not stated on page)
    open_source: unknown (source is public; no licence shown)
    activity:
      last_release_or_commit: unknown (15 commits, no dates)
    player_mode: unknown
    notes: "'This is a SOURCE CODE. This is not a downloadable mod for players.' Needs SKSE, SkyUI, UIExtensions. Author says code is 'very amateurly written'."
    sources:
      - https://github.com/BlocTheWorker/Inworld-Skyrim-Mod

