    games: [Mount & Blade II: Bannerlord]
    urls:
      source: https://github.com/wonderingmark123/Bannerlord.ChatGPT
      mod_page: https://www.nexusmods.com/mountandblade2bannerlord/mods/6514 (linked from search; not read)
    read_status: fetched
    ai_controls:
      speech_dialogue: yes. "You could talk to the villagers, companions, and lords freely." The LLM opens the conversation.
      voice: unknown (none mentioned)
      actions: none described
      memory: none mentioned
    connection:
      openai_compatible: no (page sets up the OpenAI platform API key only)
      custom_base_url: unknown
      local_models: not mentioned on page (search summary said gguf is supported; page does not confirm)
      other: OpenAI API key file
    speech:
      stt: none described
      tts: none described
    licence: unknown (no licence stated on page)
    open_source: yes (public repo; licence unknown)
    activity:
      last_release_or_commit: unknown (9 commits, no date)
      tested_on: game version 1.2.8 (page)
    player_mode: single-player (mission view only; "any conversation started from the map won't be able to call this mod")
    notes: Works only in mission view.
    sources:
