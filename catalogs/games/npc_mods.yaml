  # ---------------- Baldur's Gate 3 ----------------

  - name: Inworld BG3 companion mod (Inworld-BaldursGate-Mod)
    games: [Baldur's Gate 3]
    urls:
      source: https://github.com/BlocTheWorker/Inworld-BaldursGate-Mod
      mod_page: https://nexusmods.com/baldursgate3/mods/8179 (search result only)
    read_status: fetched (GitHub README)
    ai_controls:
      speech_dialogue: yes (free-form conversation with companions)
      voice: speech in (records audio and sends to Inworld)
      actions: not described
      memory: not mentioned
    connection:
      openai_compatible: "no"
      custom_base_url: unknown (not stated)
      local_models: no. Uses "Inworld Backend via gRPC Streaming".
      other: Inworld cloud API key and secret, stored in Windows Credential Manager
    speech:
      stt: Inworld cloud (audio is transmitted)
      tts: unknown
    licence: MIT (GitHub)
    open_source: "yes"
    activity:
      last_release_or_commit: unknown (3 commits, no date, no releases)
    player_mode: unknown
