      local_models: "'Works locally to keep your conversations private and lag-free.' (CurseForge, no detail)"
      other: Player2 (free) is required (CurseForge). OpenRouter and manual keys appear only in a Nexus search summary, not on the CurseForge page.
    speech:
      stt: none described
      tts: none described
    licence: conflicting. Page licence field says "All Rights Reserved"; description says "Fork freely under the MIT license."
    open_source: yes (source is public per page; licence conflicting)
    activity:
      last_release_or_commit: Jun 22, 2026 (version 1.6.15, marked latest release)
    player_mode: unknown
    notes: "SMAPI required. Newer release adds 'Sign in with Player2 Account'. Cost: Player2 free per page."
