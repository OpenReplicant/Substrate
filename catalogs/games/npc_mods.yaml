    read_status: fetched (GitHub landing page)
    ai_controls:
      speech_dialogue: described only as "powered by LLMs and RAG"
      voice: unknown
      actions: unknown
      memory: RAG-based knowledge per repo description
    connection:
      openai_compatible: unknown
      custom_base_url: unknown
      local_models: unknown
      other: unknown
    speech:
      stt: unknown
      tts: unknown
