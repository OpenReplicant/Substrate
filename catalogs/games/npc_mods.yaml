  # ---------------- Minecraft ----------------

  - name: Smart Villagers AI
    games: [Minecraft (Fabric, Forge, NeoForge)]
    urls:
      project: https://www.curseforge.com/minecraft/mc-mods/smart-villagers-ai
      source: https://github.com/MeherBenSalem/CivilizationAI
    read_status: fetched (CurseForge page)
    ai_controls:
      speech_dialogue: yes. "The AI just words the reply." The mod decides offers, progress and payments.
      voice: TTS optional through Simple Voice Chat. STT not mentioned.
      actions: requests (fetch items, slay monsters) with emerald and XP rewards; the mod tracks them. Not free-form.
      memory: yes. Villagers draw on "your last conversations". Command "/villagerai memory clear".
    connection:
      openai_compatible: yes. "works with any OpenAI-compatible AI provider, a local model, or no AI at all"
      custom_base_url: yes by implication (CUSTOM provider preset); base URL key not stated on page
      local_models: yes. "Ollama and LM Studio run models on your own computer."
      other: presets DEEPSEEK, NANOGPT, NANOGPT_SUBSCRIPTION, OPENAI, OPENROUTER, OLLAMA, LMSTUDIO, CUSTOM in config/smartvillagers/config.toml
    speech:
      stt: none described
      tts: Simple Voice Chat (optional)
    licence: Apache-2.0
    open_source: "yes"
    activity:
      last_release_or_commit: Oct 25, 2026 (smartvillagers-neoforge-26.3-2.0.0.jar, latest release)
    player_mode: client and server ("Install the mod on the server, or in your game for single player.")
    notes: Players must accept AI consent before chat goes to a provider. No key needed; built-in dialogue used without one. Paid items on the page (NightBeam Pro) are optional.
    sources:
      - https://www.curseforge.com/minecraft/mc-mods/smart-villagers-ai

  - name: AI Companion Fabric (ai-companion)
    games: [Minecraft (Fabric)]
    urls:
      project: https://www.curseforge.com/minecraft/mc-mods/ai-companion-fabric
      source: https://github.com/adevivo/ai-companion
    read_status: fetched (CurseForge page)
    ai_controls:
      speech_dialogue: yes (companions follow chat commands)
      voice: optional spoken output via local Kokoro TTS container; audio plays client-side
      actions: yes. "they mine, collect, craft, engage in combat, and build structures via a proven task engine"; also use skills, eat and equip gear.
      memory: not listed
    connection:
      openai_compatible: yes. "a local OpenAI-compatible server (llama.cpp, Ollama, LM Studio, …)"
      custom_base_url: yes. Base URL "no trailing slash and no /v1; the mod appends /v1/chat/completions itself." Default llm.endpoint http://localhost:3030
      local_models: yes (llama.cpp, Ollama, LM Studio)
      other: cloud API option also listed; per-session request cap on spend; single config file selects endpoint
    speech:
      stt: none described
      tts: Kokoro (default endpoint http://localhost:8880)
    licence: "LGPLv3 (CurseForge: 'GNU Lesser General Public License version 3 (LGPLv3)')"
    open_source: "yes"
    activity:
      last_release_or_commit: Oct 13, 2026 (aicompanion-0.4.3+mc1.21.11.jar)
    player_mode: singleplayer and Open-to-LAN with trusted people. "not ready for a public multiplayer server"; has run on a dedicated server since 0.2.4 with shared rosters.
    notes: Best fit on this list for an outside agent that wants a documented local endpoint and in-game actions. Minecraft versions 1.21.11 and 1.20.1 listed; check the file.
    sources:
      - https://www.curseforge.com/minecraft/mc-mods/ai-companion-fabric

  - name: Talking Villagers
    games: [Minecraft (Fabric, server-side)]
    urls:
      project: https://www.curseforge.com/minecraft/mc-mods/talkingvillagers
      source: https://github.com/ball534/talkingVillagers-mod (linked as "Source" on CurseForge; repo not read)
    read_status: fetched (CurseForge page)
    ai_controls:
      speech_dialogue: yes (sneak + right-click a villager to talk)
      voice: none (replies appear as floating text or in chat)
      actions: opinions (-100 to +100, affects trade), elections, mayor, marriage, births, gossip, grief. Not free-form game actions.
      memory: yes. Villagers "remember" insults and raids; know player and feelings.
    connection:
      openai_compatible: unknown (not stated)
      custom_base_url: yes. config key base_url, default local Ollama on port 11434; example http://192.168.1.50:11434
      local_models: yes (Ollama); suggests llama3.2:3b
      other: "cloud: none ('No API key, no account, no cloud, no cost.')"
    speech:
      stt: none
      tts: none
    licence: "'All Rights Reserved' (CurseForge page licence field)"
    open_source: unknown (source link present; licence reserved per page)
    activity:
      last_release_or_commit: "Aug 6, 2026 (CurseForge: 'Updated 3 months ago')"
    player_mode: server-side; "every player can join with an unmodded client"; works in singleplayer too
    notes: "If Ollama is slow or missing, villagers simply go quiet."
    sources:
