  - name: Mindcraft
    games: [Minecraft (Mineflayer bots; framework, not a mod)]
    urls:
      project: https://github.com/mindcraft-bots/mindcraft (README says it was started by kolbytn)
    read_status: fetched (GitHub landing page)
    ai_controls:
      speech_dialogue: yes (chat with the player)
