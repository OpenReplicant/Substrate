# Super Mario Bros. from the owner's own cartridge image. The ROM is never stored here or in any image: the
# machine names it in NES_ROM (envkit/nes.py). Addresses are the game's well-known memory map.
[environment]
name = "mario"
doc = "A side-scrolling platformer on the NES: run right, jump over gaps and enemies, reach the flag."

[params]
rom = "$NES_ROM"
seed = 0
max_steps = 3000
frameskip = 4
keep_lives = 0       # 1: lives are topped up before every step (practice), 0: three and the game is over

[[module]]
name = "game"
driver = "nes"
rom = "{rom}"
seed = "{seed}"
max_steps = "{max_steps}"
frameskip = "{frameskip}"
start = [["", 40], ["start", 10], ["", 160]]
progress = "x"
life = "lives"
level = "stage"
ends = [{ reading = "lives", equals = 255 }, { reading = "world", changes = true }]
poke = [{ addr = 0x75A, value = 2, when = "{keep_lives}" }]
rate = 15.0

[module.buttons]
noop = []
right = ["right"]
jump_right = ["right", "A"]
run_right = ["right", "B"]
leap_right = ["right", "A", "B"]
jump = ["A"]
left = ["left"]

[module.readings]
screen = { type = "rgb", doc = "the picture, 256 by 240" }
x = { ram = [0x6D, 0x86], type = "scalar", fair = false, doc = "the player's distance into the level" }
lives = { ram = 0x75A, type = "scalar", fair = false }
world = { ram = 0x75F, type = "scalar", fair = false }
stage = { ram = 0x75C, type = "scalar", fair = false }
pstate = { ram = 0x0E, type = "scalar", fair = false, doc = "the player's state: 8 normal, 11 dying, 4 at the flag" }

[[module]]
name = "encode"
driver = "quantize"
block = 4
crop = [32, 0]       # the score, coins, world and timer along the top; lives and world are offered as counts
wire = { rgb = "game.screen" }

[[module]]
name = "sight"
driver = "sight"     # the camera and the things on screen, from pixels alone (envkit/vision.py)
crop = [32, 0]
dx = [-4, 12]        # how far the camera can move in a step: this game scrolls right only, at most 3 pixels a frame
wire = { rgb = "game.screen" }

# The workspace: one picture of the situation built from the fair detectors above (and whatever agents post).
[[module]]
name = "ws"
driver = "workspace"
capacity = 12
wire = { post = "ws.post", tick = "game.tick" }

[[module]]
name = "post_things"
driver = "poster"
fn = "envkit.workspace:things"
source = "sight"
wire = { in = "sight.things", post = "ws.post" }

[[module]]
name = "post_camera"
driver = "poster"
fn = "envkit.workspace:camera"
source = "sight"
wire = { in = "sight.camera", post = "ws.post" }

[[module]]
name = "post_attempt"
driver = "poster"
fn = "envkit.workspace:attempt"
source = "game"
wire = { in = "game.attempt", post = "ws.post" }

[[module]]
name = "post_reward"
driver = "poster"
fn = "envkit.workspace:reward"
source = "game"
wire = { in = "game.reward", post = "ws.post" }

[[module]]
name = "post_event"
driver = "poster"
fn = "envkit.workspace:event"
source = "game"
wire = { in = "game.event", post = "ws.post" }

[expose]
frame = "encode.grid"
camera = "sight.camera"
state = "ws.state"
focus = "ws.focus"
changed = "ws.changed"
post = "ws.post"
things = "sight.things"
screen = "game.screen"
attempt = "game.attempt"
levels_completed = "game.levels_completed"
x = "game.x"
lives = "game.lives"
world = "game.world"
stage = "game.stage"
pstate = "game.pstate"
reward = "game.reward"
actions = "game.actions"
event = "game.event"
tick = "game.tick"
cmd = "game.cmd"

[profiles]
judged = ["frame", "camera", "things", "state", "focus", "changed", "screen", "attempt", "levels_completed", "reward", "actions", "event", "tick"]
train = ["frame", "camera", "things", "state", "focus", "changed", "screen", "attempt", "levels_completed", "x", "lives", "world", "stage", "pstate", "reward",
         "actions", "event", "tick"]
