# OpenReplicant as an environment: its history replayed a day a tick, its actors interviewable, its owner the
# principal. The mined history and the interview mailbox are the org's data and stay on the machine: ORG_SNAPSHOT
# (python3 -m envkit.org mine CLONES OUT) and ORG_MAILBOX name them.
[environment]
name = "openreplicant"
doc = "An organization of repositories, people and agents, mapped from its history; its principal can be asked."

[params]
snapshot = "$ORG_SNAPSHOT"
mailbox = "$ORG_MAILBOX"
start = ""
end = ""
present = 7

[[module]]
name = "org"
driver = "org"
snapshot = "{snapshot}"
mailbox = "{mailbox}"
start = "{start}"
end = "{end}"
present = "{present}"

[[module]]
name = "ws"
driver = "workspace"
capacity = 12
wire = { post = "ws.post", tick = "org.tick" }

[[module]]
name = "post_events"
driver = "poster"
fn = "envkit.org:resolve"
source = "org"
wire = { in = "org.events", post = "ws.post" }

[[module]]
name = "post_repos"
driver = "poster"
fn = "envkit.org:repos"
source = "org"
wire = { in = "org.repos", post = "ws.post" }

[[module]]
name = "post_replies"
driver = "poster"
fn = "envkit.org:reply"
source = "principal"
wire = { in = "org.reply", post = "ws.post" }

[[module]]
name = "post_event"
driver = "poster"
fn = "envkit.workspace:event"
source = "org"
wire = { in = "org.event", post = "ws.post" }

[expose]
state = "ws.state"
focus = "ws.focus"
changed = "ws.changed"
post = "ws.post"
actions = "org.actions"
event = "org.event"
reward = "org.reward"
tick = "org.tick"
cmd = "org.cmd"

[profiles]
member = ["state", "focus", "changed", "actions", "event", "reward", "tick"]
