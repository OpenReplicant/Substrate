# Business: the parts of an organisation as content types whose terms come from published models (README.md; the
# choice is docs/choices/business-vocabulary.yaml), a business's map as items in a domain of its own, and BPMN 2.0
# processes in and out. Built to leave with Workbench: nothing here names the plugin or system that uses it.
id: business
version: 0.1.0
licence: Apache-2.0
requires: {workbench: "1"}
content_types: [types/*.json]
vocabulary: vocabulary.yaml       # hand-written: the picked models' classes and the relations between items
mappings: [mappings.sssom.tsv]    # SSSOM: each type's term mapped to the other candidates' terms
server: business_plugin           # extractors: map (a business's map file), bpmn (a BPMN 2.0 XML process)
