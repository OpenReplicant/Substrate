# Generated by plugins/substrate/vocab.py from types/*.json, catalog-info.yaml's kinds, the relations substrate's
# extractors state, and vocabulary.axioms.yaml (the hand-written part). Edit those and run it again; never this.
vocabulary: substrate
prefixes:
  sub: https://substrate.local/ns#
terms:
- iri: sub:API
  kind: class
  label: API
  parents:
  - sub:Entity
  comment: A catalog entity of kind API (Backstage's entity model).
- iri: sub:AiResource
  kind: class
  label: AiResource
  parents:
  - sub:Entity
  comment: A catalog entity of kind AiResource (Backstage's entity model).
- iri: sub:Candidate
  kind: class
  label: Candidate
  parents:
  - wb:Item
  comment: 'Something that could fill a need, found in a source catalog: its licence, releases and activity as the registry
    gives them, and its fit and outcome as a choice records them.'
- iri: sub:Cell
  kind: class
  label: Cell
  parents:
  - sub:Observed
  comment: 'A cell Morphogen sees in a project: a part it can measure, judge and change, as morphogen status reports it.'
- iri: sub:Choice
  kind: class
  label: Choice
  parents:
  - wb:Item
  comment: 'A choice made from the catalogs (spec section 5): the question, what the need is, what was searched and tried,
    the pick and why. Read from docs/choices/*.yaml; its candidates are candidate items.'
- iri: sub:Component
  kind: class
  label: Component
  parents:
  - sub:Entity
  comment: A catalog entity of kind Component (Backstage's entity model).
- iri: sub:Connection
  kind: class
  label: Connection
  parents:
  - sub:Observed
  comment: A client's configured connection to a server, e.g. an MCP server in a project's .mcp.json.
- iri: sub:Container
  kind: class
  label: Container
  parents:
  - sub:Observed
  comment: A container the engine runs (or has stopped), as its inspect output says.
- iri: sub:ContractRun
  kind: class
  label: Contract run
  parents:
  - wb:Item
  comment: 'One run of a slot''s contract test against one filler (scripts/contract.sh): what was checked, pass or fail.'
- iri: sub:Domain
  kind: class
  label: Domain
  parents:
  - sub:Entity
  comment: A catalog entity of kind Domain (Backstage's entity model).
- iri: sub:Entity
  kind: class
  label: Component
  parents:
  - sub:Part
  comment: 'An entry in a system''s catalog: a Component, Resource, AiResource (a skill or hook), API, System, Domain or Group,
    as its kind says. Read from catalog-info.yaml in Backstage''s entity model.'
- iri: sub:Group
  kind: class
  label: Group
  parents:
  - sub:Entity
  comment: A catalog entity of kind Group (Backstage's entity model).
- iri: sub:Hook
  kind: class
  label: Hook
  parents:
  - sub:Part
  comment: 'A Claude Code hook: a command run at an event (.claude/settings.json), named <event>-<script>.'
- iri: sub:Host
  kind: class
  label: Host
  parents:
  - sub:Observed
  comment: 'A machine a system runs on, as read from it: its OS, kernel, CPU, memory and container engine.'
- iri: sub:Image
  kind: class
  label: Image
  parents:
  - sub:Observed
  comment: A container image present on a host because a container uses it.
- iri: sub:Observed
  kind: class
  label: Observed
  parents:
  - wb:Item
  comment: Something read from a system as it runs.
- iri: sub:ObservedAPI
  kind: class
  label: API
  parents:
  - sub:Observed
  comment: 'An API a system serves, read from its own description: an OpenAPI document or an MCP server''s tools/list.'
- iri: sub:Part
  kind: class
  label: Part
  parents:
  - wb:Item
  comment: 'Anything on a system''s map or found in its repository: a catalog entity, a skill, a hook.'
- iri: sub:Plugin
  kind: class
  label: Plugin
  parents:
  - sub:Observed
  comment: A plugin a running Workbench says it has loaded, with the content types and extractors it adds.
- iri: sub:Resource
  kind: class
  label: Resource
  parents:
  - sub:Entity
  comment: A catalog entity of kind Resource (Backstage's entity model).
- iri: sub:Route
  kind: class
  label: Route
  parents:
  - sub:Observed
  comment: A route a web server actually serves, read from its running configuration (not the file it was written in).
- iri: sub:Setting
  kind: class
  label: Setting
  parents:
  - sub:Observed
  comment: 'A setting by name, never its value: an environment variable of a container, a key in an env file, a key in a tool''s
    settings.'
- iri: sub:Skill
  kind: class
  label: Skill
  parents:
  - sub:Part
  comment: 'A Claude Code skill: a folder with SKILL.md, chosen by its description.'
- iri: sub:System
  kind: class
  label: System
  parents:
  - sub:Entity
  comment: A catalog entity of kind System (Backstage's entity model).
- iri: sub:UI
  kind: class
  label: UI
  parents:
  - sub:Observed
  comment: A browser module a web shell actually loads, and the views, menus, commands and widgets it registers.
- iri: sub:Verdict
  kind: class
  label: Verdict
  parents:
  - wb:Item
  comment: 'A Morphogen verdict: whether a candidate change to a cell is better than its base, on evidence the changer could
    not reach. Read from Morphogen''s hash-chained evidence log.'
- iri: sub:Volume
  kind: class
  label: Volume
  parents:
  - sub:Observed
  comment: A named volume on a host's container engine.
- iri: sub:agents
  kind: datatype-property
  label: agents
  domain: sub:Skill
  comment: the tools it is for (AiResource spec.agents)
- iri: sub:annotations
  kind: datatype-property
  label: annotations
