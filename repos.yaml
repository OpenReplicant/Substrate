# The projects substrate assembles, cloned into repos/ as full clones you branch, fix and push from (S-11).
# scripts/bootstrap.sh clones each on its default branch. Any git forge works (S-25): to clone from a Forgejo,
# Gitea or GitLab mirror or fork instead, put the same keys with your url in repos.local.yaml (gitignored), e.g.
#   morphogen:
#     url: https://forge.example.org/me/morphogen
# `checked` is the commit substrate was last checked against; scripts/check.sh says when a clone has moved past it.
morphogen:
  url: https://github.com/OpenReplicant/Morphogen
  branch: main
  checked: b57fbbbae477534066b3aa231bd6472bf461acbc   # 2026-11-16 (#81 unnamed metrics kept; #82 a short-scored run refused; #83 the intake)
# The Knowledge Kernel, Substrate's store (S-153, S-154): its image is built from this clone (scripts/build.sh kernel) and
# the tests of the store on the kernel run in it; its published image (ghcr.io/openreplicant/kernel:main) is pulled (S-167).
kernel:
  url: https://github.com/OpenReplicant/kernel
  branch: main
  checked: 041146054f7b7a155a76dda3bc843ad1405b3739   # 2026-11-22 main after #132 (D-120 bundles); the image's revision; test_kernel, test_ui, test_worker pass
