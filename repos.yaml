# The projects substrate assembles, cloned into repos/ as full clones you branch, fix and push from (S-11).
# scripts/bootstrap.sh clones each on its default branch. Any git forge works (S-25): to clone from a Forgejo,
# Gitea or GitLab mirror or fork instead, put the same keys with your url in repos.local.yaml (gitignored), e.g.
#   morphogen:
#     url: https://forge.example.org/me/morphogen
# `checked` is the commit substrate was last checked against; scripts/check.sh says when a clone has moved past it.
morphogen:
  url: https://github.com/OpenReplicant/Morphogen
  branch: main
  checked: 865d4ea8c05eac11642a88daaaa1a51c2a045aa2   # 2026-11-11 (#75: PLAN phase 7)
