# The sources that name papers, one listing each (papers/README: leg one of the paper catalog).
#
# kind list: a GitHub paper list. Read: the README (files), only the arXiv identifiers in its links, the heading each
#   sat under, and the line it was on. Descriptions and summaries in a list are never copied (many carry no licence).
#   The repository's licence, stars and last push are read from GitHub's API as it reports them.
# kind query: a saved arXiv search; the papers it finds are listed in it, under the query's name, the same shape.
#   Capped by max_results (300).
# machine_built: the survey (sources.survey.yaml) found signs that scripts or a model build part of the list.
# The source survey, read 2026-11-16, has each list's format and its keeper's own taxonomy.

lists:
  - repository: WooooDyy/LLM-Agent-Paper-List
    files: [README.md]
    topic: agent architecture (brain/perception/action), practice, society
    machine_built: false
  - repository: zjunlp/LLMAgentPapers
    files: [README.md]
    topic: LLM agents general
    machine_built: false
  - repository: AGI-Edgerunners/LLM-Agents-Papers
    files: [README.md]
    topic: LLM agents general, large
    machine_built: false
