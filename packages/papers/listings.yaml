queries:
  - name: dual-process
    topic: dual-process or System 1 / System 2 agents built on language models
    search_query: '(abs:"dual-process" OR abs:"dual process" OR abs:"System 1" OR abs:"fast and slow") AND (abs:"language model" OR abs:LLM OR abs:"language agent") AND (abs:agent OR abs:architecture)'
    max_results: 300
  - name: soar-act-r
    topic: Soar or ACT-R cognitive architectures with language models
    search_query: '(abs:"ACT-R" OR abs:"Soar cognitive" OR abs:"Soar architecture" OR abs:"Soar agent") AND (abs:"language model" OR abs:LLM)'
    max_results: 300
  - name: coala-style
    topic: CoALA-style cognitive architectures for language agents
    search_query: '(abs:"cognitive architecture" OR abs:"cognitive architectures" OR abs:CoALA) AND (abs:"language model" OR abs:LLM OR abs:"language agent")'
    max_results: 300
  # Saved searches by group (store and model, judge, loop; the owner's "graph world model" and "self-improving AI").
  # arXiv syntax: field prefixes (abs:), quoted phrases, AND/OR, parentheses. "world model" is never searched alone:
  # on its own it finds reinforcement-learning dynamics and video models.
  - name: kg-memory
    topic: "store and model: knowledge graph as agent memory"
    search_query: '(abs:"knowledge graph" OR abs:"graph memory" OR abs:"graph-based memory") AND abs:memory AND (abs:agent OR abs:agents OR abs:"language model" OR abs:LLM)'
    max_results: 300
  - name: graph-world-model
    topic: "store and model: graph or symbolic world model"
    search_query: '(abs:"world model" OR abs:"world models") AND (abs:graph OR abs:knowledge OR abs:symbolic) AND (abs:"language model" OR abs:LLM OR abs:agent OR abs:agents)'
    max_results: 300
  - name: provenance-claim-graphs
    topic: "store and model: provenance or claim graphs for agents"
    search_query: '(abs:provenance OR abs:"claim graph" OR abs:"claim graphs") AND (abs:agent OR abs:agents OR abs:"language model" OR abs:LLM)'
    max_results: 300
  - name: belief-revision
    topic: "store and model: belief revision or truth maintenance with language models"
    search_query: '(abs:"belief revision" OR abs:"truth maintenance") AND (abs:"language model" OR abs:LLM OR abs:"language models")'
    max_results: 300
  - name: ontology-learning
    topic: "store and model: ontology learning from text with language models"
    search_query: '(abs:"ontology learning" OR abs:"ontology construction" OR abs:"ontology generation") AND (abs:"language model" OR abs:LLM OR abs:"language models")'
    max_results: 300
  - name: heldout-evaluation
    topic: "judge: evaluating agents on held-out cases"
    search_query: '(abs:"held-out" OR abs:"held out") AND (abs:agent OR abs:agents) AND (abs:evaluation OR abs:benchmark) AND (abs:"language model" OR abs:LLM)'
    max_results: 300
  - name: contamination-overfitting
    topic: "judge: benchmark contamination or overfitting for language models and agents"
    search_query: '(abs:contamination OR abs:overfitting) AND abs:benchmark AND (abs:"language model" OR abs:LLM OR abs:agent OR abs:agents)'
    max_results: 300
  - name: reward-hacking
    topic: "judge: reward hacking or specification gaming by agents"
    search_query: '(abs:"reward hacking" OR abs:"specification gaming" OR abs:"reward tampering") AND (abs:agent OR abs:agents OR abs:"language model" OR abs:LLM)'
    max_results: 300
  - name: statistical-comparison
    topic: "judge: statistical comparison or A/B testing of prompts or agent configurations"
    search_query: '(abs:"A/B testing" OR abs:"significance test" OR abs:"statistically significant" OR abs:"statistical comparison") AND (abs:prompts OR abs:"agent configurations" OR abs:"prompt variants") AND (abs:"language model" OR abs:LLM)'
    max_results: 300
  - name: self-improving
    topic: "loop: self-improving or self-modifying agents"
    search_query: '(abs:"self-improving" OR abs:"self-modifying" OR abs:"self-improvement" OR abs:"recursive self-improvement") AND (abs:agent OR abs:agents) AND (abs:"language model" OR abs:LLM)'
    max_results: 300
  - name: automated-agent-design
    topic: "loop: automated design of agent systems"
    search_query: '(abs:"automated design" OR abs:"automatic design" OR abs:"meta agent search" OR abs:"automated agent design") AND (abs:agent OR abs:agents OR abs:agentic) AND (abs:"language model" OR abs:LLM)'
    max_results: 300
  - name: prompt-harness-optimization
    topic: "loop: prompt or harness optimization"
    search_query: '(abs:"prompt optimization" OR abs:"harness optimization" OR abs:"automatic prompt" OR abs:"scaffold optimization") AND (abs:agent OR abs:agents OR abs:"language model" OR abs:LLM)'
    max_results: 300
  - name: skill-workflow-distillation
    topic: "loop: skill or workflow distillation from a language model's experience"
    search_query: '(abs:"skill library" OR abs:"skill distillation" OR abs:"workflow induction" OR abs:"experience distillation" OR abs:"procedural memory") AND (abs:agent OR abs:agents OR abs:LLM)'
    max_results: 300
  - name: routing-cascades
    topic: "loop: model routing or cascades"
    search_query: '(abs:"model routing" OR abs:"LLM routing" OR abs:"LLM cascade" OR abs:"model cascade") AND (abs:"language model" OR abs:LLM OR abs:"language models")'
    max_results: 300
