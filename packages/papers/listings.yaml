    topic: self-evolving agents
    machine_built: false
  - repository: XMUDeepLIT/Awesome-Self-Evolving-Agents
    files: [README.md]
    topic: self-evolving agents
    machine_built: false
  - repository: YoungDubbyDu/Awesome-LLM-Agent-Optimization-Papers
