    notes: "Where paperswithcode.com now redirects to. Read today."
  - name: Papers with Code archive (HF datasets pwc-archive/*)
    url: https://huggingface.co/datasets/pwc-archive/papers-with-abstracts
    api_or_licence: "Dump, parquet, CC-BY-SA 4.0 (dataset cards). Includes evaluation-tables (benchmark leaderboards), methods and datasets as structured data. Frozen at about 2025-09."
    notes: "The only structured method/benchmark taxonomy of this kind found that can be reused under a stated licence."
  - name: Semantic Scholar TLDR and SPECTER datasets
    url: https://api.semanticscholar.org/api-docs/datasets
    api_or_licence: "tldrs and embeddings-specter datasets listed in release 2026-11-10; the tldrs README licence was not read: unconfirmed (other datasets read are ODC-BY). Needs API key for full download."
    notes: "Summaries are model-written."
  - name: Epoch AI Benchmarking Hub
    url: https://epoch.ai/benchmarks
    api_or_licence: "CSV download; FAQ: 'Epoch AI's data is free to use, distribute, and reproduce provided the source and authors are credited under the Creative Commons Attribution license'; external-project data in the hub keeps its own licence; benchmark questions belong to their creators. No API seen."
    notes: "Model-level benchmark scores, not papers or agent harness data. The https://epoch.ai/data/ai-benchmarking URL returned 404."
  - name: Holistic Agent Leaderboard (HAL), Princeton
    url: https://hal.cs.princeton.edu/
