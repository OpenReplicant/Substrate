# Sources for a paper catalog harvester. Facts read on 2026-11-16 from the URL given; `unconfirmed` where not.
# All requests used the generic user agent "paper-catalog-research/0.1"; no email or names were sent.
registries:
  - name: arXiv (legacy API, OAI-PMH, bulk)
    docs_url: https://info.arxiv.org/help/api/tou.html
    other_urls_read: [https://info.arxiv.org/help/api/user-manual.html, https://info.arxiv.org/help/oa/index.html, https://info.arxiv.org/help/bulk_data.html, https://info.arxiv.org/help/bulk_data_s3.html]
    access: "API: https://export.arxiv.org/api/query (Atom XML; worked today without key). OAI-PMH base URL https://oaipmh.arxiv.org/oai (page says it was updated from http://export.arxiv.org/oai2); sets by category such as cs:cs:AI; incremental harvest with from= datestamp; formats arXiv and arXivRaw. Bulk: Kaggle dataset (all articles, metadata and full text PDFs) and Amazon S3 requester-pays buckets for PDFs and sources. No key, no sign-up. Email in request: not asked (the TOU says arXiv collects name and email of developers it supports, but no parameter is required)."
    rate_limit: "When using the legacy APIs (including OAI-PMH, RSS, and the arXiv API), make no more than one request every three seconds, and limit requests to a single connection at a time. (TOU page.) User manual: 'incorporate a 3 second delay in your code'."
    metadata_licence: "You are free to use descriptive metadata about arXiv e-prints under the terms of the Creative Commons Universal (CC0 1.0) Public Domain Declaration. (TOU page.) OAI page: 'Metadata for arXiv articles may be reused in non-commercial and commercial systems.'"
    fields: "abstract yes (title, authors, abstract, categories, DOI, journal ref, comment). citation counts no. references no. code links no. full text: PDFs and source via S3 (requester pays) or Kaggle, not through the API. OAI-PMH 'arXiv' format carries category and licence info; per-paper licence can differ."
    terms_note: "Rate limits apply to all machines under your control as a whole; do not add machines to beat them. Full text: most e-prints are under the arXiv non-exclusive licence, so arXiv cannot grant redistribution rights; if you build indexes on full text you must link back to arXiv for downloads (bulk_data page). OAI-PMH cannot select by submission date; datestamps are for incremental harvesting. Only the latest version is exposed in OAI-PMH."
    checked: 2026-11-16
  - name: OpenAlex
    docs_url: https://help.openalex.org/api/authentication/
    other_urls_read: [https://help.openalex.org/access/snapshot/, https://help.openalex.org/access/pricing.md, https://help.openalex.org/access/example-costs.md, https://api.openalex.org/, https://help.openalex.org/llms.txt, "https://api.openalex.org/works/W2741809807"]
    access: "REST https://api.openalex.org/works (JSON). Basic queries work with no key (live notice today: 'No API key, so this request shares one free daily budget ($0.10) with everyone on your network's IP address'). Free key: account or POST /api-keys with the user's email; works only after the email link is clicked; gives $1/day and is required for cursor paging past the first page. Snapshot: free public S3 bucket 'openalex', prefixes data/jsonl (gzip, ~745 GB) and data/parquet (~770 GB), no AWS account needed, about 626 million records per format as of the September 2026 release."
    rate_limit: "No API key 10 requests/second; free API key or prepaid usage 30/second; annual plan 50. Daily budget resets midnight UTC. Costs: single-record lookups free; the example-costs page lists list+filter at $0.10 and search at $1 with the unit unclear (unconfirmed), and says 'A search costs 10 credits' with rerank adding 10 credits ($0.001), so a search is about $0.001 per call. per_page max 100; basic paging limit 10,000 results; semantic search 1 request/second."
    metadata_licence: "CC0 (api.openalex.org root: 'Free, open data on the world's research ... (CC0)'). The licence file in the snapshot bucket root was not read: unconfirmed."
    fields: "abstract yes (as abstract_inverted_index, present on a work record today). citation counts yes (cited_by_count). references yes (referenced_works, ids only). code links no. full text: Fulltext and Unpaywall products exist in the docs menu, not read: unconfirmed. Also topics, best_oa_location, open_access."
    terms_note: "Priced by credit budget, not by 'polite pool' email. A new account spends its first $1 at up to $0.10 every 5 minutes (accounts made before 3 November 2026 exempt). Keyless use is a shared per-IP $0.10/day, too small for harvesting: use a free key or the snapshot. An email is asked only to get a key (must be the person's own; placeholders refused)."
    checked: 2026-11-16
  - name: Semantic Scholar (Academic Graph API and Datasets)
    docs_url: https://www.semanticscholar.org/product/api/tutorial
    other_urls_read: [https://api.semanticscholar.org/api-docs/datasets, https://api.semanticscholar.org/datasets/v1/release/latest, https://api.semanticscholar.org/license/, https://www.semanticscholar.org/product/api]
    access: "REST https://api.semanticscholar.org/graph/v1/ . Keys optional but recommended, requested through a form (key emailed). Datasets: latest release 2026-11-10; sample files public on S3; 'Downloading the full data requires an API key'. Datasets: abstracts, authors, citations, embeddings-specter_v1, embeddings-specter_v2, paper-ids, papers, publication-venues, s2orc, s2orc_v2, tldrs."
    rate_limit: "'rate-limited to 1000 requests per second shared among all unauthenticated users. Requests may also be further throttled during periods of heavy use.' 'The introductory rate limit for an API key is 1 RPS on all endpoints.' A keyless call today returned HTTP 429 'Too Many Requests'."
    metadata_licence: "Datasets: 'This collection is licensed under ODC-BY' (README of the papers, abstracts and citations datasets, release 2026-11-10); attribution: cite 'The Semantic Scholar Open Data Platform' (arXiv 2301.10140). The API is under a separate AI2 API licence (terms_note)."
    fields: "abstract yes (abstracts dataset 'for selected papers'). citation counts yes. references yes, with citation contexts and intents (citations dataset). code links no. full text: s2orc datasets exist, licence not read: unconfirmed. TLDR summaries dataset exists (model-written)."
    terms_note: "API licence (https://api.semanticscholar.org/license/): use limited to 'internal use solely for the purpose of training and evaluating machine learning models and transforming data sets for legitimate, non-commercial, research and/or educational purposes'; other purposes including commercial need an expanded licence; also forbids transferring Data to third parties. That restricts publishing a catalog built from the API; the ODC-BY datasets are the cleaner route (but need a key)."
    checked: 2026-11-16
  - name: Hugging Face papers (daily papers, paper pages)
    docs_url: https://huggingface.co/docs/hub/rate-limits
    other_urls_read: [https://huggingface.co/docs/hub/api, "https://huggingface.co/api/daily_papers?limit=2", "https://huggingface.co/api/papers/2604.07798", https://huggingface.co/papers/trending]
    access: "Observed working today with no key or sign-up: GET https://huggingface.co/api/daily_papers , /api/papers/{arxiv_id} , /api/papers/search?q= . Whether these three are documented: unconfirmed (pages read were the generic Hub docs). Email not asked."
    rate_limit: "Hub rate-limit tiers: Anonymous user (per IP address) API 500, Resolvers 3,000, Pages 100; Free user 1,000 / 5,000 / 200; 'All values are defined over 5-minute windows'. Which bucket the papers endpoints use: unconfirmed."
    metadata_licence: "unconfirmed (no licence statement found for paper metadata)."
    fields: "daily_papers item: paper{id (arXiv id), authors, publishedAt, submittedOnDailyAt, title, summary (abstract), upvotes, projectPage, githubRepo, githubRepoAddedBy, ai_summary, ai_keywords}, numComments, submittedBy. /api/papers/{id} adds linkedModels, linkedDatasets, linkedSpaces and counts. citation counts no (upvotes only). references no. code links yes for some papers (githubRepo). full text no."
    terms_note: "Editorial feed of papers people post, ML-heavy. ai_summary and ai_keywords are model-written (an ai_summary_model field names the model); skip them for a no-model catalog."
    checked: 2026-11-16
  - name: Papers with Code (closed) and its archive
    docs_url: https://github.com/paperswithcode/paperswithcode-data
    other_urls_read: ["https://paperswithcode.com/ (302 to https://huggingface.co/papers/trending)", "https://paperswithcode.com/api/v1/papers/ (302 to the same)", https://raw.githubusercontent.com/paperswithcode/paperswithcode-data/master/README.md, https://huggingface.co/datasets/pwc-archive/papers-with-abstracts]
    access: "paperswithcode.com and its API v1 now redirect (HTTP 302) to https://huggingface.co/papers/trending: the site and API are gone. Static dumps survive as Hugging Face datasets pwc-archive/papers-with-abstracts, links-between-paper-and-code, evaluation-tables, methods, datasets (parquet, downloadable without key). The old production-media.paperswithcode.com dump URL returned 301 (target not followed: unconfirmed)."
    rate_limit: "Hugging Face Hub limits apply to the downloads (see Hugging Face entry)."
    metadata_licence: "CC-BY-SA 4.0 (repo README: 'All data is licenced under CC-BY-SA'; HF dataset cards: cc-by-sa-4.0)."
    fields: "papers-with-abstracts: paper_url, arxiv_id, nips_id, openreview_id, title, abstract, url_abs, url_pdf, proceeding, authors, tasks, date (rest of schema not read). links-between-paper-and-code: paper-to-repository links. evaluation-tables: benchmark results. methods, datasets. citation counts and references: none seen."
    terms_note: "Frozen. Last modified per HF API: papers-with-abstracts 2026-08-17; links-between-paper-and-code, methods, datasets 2025-09-10; evaluation-tables 2025-09-13. The GitHub README still says 'data is regenerated daily' but the repo's last push was 2025-09-08 so that is stale. Useful for code links up to about 2025-09, nothing newer. Share-alike applies to derived datasets."
    checked: 2026-11-16
  - name: OpenReview
    docs_url: https://docs.openreview.net/getting-started/using-the-api.md
    access: "API v2 https://api2.openreview.net (OpenAPI definition at https://api2.openreview.net/docs/api.yml per llms.txt); legacy v1 for older venues. Docs: 'You need an OpenReview account to use the API.' An anonymous curl to /notes returned 403 ChallengeRequiredError (browser challenge) today. Email: account needed."
    rate_limit: "Response headers on api2.openreview.net/notes today: ratelimit-policy: 180;w=60 and x-ratelimit-limit: 180 (180 per 60 s; observed, not from a docs page)."
    metadata_licence: "unconfirmed. Per-submission licence is chosen by the uploader (an FAQ exists for 'a license that is not listed')."
    fields: "notes with title, abstract, authors, venue, reviews, decisions (field list not read in full: unconfirmed). citation counts no. references unconfirmed. code links unconfirmed. PDFs yes via the site."
    terms_note: "Authenticated use only; the challenge on anonymous requests suggests unauthenticated scraping is unwelcome. Terms of use page not read: unconfirmed. robots.txt only disallows /*?*email=. Multi-factor accounts need a TOTP step in unattended scripts (docs page read)."
    checked: 2026-11-16
  - name: ACL Anthology
    docs_url: https://aclanthology.org/info/development/
    other_urls_read: [https://aclanthology.org/info/license/]
    access: "No hosted web API. Data is in GitHub repo acl-org/acl-anthology (Apache-2.0 per GitHub API; last push 2026-11-16): data/xml/*.xml authoritative metadata, data/json for authors, venues, SIGs; a Python API on PyPI is 'the recommended way'. Clone; no key, no email."
    rate_limit: "none stated on pages read."
    metadata_licence: "Licence page: materials before 2016 CC BY-NC-SA 3.0; materials in or after 2016 CC BY 4.0. That is about the papers; a metadata-only licence statement was not found: unconfirmed."
    fields: "abstract yes where present, authors, venue, DOI, Anthology id. citation counts no. references unconfirmed. code links unconfirmed (attachments exist). PDFs linked on the site."
    terms_note: "NLP venues only (ACL, EMNLP, NAACL...); misses ICLR, NeurIPS, ICML agent papers."
    checked: 2026-11-16
  - name: DBLP
    docs_url: https://dblp.org/xml/README.txt
    other_urls_read: ["https://dblp.org/xml/ (directory listing)", https://dblp.org/robots.txt]
    access: "Dump https://dblp.org/xml/dblp.xml.gz (1.0 GB, modified 2026-11-15 23:40 per the directory listing) with md5, dblp.dtd and a release/ folder. No key. Search API (dblp.org/search/publ/api?q=...&format=json) returned an Anubis 'not a bot' challenge (HTTP 202) to curl today; FAQ pages sit behind the same challenge, not read."
    rate_limit: "robots.txt: 'Crawl-delay: 4'. API quota: unconfirmed."
    metadata_licence: "'released under the CC0 1.0 Public Domain Dedication license ... even for commercial purposes', also ODC-BY 1.0 as secondary licence (README.txt, legal information of 22 Nov 2019)."
    fields: "title, authors, venue, year, DOI/ee links, type. abstract no. citation counts no. references no. code links no. full text no."
    terms_note: "Useful as a venue-confirmed id/title/DOI spine (ICLR, NeurIPS, ICML, AAAI); join to arXiv or OpenAlex for abstracts. Bot challenge on web and API."
    checked: 2026-11-16
  - name: Crossref REST API
    docs_url: https://www.crossref.org/documentation/retrieve-metadata/rest-api/
    other_urls_read: [https://www.crossref.org/documentation/retrieve-metadata/rest-api/access-and-authentication/, https://www.crossref.org/documentation/retrieve-metadata/rest-api/tips-for-using-the-crossref-rest-api/]
    access: "https://api.crossref.org/works (JSON). 'Anyone can access the REST API, no signup or registration is required.' Pools: Public (no identification), Polite (email in mailto= parameter or agent header), Metadata Plus (paid key). Email recommended, not required."
    rate_limit: "Access page table: Public rate limit 5, concurrency 1; Polite 10, concurrency 3; Plus 150, no concurrency limit (unit not stated in the table text read: unconfirmed). Live headers today on a keyless call: x-rate-limit-limit: 1, x-rate-limit-interval: 1s, x-concurrency-limit: 1, x-api-pool: public-array, i.e. stricter than the table."
    metadata_licence: "'almost none of the metadata is subject to copyright, and you may use it for any purpose. Some abstracts contained in the metadata may be subject to copyright by publishers or authors.' (REST API page.) No named licence on that page."
    fields: "abstract sometimes (publisher-supplied JATS XML, seen today). citation counts yes (is-referenced-by-count). references yes when deposited. code links no. full text: link URLs only. Whether arXiv papers appear: unconfirmed."
    terms_note: "Abusive use gets 403 blocks. Use from-index-date with until-index-date when syncing. Public data files and snapshots page listed in menu, not read: unconfirmed."
    checked: 2026-11-16
  - name: CORE
    docs_url: https://core.ac.uk/services/api
    access: "Page says 'register to receive an API key' and also 'CORE API is free and does not require registration, subject to our rate limits'. Dataset and FastSync offered."
    rate_limit: "unconfirmed (linked page not read; registered organisations get a faster rate 'typically not free')."
    metadata_licence: unconfirmed
    fields: "full text is CORE's purpose; abstract, citation counts, code links unconfirmed."
    terms_note: "Page read only in part."
    checked: 2026-11-16
  - name: arXiv Links to Code and Data (arXivLabs, from Papers with Code)
    docs_url: https://info.arxiv.org/labs/showcase.html
    access: "Listed on the arXivLabs showcase as a collaboration with Papers with Code / Meta AI Research. A display on abs pages; no data endpoint found on that page. Other showcase items near code: Hugging Face Spaces, Replicate, DagsHub (not examined)."
    rate_limit: unconfirmed
    metadata_licence: unconfirmed
    fields: "code links on abs pages (display only)"
    terms_note: "Not a harvest source as far as read."
    checked: 2026-11-16
