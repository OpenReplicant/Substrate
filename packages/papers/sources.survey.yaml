notes:
  - "Paper lists on topic (b), cognitive architectures with LLMs, are thin on GitHub: no curated paper list for Soar, ACT-R or dual-process agents turned up in about 12 topic and word searches. Nearest: ysymyth/awesome-language-agents (CoALA, last push 2025-01-16) and zzli2022/Awesome-System2-Reasoning-LLM (System 2 reasoning, last push 2025-06-08). arXiv search found only a few papers (2611.00651, 2604.11364, 2510.09355, 2408.09176). Topic (b) will need keyword harvesting from arXiv/OpenAlex rather than from lists."
  - "Papers with Code is closed: site and API v1 redirect to https://huggingface.co/papers/trending. Dumps live on as HF datasets pwc-archive/* (CC-BY-SA 4.0), mostly frozen at 2025-09-10."
  - "Semantic Scholar's API licence limits use to internal, non-commercial research and bars handing Data to third parties; publishing a catalog built from the API is doubtful. The ODC-BY datasets (need a key) are the safer route."
  - "OpenAlex no longer has a polite-pool email scheme; keyless use shares $0.10/day per IP. A free key ($1/day, email verified by the owner) or the free S3 snapshot is needed for harvesting. An agent must ask the person for their own email; never invent one."
  - "OpenReview needs an account (anonymous curl got a challenge 403). DBLP's search API and FAQ sit behind an Anubis bot challenge; its dump is plain HTTP."
  - "Crossref docs table says public pool 5 requests, live headers said 1 per 1s: harvest at 1 per second to be safe."
  - "arXiv ids in this environment run to at least 2611.xxxxx (HF daily papers today lists 2611.12068); filter by id format accordingly."
  - "Lists likely partly machine-generated: KaiWU5/Awesome-AI4AI (README says catalog rebuilt by scripts; data/papers.json holds title, arxiv_id, citations, code, github_stars, sections), IAAR-Shanghai/Awesome-AI-Memory (screening/ reports, CLAUDE.md), tmgthb/Autonomous-Agents (bullet summaries, per-period files). Their entries may contain model-written text."
  - "Other lists seen, not in the 20: VoltAgent/awesome-ai-agent-papers (1904 stars, MIT, 2026 papers, ~400 arXiv links, sponsor-driven README with few headings), masamasa59/ai-agent-papers (1733 stars, no licence, topic files under architecture/, capabilities/, operations/, applications/ with TAXONOMY.md; arXiv links not in README), benchflow-ai/awesome-evals (1039 stars, NOASSERTION, evaluation tools), DEEP-PolyU/Awesome-GraphMemory (367 stars), walkinglabs/awesome-harness-engineering (4734 stars, CC0-1.0, tools and guides, only 1 arXiv link, headings useful as a harness taxonomy), tmgthb. Many 100k-star 'agent' repositories in topic searches are software, not paper lists."
  - "GitHub licence 'none' below means the API returned no licence: others may not copy the list contents; NOASSERTION appeared for repos not in the 20 (benchflow awesome-evals, awesome-claude-code)."
