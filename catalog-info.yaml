# substrate's map, in Backstage's catalog entity model. Generated from Workbench by `scripts/map.sh export`:
# edit the map in Workbench (its shell, or MCP's save_item and retire_item), not here. Morphogen reads this file
# from the base commit as its rules (morphogen.yaml), and a new machine's first `scripts/up.sh` imports it.
# What each annotation means: plugins/substrate/MAP.md.
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: agents
  description: Agent-owned parts; agents change them freely, behind the judge.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: operator
  description: The human owner. Holds organization (purpose, goals, policy, who decides) and approves in the review lane.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: substrate
  description: A super-agent that models systems as cited claims, acts on them, and changes (itself included) only on evidence
    it cannot fake.
  annotations:
    morphogen.dev/change: 'README.md

      DECISIONS.md

      LICENSE

      .gitignore

      .env.example

      repos.yaml'
spec:
  owner: group:operator
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: core
  description: What runs - Workbench (store and model), Morphogen (judge), Claude Code (actor), and the glue.
spec:
  owner: group:operator
  domain: substrate
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: options
  description: Components substrate can choose when a step needs one; each says where it fits and how to bring it back (spec
    8).
spec:
  owner: group:operator
  domain: substrate
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: sources
  description: Registries to search for candidates when no known component fits - catalogs of catalogs (spec 5).
spec:
  owner: group:operator
  domain: substrate
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: claude-code
  description: The actor - explores, interviews, researches, builds and maps; one session is one turn of the loop.
  annotations:
    morphogen.dev/change: 'CLAUDE.md

      scripts/harness.py

      scripts/workbench-mcp-headers.sh'
    substrate.dev/basis: Claude Code, with Workbench's MCP server (scripts/harness.py, a token per connection from scripts/workbench-mcp-headers.sh)
      and Morphogen's plugin (S-03, S-57)
    substrate.dev/fill: existing
    substrate.dev/intent: Close gaps between the intended and the observed, through responses that are judged and recorded.
    substrate.dev/observed-as: connection:claude-code-workbench
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: core
  consumesApis:
  - workbench-mcp-api
  - judge-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: evidence-log
  description: Morphogen's hash-chained verdict log, in git's own directory.
  annotations:
    substrate.dev/filler: morphogen-evidence
spec:
  type: database
  lifecycle: production
  owner: group:operator
  system: core
  providesApis:
  - evidence-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: front-door
  description: Caddy at 127.0.0.1:8080 - Workbench's shell at /, its API at /api, its server at /wb/api; HTTPS when PUBLIC_HOST
    names a public host.
  annotations:
    morphogen.dev/change: deploy/caddy/**
    substrate.dev/basis: deploy/compose.yaml service caddy, deploy/caddy/Caddyfile (the shell's page is a Caddy template);
      CADDY_IMAGE pins docker.io/library/caddy:2.11.7-alpine
    substrate.dev/fill: adopt
    substrate.dev/intent: One address for people and agents.
    substrate.dev/observed-as: container:substrate-caddy, route:substrate-caddy-*
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: core
  consumesApis:
  - workbench-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: git-repo
  description: Code, the map, the cells, and history.
  annotations:
    substrate.dev/filler: git
spec:
  type: repository
  lifecycle: production
  owner: group:operator
  system: core
  providesApis:
  - repository-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: graph-endpoint
  description: A SPARQL endpoint over Workbench's items, claims and relations, with reasoning - Ontop, a virtual knowledge
    graph over the live tables.
  annotations:
    morphogen.dev/change: deploy/ontop/**
    substrate.dev/basis: deploy/ontop/Containerfile (Ontop 5.5.0 with PgJDBC 42.7.14), compose service graph, Caddy /sparql;
      its mapping and ontology generated from Workbench's terms (workbench/workbench/graph.py, scripts/graph.sh, .state/graph);
      reads as wb_reader
    substrate.dev/candidates: 'Picked Ontop 5.5.0 (Apache-2.0) over Jena Fuseki, Oxigraph, RDFLib with OWL-RL, QLever, Virtuoso,
      Blazegraph and Morph-KGC: docs/choices/rdf-endpoint.yaml, in Workbench as choice rdf-endpoint'
    substrate.dev/evidence: 'Trial 2026-11-09 (scripts/trials/rdf-endpoint/run.sh): the only candidate with right answers
      to the reasoning queries and current data; about 430 MB. Live since step 7: run.sh live passes (q1 92/92, q2 5, q3 311/311,
      fresh).'
    substrate.dev/fill: adopt
    substrate.dev/filler: ontop
    substrate.dev/intent: Ask the store by meaning (classes, sub-properties, claims and their premises) without a copy of
      it.
    substrate.dev/observed-as: container:substrate-graph
    substrate.dev/step: '7'
spec:
  type: service
  lifecycle: experimental
  owner: group:operator
  system: core
  providesApis:
  - graph-api
  consumesApis:
  - workbench-api
  - database-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: interviewer
  description: Asks people what the map cannot see, and records each answer as a claim attributed to them.
  annotations:
    morphogen.dev/change: 'plugins/substrate/substrate_interview.py

      plugins/substrate/INTERVIEW.md

      scripts/interview.sh'
    substrate.dev/basis: the interview skill (.claude/skills/interview), transcripts in .state/interviews read by substrate:interview
      (plugins/substrate/INTERVIEW.md), scripts/interview.sh
    substrate.dev/fill: existing
    substrate.dev/intent: Fill the intended half of a system from the people who hold it (S-43).
    substrate.dev/step: '8'
spec:
  type: library
  lifecycle: experimental
  owner: group:agents
  system: core
  subcomponentOf: claude-code
  consumesApis:
  - workbench-mcp-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: morphogen
  description: The judge - rules from the base, outside measurement, held-out cases, A/A checks, the red team, the evidence
    log.
  annotations:
    substrate.dev/basis: repos/morphogen; its Claude Code plugin, installed from GitHub so the judge is never the candidate
    substrate.dev/fill: existing
    substrate.dev/filler: morphogen
    substrate.dev/intent: Accept a change only on evidence the changer cannot reach. The one hard restriction (S-46) - it
      exists because the changer is expected to try to reward-hack sometimes.
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: core
  providesApis:
  - judge-api
  consumesApis:
  - evidence-api
  - sandbox-api
  - repository-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: observer
  description: Reads a system as it runs - the host, its containers, images and volumes, setting names, routes, APIs, UIs,
    plugins, connections and Morphogen's cells - into claims, so drift can compare every kind with the map.
  annotations:
    morphogen.dev/change: 'plugins/substrate/observe.py

      plugins/substrate/OBSERVE.md

      observe.yaml

      scripts/observe.sh'
    substrate.dev/basis: plugins/substrate/observe.py (the collector, on the host, as observe.yaml says), substrate:observed
      and substrate:drift (plugins/substrate/substrate_plugin.py), scripts/observe.sh; plugins/substrate/OBSERVE.md
    substrate.dev/fill: build
    substrate.dev/intent: Fill the observed half of a model from the machine itself, the same way on any machine (S-62).
    substrate.dev/step: '5'
spec:
  type: library
  lifecycle: experimental
  owner: group:agents
  system: core
  consumesApis:
  - workbench-api
  - workbench-server-api
  - tools-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: postgres
  description: Postgres 17 with pgvector, pg_cron, pgmq, pgGraph (deploy/postgres; S-24, S-57); database workbench.
  annotations:
    morphogen.dev/change: deploy/postgres/**
    substrate.dev/filler: postgres
    substrate.dev/observed-as: container:substrate-db, volume:substrate-db-data
spec:
  type: database
  lifecycle: production
  owner: group:operator
  system: core
  providesApis:
  - database-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: reasoner
  description: Draws what follows from stated relations by OWL 2 RL rules (transitive, inverse and symmetric properties in
    the vocabulary) and writes each conclusion back as a claim citing its premises.
  annotations:
    morphogen.dev/change: 'plugins/substrate/vocab.py

      plugins/substrate/vocabulary.yaml

      plugins/substrate/vocabulary.axioms.yaml

      scripts/graph.sh'
    substrate.dev/basis: substrate:reasoner (plugins/substrate/substrate_plugin.py); its terms from plugins/substrate/vocabulary.yaml
      (vocab.py, vocabulary.axioms.yaml); premises retract conclusions by Workbench's trigger (migration 009)
    substrate.dev/fill: build
    substrate.dev/intent: Rules applied, the first symbolic inference engine (spec section 1, direction); a conclusion lasts
      only as long as its premises.
    substrate.dev/step: '7'
spec:
  type: library
  lifecycle: experimental
  owner: group:agents
  system: core
  consumesApis:
  - workbench-api
  - workbench-server-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
