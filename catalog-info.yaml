apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: postgres
  description: Kernel's Postgres 17 image - pgvector, pg_cron, pgmq, pgGraph (kernel D-22, D-94; S-24).
spec: {type: database, owner: group:operator, system: storage}
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: artifact-store
  description: The kk-artifacts volume - what encoders read, for quotes to be checked against.
spec: {type: volume, owner: group:operator, system: storage}
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: evidence-log
  description: Morphogen's hash-chained verdict log, in git's own directory.
spec: {type: database, owner: group:operator, system: storage}
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: git-repo
  description: Code, the map, the cells, and history.
spec: {type: repository, owner: group:operator, system: storage}
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: sandbox
  description: Containers for judged runs and for modules (Podman or Docker).
spec: {type: container-runtime, owner: group:operator, system: storage}
---
# ================================================================ APIs
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: change-sets, description: "submit_change_set - the only way to write (kernel D-05)."}
spec: {type: sql-function, lifecycle: production, owner: group:operator, system: engine, definition: "api.submit_change_set(ops jsonb) under the caller's own role; auto and review lanes."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: api-views, description: "The api schema - what modules read, with row-level security."}
spec: {type: sql-views, lifecycle: production, owner: group:operator, system: engine, definition: "Views in schema api, security_invoker, clearance per role (kernel spec)."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: change-events, description: "NOTIFY on kernel_change_set; detectors and an applied cursor next (D-32, D-86)."}
spec: {type: pg-notify, lifecycle: production, owner: group:operator, system: engine, definition: "LISTEN kernel_change_set -> {id, status, scope, lane}."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: vocab, description: "Installed packs, slots and SSSOM mappings."}
spec: {type: rdf, lifecycle: production, owner: group:operator, system: engine, definition: "ontology/packs.yaml, slots.yaml, mappings.ttl."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: recall-api, description: "Ranked claims for a question."}
spec: {type: python-module, lifecycle: production, owner: group:agents, system: engine, definition: "recall(question, budget) -> claims with belief and handles."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: judge-api, description: "Morphogen's MCP tools and CLI - status, measure, probe, judge, tune, evidence."}
spec: {type: mcp-server, lifecycle: production, owner: group:operator, system: engine, definition: "11 MCP tools; rules from the base commit."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: model-api, description: "Anthropic-compatible endpoint at /anthropic, and OpenAI-compatible routes."}
spec: {type: http, lifecycle: experimental, owner: group:operator, system: engine, definition: "POST /anthropic/v1/messages with a virtual key (Authorization or x-bf-vk)."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: gateway-metrics, description: "Bifrost's /metrics - tokens, cost, errors, latency."}
spec: {type: prometheus, lifecycle: experimental, owner: group:operator, system: engine, definition: "bifrost_cost_total, bifrost_input_tokens_total, bifrost_output_tokens_total, bifrost_error_requests_total, bifrost_upstream_latency_seconds."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: metrics-api, description: "Prometheus HTTP query API, reached by kernel's observer."}
spec: {type: http, lifecycle: experimental, owner: group:operator, system: storage, definition: "GET /api/v1/query - queries in the observer's queries.yaml."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: kernel-mcp-api, description: "Kernel's MCP tools - memory and operator profiles."}
spec: {type: mcp-server, lifecycle: production, owner: group:operator, system: interface, definition: "memory: remember, recall, explain, changes_since. operator: every tool."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: backstage-mcp-api, description: "Backstage's catalog actions over MCP, with a static bearer token."}
spec: {type: mcp-server, lifecycle: experimental, owner: group:operator, system: interface, definition: "POST /api/mcp-actions/v1 (streamable HTTP); token from BACKSTAGE_MCP_TOKEN; actions from the catalog plugin."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: scheduler-api, description: "Nomad's HTTP API - jobs, allocations, services, Variables; ACL tokens scope what each caller may do."}
spec: {type: http, lifecycle: experimental, owner: group:operator, system: storage, definition: "http://127.0.0.1:4646/v1/ (jobs, allocations, service registrations, variables)."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: scheduler-metrics, description: "Nomad's allocation and node metrics in Prometheus format."}
spec: {type: prometheus, lifecycle: experimental, owner: group:operator, system: storage, definition: "GET /v1/metrics?format=prometheus (publish_allocation_metrics, publish_node_metrics)."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: bus-api, description: "pgmq's SQL functions in database substrate - send, read, archive, delete, metrics."}
spec: {type: sql-function, lifecycle: experimental, owner: group:operator, system: organism, definition: "pgmq.send(queue, jsonb), pgmq.read(queue, vt, n), pgmq.delete(queue, id), pgmq.metrics_all(); queues in deploy/bus/queues.txt."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: console-api, description: "The console's JSON routes behind the front door at /console/api."}
spec: {type: http, lifecycle: experimental, owner: group:operator, system: interface, definition: "POST login, logout, review, goal; GET state (a kernel sign-in cookie)."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: otlp-api, description: "OTLP over gRPC (4317) and HTTP (4318): traces, metrics, logs."}
spec: {type: otlp, lifecycle: experimental, owner: group:operator, system: storage, definition: "OpenTelemetry Protocol; service.name is the catalog's component name, or its substrate.dev/otel-service annotation."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: trace-metrics, description: "The observed call graph and span rates, as Prometheus metrics."}
spec: {type: prometheus, lifecycle: experimental, owner: group:operator, system: storage, definition: "traces_service_graph_request_total{client, server, connection_type}, traces_span_metrics_calls_total{service_name, span_name}."}
