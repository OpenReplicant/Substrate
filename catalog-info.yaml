  annotations:
    substrate.dev/intent: Turn the gateway's counters into windows the observer can record as claims.
    substrate.dev/fill: adopt
    substrate.dev/candidates: Prometheus v3.15.0 (Apache-2.0) at the digest kernel's devops demo pins (S-05)
spec:
  type: service
  lifecycle: experimental
  owner: group:operator
  system: storage
  providesApis: [metrics-api]
  consumesApis: [gateway-metrics, scheduler-metrics]
