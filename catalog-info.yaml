  lifecycle: experimental
  owner: group:agents
  system: mind
  consumesApis: [kernel-mcp-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: declarative-memory
  description: recall, remember, explain, changes_since.
  annotations:
    substrate.dev/intent: Remember and recall with provenance; never act on an unsupported memory.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel-mcp memory profile (M6-T1, D-88); LongMemEval end to end 0.683 (D-92)
spec:
  type: library
  lifecycle: production
  owner: group:agents
  system: mind
  consumesApis: [kernel-mcp-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: procedural-memory
  description: Skills as productions, with learned utility.
  annotations:
    substrate.dev/intent: Choose the skill to apply from evidence; skills are text cells Morphogen improves.
    substrate.dev/fill: build
    substrate.dev/candidates: Claude Code skills; GEPA 0.1.4 (MIT) through Morphogen
    substrate.dev/step: "7"
spec:
  type: library
  lifecycle: experimental
  owner: group:agents
  system: mind
  consumesApis: [judge-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: motor
  description: Actuators act only on what was approved.
  annotations:
    substrate.dev/intent: Change the world only through approved plans with a fixed action list; record what was done.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules/actuator-compose (D-53); an actuator acting through the scheduler's API (restart, scale, run a job, with an ACL token scoped to exactly that) is to build (S-17)
    substrate.dev/step: "8"
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: mind
  consumesApis: [api-views, change-sets, scheduler-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
