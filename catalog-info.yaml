    substrate.dev/fill: existing
    substrate.dev/basis: Claude Code, through the gateway (S-03, S-04)
    substrate.dev/otel-service: "claude-code"
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: mind
  consumesApis: [kernel-mcp-api, judge-api, model-api, backstage-mcp-api, otlp-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
