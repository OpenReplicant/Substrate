# ================================================================ APIs
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: change-sets, description: "submit_change_set - the only way to write (kernel D-05)."}
spec: {type: sql-function, lifecycle: production, owner: group:operator, system: engine, definition: "api.submit_change_set(ops jsonb) under the caller's own role; auto and review lanes."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: api-views, description: "The api schema - what modules read, with row-level security."}
spec: {type: sql-views, lifecycle: production, owner: group:operator, system: engine, definition: "Views in schema api, security_invoker, clearance per role (kernel spec)."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: change-events, description: "NOTIFY on kernel_change_set; detectors and an applied cursor next (D-32, D-86)."}
spec: {type: pg-notify, lifecycle: production, owner: group:operator, system: engine, definition: "LISTEN kernel_change_set -> {id, status, scope, lane}."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: vocab, description: "Installed packs, slots and SSSOM mappings."}
spec: {type: rdf, lifecycle: production, owner: group:operator, system: engine, definition: "ontology/packs.yaml, slots.yaml, mappings.ttl."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: recall-api, description: "Ranked claims for a question."}
spec: {type: python-module, lifecycle: production, owner: group:agents, system: engine, definition: "recall(question, budget) -> claims with belief and handles."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: judge-api, description: "Morphogen's MCP tools and CLI - status, measure, probe, judge, tune, evidence."}
spec: {type: mcp-server, lifecycle: production, owner: group:operator, system: engine, definition: "11 MCP tools; rules from the base commit."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: model-api, description: "Anthropic-compatible endpoint at /anthropic, and OpenAI-compatible routes."}
spec: {type: http, lifecycle: experimental, owner: group:operator, system: engine, definition: "POST /anthropic/v1/messages with a virtual key (Authorization or x-bf-vk)."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: gateway-metrics, description: "Bifrost's /metrics - tokens, cost, errors, latency."}
spec: {type: prometheus, lifecycle: experimental, owner: group:operator, system: engine, definition: "bifrost_cost_total, bifrost_input_tokens_total, bifrost_output_tokens_total, bifrost_error_requests_total, bifrost_upstream_latency_seconds."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: metrics-api, description: "Prometheus HTTP query API, reached by kernel's observer."}
spec: {type: http, lifecycle: experimental, owner: group:operator, system: storage, definition: "GET /api/v1/query - queries in the observer's queries.yaml."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: kernel-mcp-api, description: "Kernel's MCP tools - memory and operator profiles."}
spec: {type: mcp-server, lifecycle: production, owner: group:operator, system: interface, definition: "memory: remember, recall, explain, changes_since. operator: every tool."}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: {name: backstage-mcp-api, description: "Backstage's catalog actions over MCP, with a static bearer token."}
