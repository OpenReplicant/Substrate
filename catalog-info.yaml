    substrate.dev/observed-as: "container:substrate-postgrest"
    substrate.dev/candidates: docker.io/postgrest/postgrest:v16.5 (MIT, 2026-10-20)
spec:
  type: service
  lifecycle: experimental
  owner: group:operator
  system: core
  subcomponentOf: workbench
  providesApis: [workbench-api]
  consumesApis: [database-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: workbench-server
  description: The Workbench server at /wb/api - plugins' Python, extractors off a pgmq queue, NOTIFY relayed as Server-Sent Events, MCP for agents.
  annotations:
    substrate.dev/filler: workbench-server
    substrate.dev/intent: Do what SQL cannot - run extractors and relay live changes - behind the same token check as the API.
    substrate.dev/fill: build
    substrate.dev/basis: workbench/workbench/server.py, extract.py, mcp.py; compose service workbench (workbench/Containerfile)
    substrate.dev/observed-as: "container:substrate-workbench"
    substrate.dev/step: "W3"
spec:
  type: service
  lifecycle: experimental
  owner: group:operator
  system: core
  subcomponentOf: workbench
  providesApis: [workbench-mcp-api, workbench-server-api]
  consumesApis: [workbench-api, database-api]
---
