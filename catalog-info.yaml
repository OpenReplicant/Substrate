# The substrate's map, as a Backstage catalog. Each part states the intent it serves
# (substrate.dev/intent) and how that intent is filled (substrate.dev/fill):
#   existing  built, in kernel (repos/kernel), Morphogen (repos/morphogen) or Claude Code
#   adopt     open-source software taken as is (version and licence in substrate.dev/candidates)
#   build     to be written: a kernel module, a skill, or glue in this repository
# substrate.dev/basis names where an existing part lives. substrate.dev/phase: later marks deferred parts.
# Morphogen reads this file directly (morphogen.yaml), Backstage serves it (S-12), and encoder-backstage will
# read it into kernel (S-09).

apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: operator
  description: The human owner. Holds policy (goals, clearance, autonomy) and approves in the review lane.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: agents
  description: Agent-owned parts; agents change them inside a cell's change scope, behind the judge.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: substrate
  description: A mind that is also an operational platform - kernel's claims, Morphogen's judge, Claude Code's hands.
spec:
  owner: group:operator
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: interface
  description: How people, tools and agents reach the substrate.
spec: {owner: group:operator, domain: substrate}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: organism
  description: The Viable System Model - operations, coordination, control, intelligence, policy.
spec: {owner: group:operator, domain: substrate}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: mind
  description: The Common Model of Cognition inside one agent.
spec: {owner: group:operator, domain: substrate}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: engine
  description: Claims with provenance and belief, identity, verification, the judge.
spec: {owner: group:operator, domain: substrate}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: storage
  description: Durable state and the services that hold it.
spec: {owner: group:operator, domain: substrate}
---
# ================================================================ ENGINE
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: claims-store
  description: Kernel v0 - entities, claims, artifacts, runs, change sets in one Postgres.
  annotations:
    substrate.dev/otel-service: "kk"
    substrate.dev/intent: Hold every assertion attributed, referenced, belief-scored, scoped and bitemporal; write only through change sets; delete nothing.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel/schema/001_kernel.sql (frozen v0; D-01, D-02, D-05, D-09, D-10)
spec:
  type: library
  lifecycle: production
  owner: group:operator
  system: engine
  providesApis: [change-sets, api-views, change-events]
  dependsOn: [resource:postgres]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: vocabulary
  description: Standard vocabularies as packs, with SSSOM mappings between them.
  annotations:
    substrate.dev/intent: Give claims shared terms without forcing any source to change; new terms go through review.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel ontology/ packs and modules/pack-loader (D-23, D-40); find_term and propose_term are kernel M6-T5
spec:
  type: library
  lifecycle: production
  owner: group:operator
  system: engine
  providesApis: [vocab]
  consumesApis: [change-sets]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: encoders
  description: Sources in, proposed claims out - repositories, event logs, BPMN, conversations, papers.
  annotations:
    substrate.dev/intent: Turn each source into claims that cite it; re-reading a changed source supersedes what it said.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules self-encoder, encoder-eventlog, encoder-bpmn, encoder-interaction, encoder-papers, memory-extractor, ingest-filter-gitleaks
spec:
  type: library
  lifecycle: production
  owner: group:agents
  system: engine
  consumesApis: [change-sets, vocab, model-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: validator
  description: SHACL validation of every change set before it applies.
  annotations:
    substrate.dev/intent: Refuse change sets that break the shapes; never write.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules/validator-shacl (D-24)
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: engine
  consumesApis: [change-events, api-views, vocab]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: belief-model
  description: Belief from independent support and contradiction; swappable.
  annotations:
    substrate.dev/intent: Score each claim between 0 and 1 from support, contradiction and fallen premises; reliability feeds belief, never clearance.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules/belief-corroboration (D-04, D-27, D-62); a learned reliability model is a Morphogen cell later
spec:
  type: service
  lifecycle: production
  owner: group:agents
  system: engine
  consumesApis: [change-events, api-views, change-sets]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: verifiers
  description: Quotes checked against sources; conclusions flagged when a premise falls.
  annotations:
    substrate.dev/intent: No method verifies its own output (kernel invariant 5).
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules verifier-quotes (D-67) and truth-maintenance (D-90)
spec:
  type: service
  lifecycle: production
  owner: group:agents
  system: engine
  consumesApis: [change-events, api-views, change-sets]
  dependsOn: [resource:artifact-store]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: recall
  description: BM25 by default, embeddings and re-ranking opt-in; indexes are read models.
  annotations:
    substrate.dev/intent: Find the claims a question needs, ranked with belief.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules recall-index and recall-dense (D-60, D-61, D-66)
spec:
  type: service
  lifecycle: production
  owner: group:agents
  system: engine
  providesApis: [recall-api]
  consumesApis: [api-views, change-events]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: identity-resolver
  description: Which records and mentions name the same entity.
  annotations:
    substrate.dev/intent: Link names, roles and records of one thing - exactMatch when certain, closeMatch for review; every merge reversible.
    substrate.dev/fill: build
    substrate.dev/basis: kernel M6-T9 (planned); Morphogen demos/entity-resolution supplies the cells and held-out pairs (S-07)
    substrate.dev/candidates: Splink 5.0.0 (MIT), as M6-T9 names
spec:
  type: service
  lifecycle: experimental
  owner: group:agents
  system: engine
  consumesApis: [api-views, change-sets, vocab]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: morphogen
  description: The judge, the selector over optimizers, the red team, the evidence log.
  annotations:
    substrate.dev/intent: Accept a change only on evidence the changer cannot reach.
    substrate.dev/fill: existing
    substrate.dev/basis: repos/morphogen (PLAN.md phases 0-5 done, 6 started)
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: engine
  providesApis: [judge-api]
  dependsOn: [resource:evidence-log, resource:sandbox, resource:git-repo]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: encoder-morphogen
  description: Morphogen's verdicts as claims in kernel.
  annotations:
    substrate.dev/intent: Let kernel know what was judged, by what evidence, at what cost, so recall and the MAPE-K loop can use it.
    substrate.dev/fill: build
    substrate.dev/basis: modules/encoder-morphogen/BRIEF.md (S-08); DQV and PROV are kernel packs already
    substrate.dev/step: "1"
spec:
  type: service
  lifecycle: experimental
  owner: group:agents
  system: engine
  consumesApis: [judge-api, change-sets, vocab]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: encoder-backstage
  description: catalog-info.yaml files as system-structure claims.
  annotations:
    substrate.dev/intent: Put the map people already keep into kernel, cited by file and line.
    substrate.dev/fill: build
    substrate.dev/basis: modules/encoder-backstage/BRIEF.md (S-09); system structure is kernel's kk-tosca profile (D-07)
    substrate.dev/step: "2"
spec:
  type: service
  lifecycle: experimental
  owner: group:agents
  system: engine
  consumesApis: [change-sets, vocab]
  dependsOn: [resource:git-repo]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: model-gateway
  description: Every model call passes here, so cost is measured outside the agent.
  annotations:
    substrate.dev/intent: Route model calls with budgets and keys; expose tokens, cost and errors as metrics.
    substrate.dev/fill: adopt
    substrate.dev/candidates: Bifrost v2.3.2 (Apache-2.0), maximhq/bifrost:v2.3.2 (S-04)
    substrate.dev/step: "0"
    nomad.io/job-id: "substrate"
    nomad.io/group: "gateway"
spec:
  type: service
  lifecycle: experimental
  owner: group:operator
  system: engine
  consumesApis: [otlp-api]
  providesApis: [model-api, gateway-metrics]
---
# ================================================================ MIND
