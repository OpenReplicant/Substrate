    substrate.dev/intent: Browse the map in the tool platform teams already use; let agents query the catalog over MCP.
    substrate.dev/fill: adopt
    substrate.dev/candidates: Backstage from @backstage/create-app 0.9.3 (Apache-2.0), services/backstage; MCP via @backstage/plugin-mcp-actions-backend (S-12)
spec:
  type: website
  lifecycle: experimental
  owner: group:operator
  system: interface
  providesApis: [backstage-mcp-api]
  dependsOn: [resource:git-repo]
---
# ================================================================ STORAGE
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: scheduler
  description: One control plane for containers, processes and clusters; swappable (S-16).
  annotations:
    substrate.dev/intent: Run every service and job, restart what fails, place work by resources, find services by name, hold secrets, and give the control loop an API to act through.
    substrate.dev/fill: adopt
    substrate.dev/candidates: Nomad 2.0.7 (BUSL-1.1, S-18) with nomad-driver-podman 0.6.5 (MPL-2.0), deploy/nomad; compose (kernel's stack plus deploy/compose.yaml) as the other runtime; k3s (Apache-2.0) considered (S-17)
    substrate.dev/note: Linux only for Nomad with Podman; compose stays the default until Nomad passes scripts/check.sh on the owner's machine.
spec:
  type: service
  lifecycle: experimental
  owner: group:operator
  system: storage
  providesApis: [scheduler-api, scheduler-metrics]
  dependsOn: [resource:sandbox]
---
apiVersion: backstage.io/v1alpha1
