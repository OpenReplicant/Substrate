    substrate.dev/interface: Claude Code reads ANTHROPIC_BASE_URL (and ANTHROPIC_CUSTOM_HEADERS for the virtual key); nothing in substrate assumes direct access.
    substrate.dev/when: Cost must be measured outside the agent (Morphogen judging cost, budgets), or several providers routed behind one key.
    substrate.dev/restore: "a00fb61 - deploy/compose.yaml service bifrost, scripts/render_bifrost.py, scripts/gateway.py, .env.example's gateway block (S-04, S-14, S-34, S-40)"
    substrate.dev/evidence: "Ran on the owner's machine 2026-11-08. v2.3.2 locks /api and /metrics until an admin account exists (S-34); its data volume kept providers after .env removed them until source_of_truth was set (S-40). Volume knowledge-kernel_bifrost-data kept."
    substrate.dev/candidates: Bifrost v2.3.2 (Apache-2.0); LiteLLM proxy (MIT core) not tried
spec:
  type: service
  lifecycle: option
  owner: group:operator
  system: options
  providesApis: [model-api]
