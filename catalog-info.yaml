    substrate.dev/basis: Claude Code
spec:
  type: service
  lifecycle: production
  owner: group:agents
  system: organism
  consumesApis: [judge-api, kernel-mcp-api, model-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: control-loop
  description: VSM 3 control - monitor, analyse, plan; the MAPE-K loop.
  annotations:
    substrate.dev/intent: Notice when observed behaviour leaves the documented limits and propose a plan a person approves.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules observer-prometheus, anomaly, conformance, skill-adaptation-planning (D-50, D-52, D-53)
spec:
  type: service
  lifecycle: production
  owner: group:agents
  system: organism
  consumesApis: [metrics-api, api-views, change-sets]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mapper
  description: VSM 4 intelligence - maps what is, by reading and by asking.
  annotations:
    substrate.dev/intent: Keep the map of intended and observed structure current, and turn its gaps into questions.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules skill-interview, skill-process-extraction, map-gaps; Morphogen skills/map
spec:
  type: service
  lifecycle: production
  owner: group:agents
  system: organism
  consumesApis: [kernel-mcp-api, judge-api, change-sets]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: triggers
  description: Processors woken when a pattern forms.
  annotations:
    substrate.dev/intent: Wake the right module or skill as soon as a pattern forms, without polling.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel pattern triggers (D-79) and NOTIFY (D-32); detectors and reactors are kernel M6-T0 (D-86, confirmed)
spec:
  type: service
  lifecycle: experimental
  owner: group:agents
  system: organism
  consumesApis: [change-events]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dispatcher
  description: VSM 2 coordination - one task per scope, ordered, within budget.
  annotations:
    substrate.dev/intent: Keep changes attributable and stop agents colliding or looping; doing nothing is allowed.
    substrate.dev/fill: build
    substrate.dev/basis: a reactor over kernel's detectors (M6-T0)
spec:
  type: service
  lifecycle: experimental
  owner: group:agents
  system: organism
  consumesApis: [change-events, api-views, gateway-metrics]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: policy
  description: VSM 5 - clearance, scopes, review; goals as owner claims.
  annotations:
    substrate.dev/intent: Keep the final say with people, enforced by Postgres, never by a model.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel scopes, clearance and the review lane (invariants 3 and 4, D-17); goal claims with a vocabulary are to build
spec:
  type: library
  lifecycle: production
  owner: group:operator
  system: organism
  consumesApis: [api-views, change-sets]
---
