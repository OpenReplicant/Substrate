      scripts/trials/**'
    substrate.dev/basis: .claude/skills/research (the skill), docs/choices/*.yaml (each choice), scripts/trials/ (shortlist
      tests), substrate:choices (into Workbench with registry quotes)
    substrate.dev/fill: existing
    substrate.dev/intent: Make choices from catalogs, not best guesses (S-47).
    substrate.dev/step: '4'
spec:
  type: library
  lifecycle: experimental
  owner: group:agents
  system: core
  subcomponentOf: claude-code
  consumesApis:
  - workbench-mcp-api
  - judge-api
---
apiVersion: backstage.io/v1alpha1
