# Substrate's map, in Backstage's catalog entity model (kept in its own terms in kernel, D-100). Three systems
# (S-47):
#   core     what runs: kernel, Morphogen, Claude Code, and the glue
#   options  components substrate can choose when a step needs one (lifecycle: option); none of them runs now
#   sources  catalogs of catalogs: registries to search when no known component fits (lifecycle: listed)
# One file, because encoder-backstage resolves refs within a file (scripts/map.sh reads it into kernel; a
# PostToolUse hook does it after each edit). Morphogen reads it as cells (morphogen.yaml).
#
# Annotations:
#   substrate.dev/intent      what the part is for
#   substrate.dev/fill        existing (built, in kernel, Morphogen or Claude Code), adopt (open source as is),
#                             build (to write: a kernel module, a skill, or glue here)
#   substrate.dev/basis       where an existing part lives
#   substrate.dev/step        the build step (docs/build.yaml) it belongs to
#   options:  substrate.dev/fits (where it would sit), substrate.dev/interface (what keeps it possible now),
#             substrate.dev/when (what would bring it back), substrate.dev/restore (the commit and paths to
#             restore it from), substrate.dev/evidence (what was learned running it), substrate.dev/candidates
#   sources:  substrate.dev/search (how to search it), substrate.dev/gives (what metadata it returns),
#             substrate.dev/limits (what to know first), substrate.dev/checked (when the endpoint last answered)

apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: operator
  description: The human owner. Holds organization (purpose, goals, policy, who decides) and approves in the review lane.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: agents
  description: Agent-owned parts; agents change them freely, behind the judge.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: substrate
  description: A super-agent that models systems as cited claims, acts on them, and changes (itself included) only on evidence it cannot fake.
spec:
  owner: group:operator
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: core
  description: What runs - kernel (store and model), Morphogen (judge), Claude Code (actor), and the glue.
spec: {owner: group:operator, domain: substrate}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: options
  description: Components substrate can choose when a step needs one; each says where it fits and how to bring it back (spec 8).
spec: {owner: group:operator, domain: substrate}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: sources
  description: Registries to search for candidates when no known component fits - catalogs of catalogs (spec 5).
spec: {owner: group:operator, domain: substrate}
---
# ================================================================ CORE: kernel
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kernel
  description: The store and the model - a content system on Postgres with claims as its assertion type; one kk serve process.
  annotations:
    substrate.dev/intent: Hold what is known about any system as cited, typed, belief-scored claims, and let people and agents read and write them as themselves.
    substrate.dev/fill: existing
    substrate.dev/basis: repos/kernel; kernel's compose stack (db, init, kernel, caddy) with deploy/compose.yaml
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: core
  providesApis: [kernel-mcp-api, change-sets, api-views, change-events, vocab]
  consumesApis: [recall-api]      # kernel-mcp's recall tool calls the recall part
  dependsOn: [resource:postgres, resource:artifact-store]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: claims-store
  description: Entities, claims, artifacts, runs and change sets in one Postgres.
  annotations:
    substrate.dev/intent: Hold every assertion attributed, quoted, belief-scored, scoped and bitemporal; write only through change sets; delete nothing.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel/schema/001_kernel.sql (D-01, D-02, D-05, D-09, D-10)
spec:
  type: library
  lifecycle: production
  owner: group:operator
  system: core
  subcomponentOf: kernel
  dependsOn: [resource:postgres]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: content-types
  description: Kernel as a content system - content types, items and versions over claims; ontologies and aliases as content and taxonomy.
  annotations:
    substrate.dev/intent: Let any kind of thing (a service, a package, a customer, a process) be a content type with its own shape and view, without changing the store.
    substrate.dev/fill: build
    substrate.dev/basis: kernel docs/content.md and D-101, draft PR OpenReplicant/kernel#112 (S-39, S-45)
    substrate.dev/step: "3"
spec:
  type: library
  lifecycle: experimental
  owner: group:operator
  system: core
  subcomponentOf: kernel
  consumesApis: [change-sets, vocab]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: vocabulary
  description: Vocabularies as packs, with SKOS and SSSOM-shaped mappings between them.
  annotations:
    substrate.dev/intent: Give claims shared terms without forcing any source to change its own; new terms go through review.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel ontology/ packs and modules/pack-loader (D-23, D-40); the backstage pack and its mappings (D-100)
spec:
  type: library
  lifecycle: production
  owner: group:operator
  system: core
  subcomponentOf: kernel
  providesApis: [vocab]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: encoders
  description: Sources in, proposed claims out - repositories, event logs, BPMN, conversations, papers.
  annotations:
    substrate.dev/intent: Turn each source into claims that cite it; re-reading a changed source supersedes what it said.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules self-encoder, encoder-eventlog, encoder-bpmn, encoder-interaction, encoder-papers, memory-extractor, ingest-filter-gitleaks
spec:
  type: library
  lifecycle: production
  owner: group:agents
  system: core
  subcomponentOf: kernel
  consumesApis: [change-sets, vocab]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: encoder-backstage
  description: Catalog files as claims in Backstage's own terms, each citing its line.
  annotations:
    substrate.dev/intent: Put the map (what runs, what could, where to search) into kernel, cited by file and line.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules/encoder-backstage and the backstage pack (D-100); run by scripts/map.sh (S-33)
spec:
  type: service
  lifecycle: experimental
  owner: group:agents
  system: core
  subcomponentOf: kernel
  consumesApis: [change-sets, vocab]
  dependsOn: [resource:git-repo]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: encoder-morphogen
  description: Morphogen's verdicts as claims - DQV measurements with PROV lineage.
  annotations:
    substrate.dev/intent: Let kernel know what was judged, on what evidence, at what cost.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules/encoder-morphogen (D-99); run by scripts/verdicts.sh and a PostToolUse hook (S-32)
    substrate.dev/step: "2"
spec:
  type: service
  lifecycle: experimental
  owner: group:agents
  system: core
  subcomponentOf: kernel
  consumesApis: [judge-api, change-sets, vocab]
  dependsOn: [resource:evidence-log]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: map-drift
  description: The declared map against what is observed; each gap to the review lane with claims on both sides.
  annotations:
    substrate.dev/intent: Notice when practice drifts from the map, and let a person decide which side is right.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules/map-drift (D-100). Not running since S-41 (its observed half was the metrics observer); step 2 gives it one from code and running containers (S-44)
    substrate.dev/step: "2"
spec:
  type: service
  lifecycle: experimental
  owner: group:operator
  system: core
  subcomponentOf: kernel
  consumesApis: [change-events, api-views, change-sets]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: validator
  description: SHACL validation of every change set before it applies.
  annotations:
    substrate.dev/intent: Refuse change sets that break the shapes; never write.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules/validator-shacl (D-24)
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: core
  subcomponentOf: kernel
  consumesApis: [change-events, api-views, vocab]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: belief-model
  description: Belief from independent support and contradiction; swappable.
  annotations:
    substrate.dev/intent: Score each claim between 0 and 1 from support, contradiction and fallen premises - claims as hypotheses.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules/belief-corroboration (D-04, D-27, D-62)
spec:
  type: service
  lifecycle: production
  owner: group:agents
  system: core
  subcomponentOf: kernel
  consumesApis: [change-events, api-views, change-sets]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: verifiers
  description: Quotes checked against sources; conclusions flagged when a premise falls.
  annotations:
    substrate.dev/intent: No method verifies its own output (kernel invariant 5).
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules verifier-quotes (D-67) and truth-maintenance (D-90)
spec:
  type: service
  lifecycle: production
  owner: group:agents
  system: core
  subcomponentOf: kernel
  consumesApis: [change-events, api-views, change-sets]
  dependsOn: [resource:artifact-store]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: recall
  description: BM25 by default, embeddings and re-ranking opt-in; indexes are read models.
  annotations:
    substrate.dev/intent: Find the claims a question needs, ranked with belief.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules recall-index and recall-dense (D-60, D-61, D-66)
spec:
  type: service
  lifecycle: production
  owner: group:agents
  system: core
  subcomponentOf: kernel
  providesApis: [recall-api]
  consumesApis: [api-views, change-events]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: control-loop
  description: Monitor, analyse, plan - conformance against the documented process, and the process learner.
  annotations:
    substrate.dev/intent: Notice when behaviour leaves the documented process and propose either a fix or a revised process.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules conformance and learner-process (D-50, D-76), parts of kk serve's default; observer-prometheus waits for the metrics option
spec:
  type: service
  lifecycle: production
  owner: group:agents
  system: core
  subcomponentOf: kernel
  consumesApis: [api-views, change-sets]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: identity-resolver
  description: Which records and mentions name the same entity.
  annotations:
    substrate.dev/intent: Link names, roles and records of one thing - exactMatch when certain, closeMatch for review; every merge reversible.
    substrate.dev/fill: build
    substrate.dev/basis: kernel M6-T9 (planned); Morphogen demos/entity-resolution supplies the cells and held-out pairs (S-07)
    substrate.dev/candidates: Splink 5.0.0 (MIT), as M6-T9 names
spec:
  type: service
  lifecycle: experimental
  owner: group:agents
  system: core
  subcomponentOf: kernel
  consumesApis: [api-views, change-sets, vocab]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ui
  description: Kernel's UI - search and explain, the review lane, the graph, and views as modules.
  annotations:
    substrate.dev/intent: Let people see what is believed and why, and decide in the review lane.
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules/ui with its views (D-44), at http://127.0.0.1:8080/ui/
spec:
  type: website
  lifecycle: production
  owner: group:operator
  system: core
  subcomponentOf: kernel
  consumesApis: [kernel-mcp-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: front-door
  description: Kernel's Caddy at 127.0.0.1:8080 - /mcp and /ui for kernel, /api for Workbench; HTTPS when KK_SITE names a public host.
  annotations:
    substrate.dev/intent: One address for people and agents.
    substrate.dev/fill: adopt
    substrate.dev/basis: kernel's caddy service (D-74) with deploy/caddy/Caddyfile (kernel's routes plus /api); CADDY_IMAGE pins docker.io/library/caddy:2.11.7-alpine
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: core
  consumesApis: [kernel-mcp-api, workbench-api]
---
# ================================================================ CORE: judge and actor
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: morphogen
  description: The judge - rules from the base, outside measurement, held-out cases, A/A checks, the red team, the evidence log.
  annotations:
    substrate.dev/intent: Accept a change only on evidence the changer cannot reach. The one hard restriction (S-46) - it exists because the changer is expected to try to reward-hack sometimes.
    substrate.dev/fill: existing
    substrate.dev/basis: repos/morphogen; its Claude Code plugin, installed from GitHub so the judge is never the candidate
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: core
  providesApis: [judge-api]
  dependsOn: [resource:evidence-log, resource:sandbox, resource:git-repo]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: claude-code
  description: The actor - explores, interviews, researches, builds and maps; one session is one turn of the loop.
  annotations:
    substrate.dev/intent: Close gaps between the intended and the observed, through responses that are judged and recorded.
    substrate.dev/fill: existing
    substrate.dev/basis: Claude Code, with kernel's MCP server and hooks through bin/ (S-03, S-19, kernel D-95)
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: core
  consumesApis: [kernel-mcp-api, judge-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: skills
  description: Substrate's procedures - Claude Code skills, here and in kernel and Morphogen.
  annotations:
    substrate.dev/intent: Hold how to do each kind of work; a skill is a text cell Morphogen can judge and improve.
    substrate.dev/fill: existing
    substrate.dev/basis: .claude/skills (setup, build-out, upstream); kernel's skill-interview, skill-process-extraction; Morphogen's skills/map
spec:
  type: library
  lifecycle: production
  owner: group:agents
  system: core
  subcomponentOf: claude-code
  consumesApis: [judge-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: interviewer
  description: Asks people what the map cannot see, and records each answer as a claim attributed to them.
  annotations:
    substrate.dev/intent: Fill the intended half of a system from the people who hold it (S-43).
    substrate.dev/fill: existing
    substrate.dev/basis: kernel modules skill-interview and map-gaps (the gaps an interviewer asks about)
    substrate.dev/step: "5"
spec:
  type: library
  lifecycle: experimental
  owner: group:agents
  system: core
  subcomponentOf: claude-code
  consumesApis: [kernel-mcp-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: researcher
  description: Searches the source catalogs, shortlists candidates as cited entries, and tests them.
  annotations:
    substrate.dev/intent: Make choices from catalogs, not best guesses (S-47).
    substrate.dev/fill: build
    substrate.dev/basis: a skill to write in step 4, over the sources system's registries
    substrate.dev/step: "4"
spec:
  type: library
  lifecycle: experimental
  owner: group:agents
  system: core
  subcomponentOf: claude-code
  consumesApis: [kernel-mcp-api, judge-api]
---
# ================================================================ CORE: skills and hooks (AiResource, Backstage 1.51; kernel D-102)
# Each is a part the self-encoder reads from .claude/ (skills by their frontmatter name, hooks as <event>-<script>),
# so map-drift can tell when one exists that the map does not declare, or the other way round.
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: setup
  description: Bring the stack up on a machine and wire it, checking each step before the next.
  annotations:
    substrate.dev/basis: .claude/skills/setup/SKILL.md
spec:
  type: skill
  lifecycle: production
  owner: group:agents
  system: core
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: build-out
  description: Work through docs/build.yaml one step at a time - brief, build, check, record - stopping at the owner's decisions.
  annotations:
    substrate.dev/basis: .claude/skills/build-out/SKILL.md
spec:
  type: skill
  lifecycle: production
  owner: group:agents
  system: core
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: upstream
  description: Take a fix or improvement to kernel or Morphogen upstream, by branch and pull request in that repository.
  annotations:
    substrate.dev/basis: .claude/skills/upstream/SKILL.md
spec:
  type: skill
  lifecycle: production
  owner: group:agents
  system: core
---
apiVersion: backstage.io/v1alpha1
