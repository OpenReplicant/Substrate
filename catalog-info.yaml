apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: metrics
  description: Prometheus - counters over time (gateway cost, allocations, service rates) for kernel's observer to record as claims.
  annotations:
    substrate.dev/fits: The observed half - kernel's observer-prometheus records each window as observed claims (kernel D-52).
    substrate.dev/interface: kernel's observer-prometheus reads PromQL from PROMETHEUS_URL with queries in a queries.yaml; nothing else depends on it.
    substrate.dev/when: A gap needs numbers over time - cost, error rates, latency.
