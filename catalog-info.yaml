    substrate.dev/basis: .claude/settings.json hooks.PostToolUse (matcher mcp__.*morphogen.*)
spec:
  type: hook
  lifecycle: production
  owner: group:operator
  system: core
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: posttooluse-map
  description: After an edit to a catalog-info.yaml, reads the map into kernel again (scripts/map.sh --hook).
  annotations:
    substrate.dev/basis: .claude/settings.json hooks.PostToolUse (matcher Edit|Write|MultiEdit)
spec:
  type: hook
  lifecycle: production
  owner: group:operator
  system: core
---
