# Substrate's map, in Backstage's catalog entity model; Workbench reads it (substrate:catalog). Three systems
# (S-47):
#   core     what runs: Workbench, Morphogen, Claude Code, and the glue
#   options  components substrate can choose when a step needs one (lifecycle: option); none of them runs now
#   sources  catalogs of catalogs: registries to search when no known component fits (lifecycle: listed)
# One file, so every ref resolves within it (scripts/map.sh reads it into Workbench; a
# PostToolUse hook does it after each edit). Morphogen reads it as cells (morphogen.yaml).
#
# Annotations:
#   substrate.dev/intent      what the part is for
#   substrate.dev/fill        existing (built, in Workbench, Morphogen or Claude Code), adopt (open source as is),
#                             build (to write: a Workbench plugin, a skill, or glue here)
#   substrate.dev/basis       where an existing part lives
#   substrate.dev/step        the build step (docs/build.yaml) it belongs to
#   substrate.dev/filler     which filler of its slot it is, as scripts/contract.sh names it (compose, env, openbao, ...)
#   substrate.dev/observed-as how it is recognised running: <type>:<slug> items substrate:observed reads (a slug may
#                             be a glob), comma-separated; substrate:drift raises what no part accounts for (OBSERVE.md)
#   APIs:     morphogen.dev/tests (the slot's contract test, which any filler must pass; Morphogen runs it)
#   options:  substrate.dev/fits (where it would sit), substrate.dev/interface (what keeps it possible now),
#             substrate.dev/when (what would bring it back), substrate.dev/restore (the commit and paths to
#             restore it from), substrate.dev/evidence (what was learned running it), substrate.dev/candidates
#   sources:  substrate.dev/search (how to search it), substrate.dev/gives (what metadata it returns),
#             substrate.dev/limits (what to know first), substrate.dev/checked (when the endpoint last answered)

apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: operator
  description: The human owner. Holds organization (purpose, goals, policy, who decides) and approves in the review lane.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: agents
  description: Agent-owned parts; agents change them freely, behind the judge.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: substrate
  description: A super-agent that models systems as cited claims, acts on them, and changes (itself included) only on evidence it cannot fake.
spec:
  owner: group:operator
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: core
  description: What runs - Workbench (store and model), Morphogen (judge), Claude Code (actor), and the glue.
spec: {owner: group:operator, domain: substrate}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: options
  description: Components substrate can choose when a step needs one; each says where it fits and how to bring it back (spec 8).
spec: {owner: group:operator, domain: substrate}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: sources
  description: Registries to search for candidates when no known component fits - catalogs of catalogs (spec 5).
spec: {owner: group:operator, domain: substrate}
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: front-door
  description: Caddy at 127.0.0.1:8080 - Workbench's shell at /, its API at /api, its server at /wb/api; HTTPS when PUBLIC_HOST names a public host.
  annotations:
    substrate.dev/intent: One address for people and agents.
    substrate.dev/fill: adopt
    substrate.dev/basis: deploy/compose.yaml service caddy, deploy/caddy/Caddyfile (the shell's page is a Caddy template); CADDY_IMAGE pins docker.io/library/caddy:2.11.7-alpine
    substrate.dev/observed-as: "container:substrate-caddy, route:substrate-caddy-*"
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: core
  consumesApis: [workbench-api]
---
# ================================================================ CORE: judge and actor
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: morphogen
  description: The judge - rules from the base, outside measurement, held-out cases, A/A checks, the red team, the evidence log.
  annotations:
    substrate.dev/filler: morphogen
    substrate.dev/intent: Accept a change only on evidence the changer cannot reach. The one hard restriction (S-46) - it exists because the changer is expected to try to reward-hack sometimes.
    substrate.dev/fill: existing
    substrate.dev/basis: repos/morphogen; its Claude Code plugin, installed from GitHub so the judge is never the candidate
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: core
  providesApis: [judge-api]
  consumesApis: [evidence-api, sandbox-api, repository-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: claude-code
  description: The actor - explores, interviews, researches, builds and maps; one session is one turn of the loop.
  annotations:
    substrate.dev/intent: Close gaps between the intended and the observed, through responses that are judged and recorded.
    substrate.dev/fill: existing
    substrate.dev/basis: Claude Code, with Workbench's MCP server (scripts/harness.py, a token per connection from scripts/workbench-mcp-headers.sh) and Morphogen's plugin (S-03, S-57)
    substrate.dev/observed-as: "connection:claude-code-workbench"
spec:
  type: service
  lifecycle: production
  owner: group:operator
  system: core
  consumesApis: [workbench-mcp-api, judge-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: skills
  description: Substrate's procedures - Claude Code skills, here and in Morphogen.
  annotations:
    substrate.dev/intent: Hold how to do each kind of work; a skill is a text cell Morphogen can judge and improve.
    substrate.dev/fill: existing
    substrate.dev/basis: .claude/skills (setup, build-out, upstream, research); Morphogen's skills (morphogen, map)
spec:
  type: library
  lifecycle: production
  owner: group:agents
  system: core
  subcomponentOf: claude-code
  consumesApis: [judge-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: interviewer
  description: Asks people what the map cannot see, and records each answer as a claim attributed to them.
  annotations:
    substrate.dev/intent: Fill the intended half of a system from the people who hold it (S-43).
    substrate.dev/fill: build
    substrate.dev/basis: to rebuild on Workbench (kernel's skill-interview and map-gaps are the reference, kernel being an option now)
    substrate.dev/step: "5"
spec:
  type: library
  lifecycle: experimental
  owner: group:agents
  system: core
  subcomponentOf: claude-code
  consumesApis: [workbench-mcp-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: reasoner
  description: Draws what follows from stated relations by OWL 2 RL rules (transitive, inverse and symmetric properties in the vocabulary) and writes each conclusion back as a claim citing its premises.
  annotations:
    substrate.dev/intent: Rules applied, the first symbolic inference engine (spec section 1, direction); a conclusion lasts only as long as its premises.
    substrate.dev/fill: build
    substrate.dev/basis: substrate:reasoner (plugins/substrate/substrate_plugin.py); its terms from plugins/substrate/vocabulary.yaml (vocab.py, vocabulary.axioms.yaml); premises retract conclusions by Workbench's trigger (migration 009)
    substrate.dev/step: "7"
spec:
  type: library
  lifecycle: experimental
  owner: group:agents
  system: core
  consumesApis: [workbench-api, workbench-server-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: observer
  description: Reads a system as it runs - the host, its containers, images and volumes, setting names, routes, APIs, UIs, plugins, connections and Morphogen's cells - into claims, so drift can compare every kind with the map.
  annotations:
    substrate.dev/intent: Fill the observed half of a model from the machine itself, the same way on any machine (S-62).
    substrate.dev/fill: build
    substrate.dev/basis: plugins/substrate/observe.py (the collector, on the host, as observe.yaml says), substrate:observed and substrate:drift (plugins/substrate/substrate_plugin.py), scripts/observe.sh; plugins/substrate/OBSERVE.md
    substrate.dev/step: "5"
spec:
  type: library
  lifecycle: experimental
  owner: group:agents
  system: core
  consumesApis: [workbench-api, workbench-server-api, tools-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: researcher
  description: Searches the source catalogs, shortlists candidates as cited entries, and tests them.
  annotations:
    substrate.dev/intent: Make choices from catalogs, not best guesses (S-47).
    substrate.dev/fill: existing
    substrate.dev/basis: .claude/skills/research (the skill), docs/choices/*.yaml (each choice), scripts/trials/ (shortlist tests), substrate:choices (into Workbench with registry quotes)
    substrate.dev/step: "4"
spec:
  type: library
  lifecycle: experimental
  owner: group:agents
  system: core
  subcomponentOf: claude-code
  consumesApis: [workbench-mcp-api, judge-api]
---
# ================================================================ CORE: skills and hooks (AiResource, Backstage 1.51; kernel D-102)
# Each is a part the self-encoder reads from .claude/ (skills by their frontmatter name, hooks as <event>-<script>),
# so map-drift can tell when one exists that the map does not declare, or the other way round.
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: setup
  description: Bring the stack up on a machine and wire it, checking each step before the next.
  annotations:
    substrate.dev/basis: .claude/skills/setup/SKILL.md
spec:
  type: skill
  lifecycle: production
  owner: group:agents
  system: core
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: build-out
  description: Work through docs/build.yaml one step at a time - brief, build, check, record - stopping at the owner's decisions.
  annotations:
    substrate.dev/basis: .claude/skills/build-out/SKILL.md
spec:
  type: skill
  lifecycle: production
  owner: group:agents
  system: core
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: research
  description: Choose from the catalogs - write the need, search the sources, record candidates with registry quotes, test the shortlist, record the pick and the rejections.
  annotations:
    substrate.dev/basis: .claude/skills/research/SKILL.md
spec:
  type: skill
  lifecycle: experimental
  owner: group:agents
  system: core
  subcomponentOf: researcher
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: upstream
  description: Take a fix or improvement to kernel or Morphogen upstream, by branch and pull request in that repository.
  annotations:
    substrate.dev/basis: .claude/skills/upstream/SKILL.md
spec:
  type: skill
  lifecycle: production
  owner: group:agents
  system: core
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: sessionstart-spec
  description: At session start, names the build plan's next step while docs/spec.md is in place (scripts/spec.py hook).
  annotations:
    substrate.dev/basis: .claude/settings.json hooks.SessionStart
spec:
  type: hook
  lifecycle: production
  owner: group:operator
  system: core
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: posttooluse-verdicts
  description: After a Morphogen tool call, records its verdicts in Workbench (scripts/verdicts.sh --hook, substrate:morphogen).
  annotations:
    substrate.dev/basis: .claude/settings.json hooks.PostToolUse (matcher mcp__.*morphogen.*)
spec:
  type: hook
  lifecycle: production
  owner: group:operator
  system: core
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: posttooluse-map
  description: After an edit to a catalog-info.yaml, reads the map into Workbench again and checks drift (scripts/map.sh --hook).
  annotations:
    substrate.dev/basis: .claude/settings.json hooks.PostToolUse (matcher Edit|Write|MultiEdit)
spec:
  type: hook
  lifecycle: production
  owner: group:operator
  system: core
---
# ================================================================ CORE: Workbench (S-52, S-53, S-54)
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: workbench
  description: A content system on Postgres - typed tables per content type, claims beside every value, vocabularies and SSSOM mappings, plugins.
  annotations:
    substrate.dev/intent: Hold what substrate knows about any system as typed items whose every value can say where it came from; the store and the model since S-57.
    substrate.dev/fill: build
    substrate.dev/basis: workbench/ (BRIEF.md; W1 to W4 done), plugins/substrate
    substrate.dev/observed-as: "ui:wb-core, plugin:substrate, ui:plugin-substrate"
    substrate.dev/step: "W4"
spec:
  type: service
  lifecycle: experimental
  owner: group:operator
  system: core
  providesApis: [workbench-api, workbench-mcp-api]
  consumesApis: [database-api]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: workbench-rest
  description: PostgREST v16.5 at /api - the Workbench schema as a JSON API with an OpenAPI description; roles from the sign-in JWT.
  annotations:
    substrate.dev/filler: postgrest
    substrate.dev/intent: Serve the store without a hand-written data API, so every client gets the rules Postgres enforces.
    substrate.dev/fill: adopt
