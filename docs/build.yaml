# The spec's build plan (docs/spec.md, section 8) and where it stands. The `build-out` skill works through it
# while docs/spec.md is in place; scripts/spec.py reads it (status, next, set). The previous plan (steps 0 to 13,
# "a mind in an organism") is in git at a00fb61 (S-41).
#
# status: todo | doing | done | blocked | dropped
#   blocked  waits on something outside the step (named in `waiting_on`); the skill moves to the next step
#            whose `after` steps are done, if there is one
#   dropped  the owner or a verdict decided against it; the skill skips it
# needs_owner: the step contains a decision that is the owner's (kernel changes, licences, money). The skill
#   prepares the case (a brief, a draft PR, the evidence) and asks; it does not decide.
# check: what proves the step done; run it, and only then set status to done (with `done_on` and the commit).
steps:
  - id: 1
    status: done
    done_on: 2026-11-08
    title: Cut to the core
    spec: "4, 8"
    where: substrate (deploy/, scripts/, services/, catalog-info.yaml, README.md)
    after: []
    check: >-
      scripts/up.sh starts only kernel's Postgres, kernel (with the Caddy its own stack runs) and substrate-tools;
      scripts/check.sh passes on compose with Podman; Bifrost, Prometheus, the OpenTelemetry collector, Backstage,
      OpenBao, Nomad, the console and the bus database are gone from deploy/, scripts/ and services/; each is a
      component in catalog-info.yaml's `options` system (lifecycle option) saying where it fits, the interface
      that keeps it possible, when to bring it back and the commit to restore it from (spec section 8); the
      `sources` system lists the registries substrate can search; and
      `bin/morphogen structure check morphogen.yaml` reports no errors
    notes: >-
      First, if Claude Code is routed through the gateway (`scripts/gateway.py status`), turn it off
      (`scripts/gateway.py off`) and restart the session before removing Bifrost; otherwise the session loses its
      model. Likewise `scripts/telemetry.py off` before removing the collector. Keep the interfaces section 7 names
      (rt_* with compose only, sec_* with env only, spec section 8). Keep encoder-morphogen and encoder-backstage wiring
      (scripts/verdicts.sh, scripts/map.sh); drop the observer and map-drift parts that read Prometheus, and note
      that step 2 replaces their observed half. Ask the owner before deleting any data volume.

  - id: 2
    status: done
    done_on: 2026-11-08
    title: "Autopoietic: one loop on itself"
    spec: "1, 3, 6, 7"
    where: substrate, Workbench (substrate:catalog, substrate:claude-code, substrate:drift)
    after: [1]
    check: >-
      substrate is modelled as its own kernel project at component level (services, skills, hooks, parameters as
      catalog components), through the same encoders and checks any other system would use, with nothing that
      works only on itself; with catalog-info.yaml as the intended half and what is observed (the code, the
      skills and hooks on disk, the running containers) as the observed half, one real gap reaches the review lane;
      a change closing it is proposed and decided by whoever decides that kind of change (spec section 7, S-51: a
      map revision by the owner in the review lane, since Morphogen refuses catalog edits; a component change by a
      Morphogen verdict); and Workbench, asked about the gap, returns gap, change and decision by id
      (scripts/trace.sh, the item's inspector, MCP's claims tool)
    notes: >-
      Done 2026-11-09 on Workbench (S-58): gap 16427fcb (undeclared:skill:knowledge-kernel) raised by
      substrate:drift, declined by the owner (change the repository), the kk-installed skill moved to .state/removed/,
      and substrate:claude-code retracted its claims (84a61be0, 31013bf8); scripts/trace.sh knowledge-kernel shows the
      chain. Absorbs the previous plan's steps 1 (verdicts become claims, kernel D-99, built) and 2 (the map becomes
      claims, kernel D-100, built). What is new is the observed half without telemetry, and the loop run once end
      to end. If the observed side needs a kernel change (map-drift reading something other than the metrics
      observer), that is an upstream PR and the owner's call.

  - id: 3
    title: A content system for the model
    spec: "4"
    where: workbench/ (S-52 to S-57)
    after: [2]
    status: done
    done_on: 2026-11-09
    check: >-
      a catalog entry is a content type, read and edited as an item (with a view), with its claims and drift checks
      unchanged; and a new kind of catalog entry (one a step-2 run did not have, such as a package from a registry)
      can be added as a content type without changing the store or the loop
    notes: >-
      Was "kernel as a content system" (kernel D-101, PR #112). The owner chose a different route (S-52): Workbench,
      a content system with claims beside typed tables, which replaced kernel (S-57). Checked on it: catalog entries
      are `component` items read and edited in the shell, their claims and substrate:drift unchanged; `hook` and
      `verdict` were added in W3 and W4 as plugin content types, with no change to the store or the loop. Ontologies
      and aliases: wb.term and wb.mapping (SSSOM) exist; no vocabulary has been loaded into them yet.

  - id: 4
    status: done
    done_on: 2026-11-09
    title: Catalogs to choose from
    spec: "2, 5"
    where: substrate (catalog-info.yaml systems options and sources), the research skill, docs/choices, substrate:choices
    after: [3]
    check: >-
      one real choice a later step needs (a component, library or service) is made this way: the source catalogs
      are searched; at least three candidates become catalog entries with cited claims (licence, release age,
      maintenance, fit, each quoting where it came from); the shortlist is tested against the need, with a
      Morphogen verdict where the question is which is better; the pick and the rejections stay in Workbench with
      their evidence, and recall answers "why this one?" from them
    notes: >-
      Owner, 2026-11-08: "catalogs of components it could choose from rather than 'best guess' and sometimes
      'catalogs of searchable-catalogs' (npm, pip, github, apt, etc) is the best way to go", with the agent
      "curating and researching and testing". The first skill here is a research skill: search a registry, record
      candidates as claims. If a registry needs an encoder of its own (deps.dev, say), build it as a kernel module
      upstream. (2026-11-09: kernel has left the stack, S-57, so the record is in Workbench and registry reading is
      substrate:choices in substrate's plugin; the check is otherwise unchanged.) Done 2026-11-09 (S-59): owner
      asked for search and reasoners, "keep it simple"; the choice was the SPARQL endpoint over Workbench
      (docs/choices/rdf-endpoint.yaml). GitHub topics, deps.dev and image registries searched; 8 candidates with
      licence, releases, last push and stars quoted from GitHub and deps.dev; 4 shortlisted and tried on the same
      three queries over the live tables (scripts/trials/rdf-endpoint/run.sh); Ontop picked as the only one with
      right reasoning answers and current data; no Morphogen verdict, since the need decided it and no two met it.
      Recall: search "ontop sparql" finds choice rdf-endpoint and its candidates, each with its reason.

  - id: 5
    title: "Engineer: another system beside itself"
    spec: "1, 6, 7"
    where: substrate, a second kernel project for the system
    after: [4]
    status: todo
    needs_owner: true
    check: >-
      a real system the owner names is a second project in the same world model as substrate, its components
      cited from at least one interview (a person's statements as claims attributed to them, quoting the
      transcript) and one observed source; the relations between the two systems (substrate manages it, a
      component of one uses an API of the other) are claims; at least one gap reaches review; and one change
      closing a gap is proposed, judged by Morphogen and applied by the same loop that changed substrate in step 2
    notes: >-
      The owner picks the system and who is interviewed. A catalog entry that names an entity in another
      system's catalog is a cross-project reference; kernel's encoder-backstage resolves refs within one file
      today, so that is an upstream change when this step needs it. An interview skill (questions drawn from the
      gaps and the thin parts of the graph) is likely the first new skill.

  - id: 6
    title: "Generalist: a second domain"
    spec: "1, 2, 4"
    where: whatever the domain needs, added through the loop
    after: [5]
    status: dropped
    needs_owner: true
    check: >-
      a domain unlike step 5's reaches step 5's check; what it needed (content types, vocabularies, mappings,
      encoders, code, a view) was added through the loop (proposed, judged where it claimed to improve something,
      recorded as claims); and kernel's store, Morphogen and the loop itself did not change to fit it
    notes: >-
      The owner picks the domain. Owner, 2026-11-08: a new kind of system "may come with code and maybe even a
      CMS/UI view"; the design stays open, and the only hard restriction is Morphogen's, against reward hacking.
      Dropped 2026-11-08 (S-49, owner): managing systems of components, itself included, is the scope; the
      generalist level stays a direction in the spec rather than a step.
