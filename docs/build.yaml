    notes: >-
      Added as step 8 in S-60; renumbered and narrowed in S-61, taking in what step 7 (vocabularies) needed:
      substrate's own terms only. External vocabularies (PROV-O, SPDX, DOAP, SKOS, ontology registries) are an
