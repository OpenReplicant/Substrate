      inference path: "a good symbolic place to start" for distilling fast, expert systems from what the LLM
      does (spec section 1, direction).
      Done 2026-11-09 (S-64, S-65): relations as claims with premises, generated vocabulary and mappings, Ontop at /sparql (run.sh live passes), substrate:reasoner (OWL 2 RL), pgGraph paths as the caller.

