# A choice made from the catalogs (spec section 5, direction step 1): the first environment, a benchmark for support or back-office work.
# Task 3 records the need and the candidates only. No trial, verdict or pick yet: task 5 makes them.
# Every fact below was read on 2026-11-15 at the URL beside it. "not found" means the page did not say.
question: Which benchmark should be substrate's first environment for support or back-office work?
asked_by: owner
asked_on: "2026-11-15"
quote: "what people/businesses are paying for AI to do now is where we should focus"
need:
  - "support or back-office work with an outcome a script can check (a final database state or a checker, not a model's opinion)"
  - "a permissive licence for the code and, separately, for the data (docs/archive/direction.md; house rule 6)"
  - "a judged run (7 to 10 paired rounds of base and candidate over the held-out cases) fits in 1,000 free calls a day, or runs on the local model (Granite 4.0 Micro, about one second a call)"
  - "held-out cases the models have not seen, or a way to make them (a public test set counts as dev, docs/contracts/environment.md)"
  - "the world runs in Podman on this machine with no paid service"
searched:
  - "web search, 2026-11-15: 'OmegaUse OfficeVal benchmark' (found arXiv 2607.27155, the project site and the repository)"
  - "web search, 2026-11-15: 'tau-bench benchmark tool-agent-user interaction airline retail paper arXiv average steps' (found arXiv 2406.12045; no average step count in any result)"
  - "web search, 2026-11-15: 'CRMArena-Pro benchmark LLM agents CRM customer service sales tasks github'"
  - "web search, 2026-11-15: 'WorkArena ServiceNow benchmark github license enterprise knowledge work agents' (secondary sites disagreed on the licence; the LICENSE file was read directly)"
  - "web search, 2026-11-15: 'benchmark customer service agent policy compliance tool use simulated customer open source 2026 github' (leads: EnterpriseOps-Gym, JourneyBench arXiv 2601.00596, DRIP-R; JourneyBench and DRIP-R were not followed up, no repository was looked for)"
  - "github: api.github.com/repos/<owner>/<name> and each repository's page, README, LICENSE and docs, 2026-11-15, for sierra-research/tau2-bench, sierra-research/tau-bench, TheAgentCompany/TheAgentCompany, baidu-frontier-research/OmegaUse-OfficeVal, ServiceNow/EnterpriseOps-Gym, stonybrooknlp/appworld, ServiceNow/WorkArena, SalesforceAIResearch/CRMArena, asappresearch/abcd"
  - "arxiv abstract and HTML pages, 2026-11-15: 2406.12045, 2412.14161, 2607.27155, 2603.13594, 2407.18901 (the PDFs of 2607.27155 and 2505.18878 would not decode, so CRMArena-Pro's paper was not read)"
  - "huggingface dataset pages, 2026-11-15: baidu-frontier-research/OmegaUse-OfficeVal, ServiceNow-AI/EnterpriseOps-Gym"
  - "not reached: a leaderboard page for any candidate (taubench.com, Artificial Analysis) was not read; leaderboard facts come from READMEs only"
candidates:
