# Task 5, part 1 (2026-11-15): the budget arithmetic, before any trial. Calls per episode are assumptions until a
# trial measures them: no candidate's page gave a median (see each candidate's agent_calls_per_task).
budget:
  formula: "calls per judged run = held-out cases x calls per episode (agent + world) x 2 sides x rounds"
  rounds: "7 to 10 (morphogen.yaml's rounds; at 7 paired rounds the smallest sign-test p is 1/128 = 0.0078, so a pass at 0.01 needs every round to agree)"
  limits:
    free_tier: "1,000 calls a day and 20 a minute for the account (OpenRouter free, S-87)"
    local_model: "no cap; Granite 4.0 Micro measured at 0.98 s and 335 tokens a call on one-shot prompts (docs/choices/local-model.yaml). A support episode's prompt carries a policy and the conversation so far, several thousand tokens, so seconds per call there are not known: the trial measures them"
  scenarios:
    - shape: "one call a case (classify, extract, route): what the drift-gaps bench does now"
      per_judged_run: "60 cases x 1 x 2 x 7 = 840 calls"
      free_tier: "one judged run a day"
      local_model: "about a quarter of an hour at 1 s a call"
    - shape: "a tool-using episode with no simulated user (EnterpriseOps-Gym: expert trajectories average 9.15 steps, maximum 34)"
      per_judged_run: "30 cases x 12 x 2 x 7 = 5,040 calls (12 calls an episode is an assumption)"
      free_tier: "five days for one verdict"
      local_model: "7 hours at 5 s a call, 14 at 10 s"
    - shape: "a support conversation with a model as the customer (tau2-bench: 50 public tasks a domain; tau-bench caps an episode at 30 agent actions)"
      per_judged_run: "50 cases x 20 x 2 x 7 = 14,000 calls (20 calls an episode, agent and customer together, is an assumption); 20 cases gives 5,600"
      free_tier: "14 days for one verdict at 50 cases; 6 at 20"
      local_model: "39 hours at 10 s a call for 50 cases; 16 for 20"
  reading:
    - "The free tier cannot carry a judged run of any multi-step candidate: one verdict would take most of a week or more. It can carry a one-call-a-case environment, one verdict a day."
    - "The local model can carry a multi-step run only if episodes are short, calls are a few seconds, and the case count is 20 to 30. Whether 20 to 30 cases make a round's score stable enough for seven rounds to agree is what direction step 3's same-against-same check is for."
    - "Unknown, and it decides more than the call count: whether a 3B local model scores above the floor at all on a tool-using support task. The published results read were for far larger models. A baseline at the floor cannot be made worse, so the worse-candidate check of step 3 would have nothing to refuse."
    - "So the trial must measure, on dev tasks with the local model: calls per episode (agent and customer apart), seconds and tokens per call, and the share of episodes with reward above zero."
