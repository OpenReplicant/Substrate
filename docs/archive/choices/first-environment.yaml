      world_calls_per_task: "a model plays the customer in every task. Custom runs: gpt-4.1-2025-04-14 at temperature 0 for agent and user by default; released benchmarks: user gpt-5.5 low effort. Communication judge gpt-5.5 low effort; NL-assertion judge gpt-5.4-mini-2026-03-17. Calls per task: not found (docs/running-the-benchmark.md, 2026-11-15). Ollama is not mentioned there; the README says it uses LiteLLM so any supported provider works."
      cases: "text-v1 and voice-v2: the same 50 frozen tasks per domain (airline, retail, telecom); voice-v1 English: 50 airline, 114 retail, 114 telecom; banking_knowledge: 97 tasks and 698 documents (CHANGELOG 1.0.0); intake: 200 tasks, voice by default (CHANGELOG 2.0.0). The Gym doc is listed as covering train/test splits, but its sizes were not read. The task files are public, so they count as dev. No fresh-case generator found. (README, CHANGELOG, docs/task-subsets.md, 2026-11-15)"
      needs_to_run: "Python >=3.12 <3.14, uv, API keys in .env through LiteLLM. Docker and Podman are not mentioned for the text domains. Network: the model provider. Voice needs portaudio and ffmpeg and realtime providers (OpenAI, Gemini, xAI). Disk, RAM, GPU: not found. (github.com/sierra-research/tau2-bench README, 2026-11-15)"
      contract_fit: "the README lists a Gymnasium-compatible environment (uv sync --extra gym) with a play mode, which is the contract's reset/step shape. Seed defaults to 300 and the custom-run user simulator is at temperature 0; the docs make no determinism claim. Replay without a model: the DB reward is a hash of a replayed state, which suggests it; not stated as a guarantee. Gym doc itself was not read."
