      licence_code: "MIT. LICENSE file begins 'MIT License ... Copyright (c) 2025 Sierra Research' (raw.githubusercontent.com/sierra-research/tau2-bench/main/LICENSE, 2026-11-15); GitHub API spdx_id MIT (api.github.com/repos/sierra-research/tau2-bench, 2026-11-15)"
      licence_data: "not found: the README, CHANGELOG and docs read give no separate data licence; tasks live in the same repository (github.com/sierra-research/tau2-bench, 2026-11-15)"
      upkeep: "pushed_at 2026-11-10; CHANGELOG: 2.0.0 on 2026-10-19 (a scoring change, not comparable with 1.x), 1.0.1 on 2026-07-15 (fixed banking_knowledge grading and one gold refund); 342 open issues by the API count (includes pull requests); README says 1.x submissions are still accepted at taubench.com; releases page empty (github.com/sierra-research/tau2-bench, raw CHANGELOG.md, 2026-11-15). Whether any open issue says it is broken: not read."
      scored: "reward is the product of the components in evaluation_criteria.reward_basis. DB: hash of the final database against a target hash made by replaying the reference actions on a fresh environment, deterministic. ACTION: deterministic match of tool calls. COMMUNICATE: a semantic LLM judge by default, a substring scorer with --communicate-scorer substring. NL_ASSERTION: an LLM judge, marked experimental. So a database-and-action-only reward needs no model, and the docs do not say the score can be re-run outside the agent's process; that DB and ACTION need no model on a stored simulation is the reader's inference, not documented (raw.githubusercontent.com/sierra-research/tau2-bench/main/docs/evaluation.md, 2026-11-15)"
