  - name: d3
    title: d3 (a decision model)
    registry: ollama
    tasks: [text-classification]
    licence: Apache-2.0
    outcome: rejected
    shortlisted: false
    reason: "Made for yes-or-no answers, but released within the last two weeks and served on its own API rather than chat; the one to look at again after 2026-11-25."
