trial:
  script: scripts/trials/model-gateway/run.py (the gateway's trial makes the real call); the handlers' own check makes the rest
  run_on: "2026-11-11"
verdict: >-
  No Morphogen verdict yet: the pick rests on the two leaderboards. Which handler is better on substrate's own inputs
  is the question the ladder's scoring answers over time (each answer scored against the person's decision).
pick: "small: google/gemma-4-31b-it:free; large: nvidia/nemotron-3.5-super-vl:free"
reason: >-
  Chosen first by the leaderboards (small: Gemma 4 26B A4B, Arena 1437; large: Inkling 2 Small, AA index 31), then
  changed by what they did through the gateway on 2026-11-11: Inkling 2 Small refused every call (403, "only
  available on agentic harnesses"), and Gemma 4 26B A4B was rate-limited upstream (429 from Google AI Studio) on all
  14 calls and again on a probe. So each rank went to its runner-up. Small: Gemma 4 31B, Arena score 1452±7 (rank
  78, the best Arena score of the free models), which answered the probe's gap in 1.8 s with 31 tokens. Large:
  Nemotron 3.5 Super VL (120B, 12B active), AA Intelligence Index 14 (the next after Inkling 2 Small), Arena
  1415±10 (preliminary), which answered in 25.5 s after reasoning (298 tokens). Free models can be withdrawn or
  limited by their providers at any time; a gateway error is retried on the next run, and the ladder's scores say
  which is right more often. Both are the owner's to change (step 18's notes).
probe: >-
  2026-11-11, one gap through the gateway with the small handler's key: gemma-4-31b 200 (1.8 s), gemma-4-26b-a4b 429,
  nemotron-3.5-super-vl 200 (25.5 s), nemotron-3-ultra 200 with an empty answer, nemotron-3.5-lightning 200 (16.2 s,
  891 tokens), ernie-5.5-flash 200 (2.9 s), lfm-2.5-2.6b 200 (2.0 s), dots-3-note 200 (24.7 s); all said declined.
