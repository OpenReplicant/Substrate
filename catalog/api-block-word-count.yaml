# A catalog entry (S-176): Backstage's entity format, read into the kernel by encoder-backstage.
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: block-word-count
  title: The word_count block
  description: Counts the words in a text.
  annotations: {}
spec:
  type: wot-td
  lifecycle: experimental
  owner: owner
  system: substrate
  definition: |-
    {
     "@context": "https://www.w3.org/2022/wot/td/v1.1",
     "title": "word_count",
     "actions": {
      "word_count": {
       "input": {
        "type": "object",
        "properties": {
         "text": {
          "type": "string"
         }
        },
        "required": [
         "text"
        ]
       },
       "output": {
        "type": "object",
        "properties": {
         "words": {
          "type": "integer"
         }
        },
        "required": [
         "words"
        ]
       },
       "safe": true,
       "idempotent": true,
       "forms": [
        {
         "href": "stdio:python -I word_count:run",
         "contentType": "application/json",
         "subprotocol": "substrate-block-stdio"
        }
       ]
      }
     }
    }
