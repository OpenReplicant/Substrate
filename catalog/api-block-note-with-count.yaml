# A catalog entry (S-176): Backstage's entity format, read into the kernel by encoder-backstage.
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: block-note-with-count
  title: The note_with_count plan
  description: Count the words of a text and save it as a note.
  annotations:
    substrate.dev/trigger: '(?is)^save a note called (?P<name>[\w-]+): (?P<text>.+)$'
spec:
  type: wot-td
  lifecycle: experimental
  owner: owner
  system: substrate
  definition: |-
    {
     "@context": "https://www.w3.org/2022/wot/td/v1.1",
     "title": "note_with_count",
     "actions": {
      "note_with_count": {
       "input": {
        "type": "object",
        "properties": {
         "name": {
          "type": "string"
         },
         "text": {
          "type": "string"
         }
        },
        "required": [
         "name",
         "text"
        ]
       },
       "safe": false,
       "forms": [
        {
         "href": "substrate:blocks/run.py",
         "subprotocol": "substrate-plan"
        }
       ]
      }
     }
    }
