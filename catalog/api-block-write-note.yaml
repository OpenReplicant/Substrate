# A catalog entry (S-176): Backstage's entity format, read into the kernel by encoder-backstage.
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: block-write-note
  title: The write_note block
  description: Writes a note into the worker's workspace (WORKER_WORKSPACE, default /workspace) as notes/<name>.txt.
  annotations:
    substrate.dev/gate: blocks.write_note
spec:
  type: wot-td
  lifecycle: experimental
  owner: owner
  system: substrate
  definition: |-
    {
     "@context": "https://www.w3.org/2022/wot/td/v1.1",
     "title": "write_note",
     "actions": {
      "write_note": {
       "input": {
        "type": "object",
        "properties": {
         "name": {
          "type": "string"
         },
         "text": {
          "type": "string"
         }
        },
        "required": [
         "name",
         "text"
        ]
       },
       "output": {
        "type": "object",
        "properties": {
         "path": {
          "type": "string"
         }
        },
        "required": [
         "path"
        ]
       },
       "safe": false,
       "idempotent": true,
       "forms": [
        {
         "href": "stdio:python -I write_note:run",
         "contentType": "application/json",
         "subprotocol": "substrate-block-stdio"
        }
       ]
      }
     }
    }
