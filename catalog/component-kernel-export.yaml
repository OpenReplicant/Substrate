# A catalog entry (S-176): Backstage's entity format, read into the kernel by encoder-backstage.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kernel-export
  title: encoder-substrate
  description: Exports the retired store's items into the kernel as change sets (scripts/kernel.sh export); a one-shot job.
  annotations:
    substrate.dev/licence: Apache-2.0
    substrate.dev/image: ghcr.io/openreplicant/kernel
    substrate.dev/compose-service: kernel-export
    substrate.dev/decision: S-154, the kernel's D-103
spec:
  type: job
  lifecycle: experimental
  owner: owner
  system: substrate
  dependsOn:
  - resource:postgres
  - component:kernel
