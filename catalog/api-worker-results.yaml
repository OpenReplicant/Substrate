# A catalog entry (S-176): Backstage's entity format, read into the kernel by encoder-backstage.
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: worker-results
  title: The worker's results
spec:
  type: asyncapi
  lifecycle: experimental
  owner: owner
  system: substrate
  definition: |-
    {
     "asyncapi": "3.0.0",
     "info": {
      "title": "each task's outcome: text, ok, model_calls, skipped_calls, cited, reply_to",
      "version": "0"
     },
     "channels": {
      "worker.task.done": {
       "address": "worker.task.done",
       "description": "each task's outcome: text, ok, model_calls, skipped_calls, cited, reply_to"
      }
     },
     "x-transport": "pgmq (Postgres), the env schema's topics and queues (S-143)"
    }
