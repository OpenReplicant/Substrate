  - ./component-kernel-export.yaml
  - ./component-kernel-init.yaml
  - ./component-kernel-mcp.yaml
  - ./component-kernel.yaml
  - ./component-llm-fast.yaml
  - ./component-llm.yaml
  - ./component-ollama.yaml
  - ./component-plan-note-with-count.yaml
  - ./component-search.yaml
  - ./component-tts.yaml
  - ./component-ui.yaml
  - ./component-voice.yaml
  - ./component-wikipedia.yaml
  - ./component-worker.yaml
  - ./group-owner.yaml
  - ./resource-db.yaml
  - ./system-substrate.yaml
