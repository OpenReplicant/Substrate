# The catalog's root (S-193): a Backstage Location naming every entity file, so a reader such as Backstage or Morphogen
# (morphogen.yaml's backstage:) finds them all; scripts/catalog.py check fails when a file is missing from it.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: substrate-catalog
spec:
  targets:
  - ./api-anthropic-api.yaml
  - ./api-anthropic-messages.yaml
  - ./api-desktop-mcp.yaml
  - ./api-embeddings.yaml
  - ./api-kernel-http.yaml
  - ./api-kernel-mcp-memory.yaml
  - ./api-kernel-mcp-substrate.yaml
  - ./api-llama-chat-fast.yaml
  - ./api-llama-chat-slow.yaml
  - ./api-mcp-router.yaml
  - ./api-model-chat.yaml
  - ./api-model-responses.yaml
  - ./api-ollama-api.yaml
  - ./api-ui-http.yaml
  - ./component-anthropic.yaml
  - ./component-caddy.yaml
  - ./component-desktop.yaml
  - ./component-environment.yaml
  - ./component-gateway.yaml
  - ./component-kernel-catalog.yaml
  - ./component-kernel-init.yaml
  - ./component-kernel-mcp.yaml
  - ./component-kernel.yaml
  - ./component-llm-fast.yaml
  - ./component-llm.yaml
  - ./component-mcp-desktop.yaml
  - ./component-mcp-kernel.yaml
  - ./component-mcp-router.yaml
  - ./component-ollama.yaml
  - ./component-ui.yaml
  - ./group-owner.yaml
  - ./resource-db.yaml
  - ./system-substrate.yaml
